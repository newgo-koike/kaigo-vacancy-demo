<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>施設情報 | 介護施設検索システム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════
       大分ドクター 風（線画×パステル医療風）── 見た目のみ
       文言・レイアウト・情報・機能は不変。色/枠/角丸/影だけ変更。
       ══════════════════════════════════════════════════════════ */
    :root {
      --ink:#2b2b2b; --paper:#fdfdfb; --hair:#e7e7e3;
      --pink:#e88494; --pink-d:#e0707f; --pink-l:#fbe7ea;
      --blue:#5fb0de; --blue-d:#2c7ba6; --blue-l:#e4f2fa;
      --brand:#5fb0de; --brand-d:#2c7ba6; --brand-l:#e4f2fa;
      --ok:#5fb0de; --ok-bg:#e4f2fa;
      --few:#d99a2b; --few-bg:#f9efdb;
      --amber:#2b2b2b;
      --g50:#fbfbf9; --g100:#f1f1ee; --g200:#e7e7e3; --g300:#cfcfca;
      --g400:#9a9a95; --g500:#7a7a75; --g600:#5f5f5a; --g700:#454541;
      --g800:#2b2b2b; --g900:#1f1f1f;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Noto Sans JP',-apple-system,sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; visibility:hidden; }
    body.ready { visibility:visible; }

    /* HEADER */
    .hdr { background:var(--paper); height:58px; padding:0 20px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--hair); }
    .hdr-logo { width:38px; height:38px; background:transparent; border-radius:0; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hdr-title { font-size:15px; font-weight:900; color:var(--ink); letter-spacing:.03em; }
    .hdr-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .btn-back { font-size:13px; font-weight:700; color:var(--g600); text-decoration:none; padding:7px 15px; border:2px solid var(--hair); border-radius:100px; transition:all .15s; }
    .btn-back:hover { color:var(--ink); border-color:var(--ink); }
    .btn-print { font-size:13px; font-weight:900; color:white; background:var(--pink); border:2px solid var(--ink); padding:7px 17px; border-radius:100px; cursor:pointer; font-family:inherit; transition:background .15s; }
    .btn-print:hover { background:var(--pink-d); }

    /* PAGE */
    .page { max-width:680px; margin:0 auto; padding:28px 20px 80px; }

    /* HERO */
    .hero { position:relative; height:230px; border-radius:16px; overflow:hidden; background:var(--blue-l); margin-bottom:22px; border:2px solid var(--ink); }
    .hero img { width:100%; height:100%; object-fit:cover; display:block; }
    .hero-grad { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,20,40,.85) 0%,rgba(10,20,40,.1) 55%,transparent 100%); }
    .hero-name { position:absolute; bottom:16px; left:18px; right:18px; color:white; font-size:24px; font-weight:900; line-height:1.25; }
    .hero-type { position:absolute; top:14px; left:14px; background:#fff; border:1.5px solid var(--ink); color:var(--ink); font-size:12px; padding:4px 13px; border-radius:100px; font-weight:700; }
    .hero-plan { position:absolute; top:14px; right:14px; background:var(--pink); border:1.5px solid var(--ink); color:white; font-size:11px; padding:4px 12px; border-radius:100px; font-weight:700; }
    .hero-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:64px; background:var(--blue-l); }

    /* VACANCY */
    .vac-block { border-radius:14px; overflow:hidden; margin-bottom:18px; display:flex; border:2px solid var(--ink); }
    .vac-num { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 28px; min-width:110px; border-right:2px solid var(--ink); }
    .vac-ok   .vac-num { background:var(--blue-l); }
    .vac-few  .vac-num { background:var(--few-bg); }
    .vac-full .vac-num { background:var(--g100); }
    .vac-big { font-size:52px; font-weight:900; line-height:1; letter-spacing:-2px; color:var(--ink); }
    .vac-ok   .vac-big { color:var(--ink); }
    .vac-few  .vac-big { color:var(--ink); }
    .vac-full .vac-big { color:var(--g400); }
    .vac-unit { font-size:14px; font-weight:700; margin-top:-2px; color:var(--ink); }
    .vac-ok   .vac-unit { color:var(--ink); }
    .vac-few  .vac-unit { color:var(--ink); }
    .vac-full .vac-unit { color:var(--g400); }
    .vac-info { flex:1; padding:18px 20px; display:flex; flex-direction:column; justify-content:center; background:#fff; }
    .vac-ok   .vac-info { background:#fff; }
    .vac-few  .vac-info { background:#fff; }
    .vac-full .vac-info { background:#fff; }
    .vac-status { font-size:18px; font-weight:900; margin-bottom:4px; }
    .vac-ok   .vac-status { color:var(--blue-d); }
    .vac-few  .vac-status { color:#b07d1a; }
    .vac-full .vac-status { color:var(--g500); }
    .vac-notes { font-size:13px; color:var(--g700); margin-top:8px; padding:7px 11px; background:#f9efdb; border-radius:9px; border-left:3px solid #d99a2b; line-height:1.6; }
    .vac-upd { font-size:12px; color:var(--g400); margin-top:8px; }

    /* ═══ 費用セクション ══════════════════════════════════ */
    .fee-section-hd { font-size:12px; font-weight:900; color:var(--ink); letter-spacing:.06em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--hair); }
    .fee-card { display:grid; grid-template-columns:1fr 1.6fr; gap:12px; margin-bottom:18px; }
    .fee-box { border-radius:14px; padding:20px; display:flex; flex-direction:column; justify-content:center; }
    .fee-box-init { background:#fff; border:2px solid var(--hair); }
    .fee-box-monthly { background:#fff; border:2px solid var(--hair); }
    .fee-box-lbl { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:10px; text-align:center; }
    .fee-big-num { font-size:44px; font-weight:900; color:var(--ink); line-height:1; text-align:center; letter-spacing:-1px; }
    .fee-big-unit { font-size:15px; font-weight:600; color:var(--g500); }
    .fee-sub { text-align:center; margin-top:8px; }
    .fee-sub-item { font-size:12px; color:var(--g500); margin-top:4px; }
    .fee-cols { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
    .fee-col { background:var(--paper); border:1px solid var(--hair); border-radius:9px; padding:8px 4px; text-align:center; }
    .fee-col-lbl { font-size:11px; color:var(--g500); font-weight:600; }
    .fee-col-val { font-size:16px; font-weight:900; color:var(--blue-d); margin-top:2px; }
    .fee-col-unit { font-size:10px; color:var(--g400); }
    .fee-note { font-size:11px; color:var(--g400); text-align:center; margin-top:8px; }

    /* 介護費用説明 */
    .care-fee-card { background:#fff; border-radius:14px; padding:20px 24px; margin-bottom:14px; border:2px solid var(--ink); }
    .care-fee-desc { font-size:13px; color:var(--g700); line-height:1.7; margin-bottom:14px; background:var(--g50); border-radius:9px; padding:10px 14px; border-left:3px solid var(--blue); }
    .care-fee-table { width:100%; border-collapse:collapse; font-size:13px; }
    .care-fee-table th { background:var(--blue-d); color:white; padding:8px 12px; font-weight:700; text-align:left; }
    .care-fee-table th:last-child { text-align:right; }
    .care-fee-table td { padding:8px 12px; border-bottom:1px solid var(--hair); color:var(--g700); }
    .care-fee-table td:last-child { text-align:right; font-weight:700; color:var(--blue-d); }
    .care-fee-table tr:last-child td { border-bottom:none; }
    .care-fee-table tr:nth-child(even) td { background:var(--g50); }
    .care-fee-note { font-size:11px; color:var(--g400); margin-top:8px; }

    /* その他費用 */
    .other-fee-list { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
    .other-fee-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--g50); border-radius:9px; border:1px solid var(--hair); }
    .other-fee-item-lbl { font-size:13px; color:var(--g700); font-weight:500; }
    .other-fee-item-val { font-size:12px; color:var(--g500); text-align:right; }

    /* 月々の目安（大きく表示・未使用クラス保険） */
    .monthly-est-card { background:#fff; border-radius:16px; padding:28px 24px; margin-bottom:18px; border:2px solid var(--ink); text-align:center; }
    .monthly-est-label { font-size:13px; font-weight:700; color:var(--g500); margin-bottom:6px; }
    .monthly-est-num { font-size:60px; font-weight:900; color:var(--ink); line-height:1; letter-spacing:-2px; }
    .monthly-est-unit { font-size:22px; font-weight:700; color:var(--g600); }
    .monthly-est-sub { font-size:11px; color:var(--g400); margin-top:12px; line-height:1.7; }
    .monthly-est-breakdown { display:flex; justify-content:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .monthly-est-bd-item { font-size:12px; color:var(--g700); background:var(--blue-l); border-radius:100px; padding:5px 12px; }

    /* SECTION CARD */
    .sec-card { background:#fff; border-radius:14px; padding:22px 24px; margin-bottom:14px; border:2px solid var(--ink); }
    .sec-hd { font-size:13px; font-weight:900; color:var(--ink); letter-spacing:.06em; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:8px; }
    .info-rows { display:flex; flex-direction:column; gap:12px; }
    .info-row { display:flex; gap:12px; align-items:flex-start; }
    .info-lbl { font-size:13px; color:var(--g500); width:80px; flex-shrink:0; padding-top:1px; font-weight:700; }
    .info-val { font-size:15px; color:var(--g800); font-weight:500; line-height:1.5; flex:1; }

    /* COND BADGES */
    .cond-list { display:flex; flex-wrap:wrap; gap:8px; }
    .cond-badge { font-size:13px; padding:6px 14px; border-radius:100px; font-weight:700; }
    .cond-ok  { background:var(--blue-l); color:var(--blue-d); }
    .cond-sou { background:var(--few-bg); color:#b07d1a; }
    .cond-ng  { background:var(--pink-l); color:#c15564; }
    .cond-na  { background:var(--g100); color:var(--g400); }

    /* TAGS */
    .tag-list { display:flex; flex-wrap:wrap; gap:6px; }
    .tag-item { font-size:13px; padding:5px 12px; background:#fff; border:1.5px solid var(--hair); border-radius:100px; color:var(--g600); font-weight:700; }

    /* CONTACT */
    .contact-card { background:#fff; border-radius:14px; border:2px solid var(--ink); overflow:hidden; margin-bottom:14px; }
    .contact-hd { background:var(--blue-l); padding:14px 20px; font-size:14px; font-weight:900; color:var(--blue-d); border-bottom:2px solid var(--ink); }
    .contact-inner { padding:20px 24px; }
    .contact-name { font-size:14px; color:var(--g500); margin-bottom:4px; }
    .contact-tel  { font-size:36px; font-weight:900; color:var(--ink); letter-spacing:-1px; margin-bottom:16px; }
    .call-btn { display:inline-flex; align-items:center; gap:8px; padding:14px 32px; background:var(--pink); color:white; border:2px solid var(--ink); border-radius:100px; font-size:16px; font-weight:900; cursor:pointer; font-family:inherit; text-decoration:none; transition:background .15s; }
    .call-btn:hover { background:var(--pink-d); }

    /* LOCK */
    .lock-card { background:#fff; border-radius:14px; border:2px dashed var(--g300); padding:28px; text-align:center; margin-bottom:14px; }
    .lock-icon { font-size:36px; margin-bottom:8px; }
    .lock-title { font-size:16px; font-weight:900; color:var(--ink); margin-bottom:4px; }
    .lock-sub { font-size:13px; color:var(--g400); }

    /* NOTES */
    .notes-box { background:#fbfaf5; border:1.5px solid var(--hair); border-radius:12px; padding:14px 16px; margin-top:0; }
    .notes-txt  { font-size:14px; color:var(--g700); line-height:1.8; white-space:pre-wrap; }

    /* FREE PLAN BANNER */
    .free-banner { background:var(--g100); border-radius:12px; padding:18px 20px; margin-bottom:14px; text-align:center; }
    .free-banner-ttl { font-size:15px; font-weight:900; color:var(--ink); margin-bottom:6px; }
    .free-banner-sub { font-size:13px; color:var(--g400); line-height:1.6; }

    /* 2カラム印刷用ラッパー（画面では透過） */
    .print-col-l, .print-col-r { display: contents; }

    /* PRINT */
    @media print {
      @page { size:A4 portrait; margin:12mm 14mm; }
      .hdr, .btn-print, .btn-back, .hero, .contact-card, .foot-note,
      .cond-section, .feat-section, #care-fee-btn, .page > h2, .page > div[style*="margin-bottom:20px"] { display:none !important; }
      #care-fee-detail-row { display:table-row !important; }
      body { background:white; }
      .page { max-width:100%; padding:0; margin:0; display:block; }
      .print-only { display:block !important; margin-bottom:5px; }
      .print-col-l, .print-col-r { display:block; }

      /* 施設名ヘッダー */
      .print-fac-hdr { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px; padding-bottom:4px; border-bottom:2px solid #2b2b2b; }
      .print-fac-name { font-size:13px; font-weight:900; color:#0f172a; }
      .print-fac-name span { font-size:9px; font-weight:600; color:#64748b; margin-left:6px; }
      .print-hd { font-size:8px; color:#94a3b8; }

      /* 空室ブロック */
      .vac-block { margin-bottom:5px; }
      .vac-num { padding:5px 10px; min-width:50px; }
      .vac-big { font-size:18px; }
      .vac-info { padding:5px 10px; }
      .vac-status { font-size:10px; }
      .vac-notes { font-size:8px; padding:2px 6px; margin-top:2px; }
      .vac-upd { font-size:8px; margin-top:2px; }

      /* セクションカード */
      .sec-card { padding:5px 9px; margin-bottom:5px; box-shadow:none; border-radius:5px; }
      .sec-hd { font-size:8px; margin-bottom:4px; padding-bottom:3px; color:#1e293b !important; }
      .info-rows { gap:2px; }
      .info-lbl { font-size:8px; width:38px; color:#374151 !important; }
      .info-val { font-size:9px; color:#111827 !important; }

      /* 月々バナー */
      .monthly-banner { padding:8px 12px 7px !important; margin-bottom:5px !important; border-radius:6px !important; text-align:center !important; }
      .est-big { font-size:20pt !important; letter-spacing:-1px !important; line-height:1 !important; }
      .est-unit { font-size:11pt !important; }
      .monthly-banner * { color:#fff !important; }
      .monthly-banner-contact { padding:3px 8px !important; font-size:8px !important; margin-top:5px !important; }

      /* 基本料金カード */
      .fee-card { gap:4px; margin-bottom:5px; }
      .fee-box { padding:5px 7px; border-radius:5px; }
      .fee-box-lbl { font-size:7px; margin-bottom:2px; }
      .fee-big-num { font-size:14px; }
      .fee-big-unit { font-size:7px; }
      .fee-sub { margin-top:2px; }
      .fee-sub-item { font-size:7px; margin-top:1px; }
      .fee-cols { margin-top:3px; gap:3px; }
      .fee-col { padding:2px; }
      .fee-col-lbl { font-size:7px; }
      .fee-col-val { font-size:9px; }

      /* 費用詳細ノート */
      .sec-card[style*="border-left:4px solid #d97706"] { padding:4px 7px !important; background:#fffbeb !important; }
      .sec-card[style*="border-left:4px solid #d97706"] * { font-size:8px !important; line-height:1.4 !important; color:#78350f !important; }

      /* その他費用テーブル */
      .sec-card table { font-size:8px; }
      .sec-card table th { padding:3px 5px !important; font-size:7px !important; white-space:nowrap !important; }
      .sec-card table td { padding:3px 5px !important; font-size:8px !important; color:#1e293b !important; white-space:nowrap !important; }
      .sec-card table td[style*="color:#64748b"] { color:#374151 !important; }
      .sec-card table td[style*="color:#94a3b8"] { color:#6b7280 !important; }

      /* 負担割合展開テーブル内のメモ */
      #care-fee-detail-row td > div[style*="fef3c7"] { padding:4px 8px !important; font-size:7px !important; margin-bottom:4px !important; }
      #care-fee-detail-row td > div[style*="94a3b8"] { font-size:7px !important; margin-top:3px !important; }

      /* 印刷カラー保持 */
      * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
    .print-only { display:none; }
    .print-hd { font-size:11px; color:var(--g400); text-align:right; margin-bottom:12px; }
    .foot-note { text-align:center; font-size:12px; color:var(--g400); margin-top:28px; line-height:1.8; }

    .state-msg { text-align:center; padding:80px 20px; color:var(--g400); font-size:16px; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo"><img src="logo.png" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.3))"></div>
  <div class="hdr-title">介護施設検索</div>
  <div class="hdr-right">
    <a href="kaigo-search.html" class="btn-back">← 検索に戻る</a>
    <button class="btn-print" onclick="printSheet()">🖨 印刷・PDF</button>
  </div>
</header>

<div class="page" id="page">
  <div class="state-msg">読み込み中...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="kaigo-print.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const db   = firebase.firestore();
const auth = firebase.auth();
const id   = new URLSearchParams(location.search).get('id');
const page = document.getElementById('page');
let currentDoc = null;

// 「印刷」＝検索結果からの単票資料出力と同じ体裁のシートを別タブで開く
function printSheet() {
  if (!currentDoc) return;
  KaigoPrint.printFacilitySheet(currentDoc, {
    vacancyInquiry: true,
    onBlocked: () => alert('ポップアップがブロックされました。ブラウザの許可設定をご確認ください。'),
  });
}

auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'kaigo-login.html'; return; }
  const uSnap = await db.collection('users').doc(user.uid).get();
  const role  = uSnap.data()?.role;
  if (!['hospital','admin'].includes(role)) { location.href = 'kaigo-login.html'; return; }
  document.body.classList.add('ready');
  if (!id) { page.innerHTML = '<div class="state-msg">⚠️ 施設IDが指定されていません。</div>'; return; }
  load();
});

function load() {
  db.collection('facilities').doc(id).onSnapshot(doc => {
    if (!doc.exists) { page.innerHTML = '<div class="state-msg">施設が見つかりませんでした。</div>'; return; }
    currentDoc = doc;
    render(doc);
  }, e => { page.innerHTML = `<div class="state-msg">⚠️ ${e.message}</div>`; });
}

function fmtYen(v) { return v != null ? Number(v).toLocaleString('ja-JP') : null; }
function toMan(v)  { return v != null ? Math.round(v / 1000) / 10 : null; }

function toggleCareFeeDetail() {
  const el  = document.getElementById('care-fee-detail-row');
  const btn = document.getElementById('care-fee-btn');
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display  = open ? 'none' : 'table-row';
  btn.textContent   = open ? btn.dataset.open : btn.dataset.close;
}

// ── 施設種別ごとの「その他かかる費用の目安」（令和6年度介護報酬改定・単価10円・30日換算） ─────
const COST_CATEGORIES = {
  '住宅型有料': {
    careDisplay:'1.7〜3.6 万円', careNote:'※要介護1の場合', careMin:1.7, careMax:3.6,
    careDesc:'介護保険の自己負担分（1割負担の場合）', careSub:'訪問介護・デイサービス等の利用量、要介護度・負担割合により変動',
    medDisplay:'0.3〜1.0 万円', medMin:0.3, medMax:1.0,
    medDesc:'薬代などの医薬品費（1割負担の場合）', medSub:'負担割合（1〜3割）により変動',

function renderCostDetailTable(cat) {
  const colColor = label => label.includes('2割') ? '#d97706' : label.includes('3割') ? '#dc2626' : '#2c7ba6';
  const headerCells = cat.detailCols.map((c,i) =>
    `<th style="padding:7px 12px;color:white;text-align:right;font-weight:700;${i<cat.detailCols.length-1?'border-right:1px solid rgba(255,255,255,.25);':''}white-space:nowrap">${c}</th>`
  ).join('');
  const bodyRows = cat.detailRows.map((r,i) => {
    const bg = i % 2 === 0 ? 'background:#eef7fc;' : '';
    const cells = r.slice(1).map((v,j) => {
      const last = j === cat.detailCols.length - 1;
      return `<td style="padding:6px 12px;text-align:right;color:${colColor(cat.detailCols[j])};font-weight:700;${last?'':'border-right:1px solid #d3ebf7'}">${v}</td>`;
    }).join('');
    return `<tr style="${bg}border-bottom:1px solid #d3ebf7"><td style="padding:6px 12px;text-align:center;font-weight:700;color:#1e293b;white-space:nowrap">${r[0]}</td>${cells}</tr>`;
  }).join('');
  return `
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead>
        <tr style="background:#2c7ba6">
          <th style="padding:7px 12px;color:white;text-align:center;font-weight:700;border-right:1px solid rgba(255,255,255,.25);white-space:nowrap">要介護度</th>
          ${headerCells}
        </tr>
      </thead>
      <tbody>${bodyRows}</tbody>
    </table>
    ${cat.footnotes.map(f => `<div style="font-size:10px;color:#94a3b8;margin-top:6px;line-height:1.6">※ ${f}</div>`).join('')}
  `;
}

function render(doc) {
  const d      = doc.data();
  const vac    = typeof d.vacancy === 'number' ? d.vacancy : 0;
  const upd    = d.updatedAt ? d.updatedAt.toDate() : new Date();
  const days   = Math.floor((new Date() - upd) / 86400000);
  const updStr = upd.toLocaleDateString('ja-JP');
  const isPaid = d.plan === 'paid';
  // ※暫定運用: 空室データ未整備のため空室状況はすべて「要問い合わせ」表示。整備後は false に戻す
  const VACANCY_INQUIRY = true;
  const vacCls  = VACANCY_INQUIRY ? 'vac-ok' : vac === 0 ? 'vac-full' : vac <= 2 ? 'vac-few' : 'vac-ok';
  const status  = VACANCY_INQUIRY ? '空室状況はお問い合わせください' : vac === 0 ? '現在満室です' : vac <= 2 ? `残り${vac}室 — お早めにご相談ください` : `${vac}室 空きあり`;
  const vacBig  = VACANCY_INQUIRY ? '要' : vac;
  const vacUnit = VACANCY_INQUIRY ? '問い合わせ' : '室空き';
  // station は stationsArr/stationHtml で代替（後述）

  // 費用
  const rent    = d.rent ?? null;
  const mgmt    = d.managementFee ?? null;
  const meal    = d.mealFee ?? null;
  const other   = d.otherFee ?? null;
  // 入居時費用は「入居一時金（返還なし）＋敷金（退去時返還）」の合算。
  // 元リストの「初期費用合計」列がこの定義（=一時金+敷金）で、検索結果・資料出力も合算で出している。
  // 一時金を見るだけだと、敷金のみの施設（全体の4割強）で 0円 と表示されてしまう。
  const initFeeAmt = d.initialFeeAmount ?? 0;   // 入居一時金（返還なし）
  const depositAmt = d.depositAmount ?? 0;      // 敷金（退去時返還）
  const initAmt    = initFeeAmt + depositAmt;   // 入居時費用の合計
  const hasBreakdown = rent != null || mgmt != null || meal != null;
  const total = hasBreakdown
    ? Math.round((rent||0)+(mgmt||0)+(meal||0)+(other||0))
    : (d.monthlyFee ?? null);
  const totalMan = toMan(total); // 円 → 万円（月々目安計算用）

  // 駅（沿線対応）
  const stationsArr = d.stations || [];
  const stationHtml = stationsArr.length
    ? stationsArr.map(s => `<div class="info-row"><span class="info-lbl">最寄り駅</span><span class="info-val">🚉 ${[s.line, s.name ? s.name+'駅' : '', s.walk ? '徒歩'+s.walk+'分' : s.dist||''].filter(Boolean).join('　')}</span></div>`).join('')
    : (d.station ? `<div class="info-row"><span class="info-lbl">最寄り駅</span><span class="info-val">🚉 ${[d.stationLine, d.station, d.stationDistance].filter(Boolean).join('　')}</span></div>` : '');

  document.title = `${d.name||'施設情報'} | 介護施設検索システム`;

  // ── ① 基本料金カード ──────────────────────────────────────
  const feeBreakCols = [
    {lbl:'賃料',  val:rent},
    {lbl:'管理費',val:mgmt},
    {lbl:'食費',  val:meal},
  ].filter(i => i.val != null);

  const feeCard = `
  <div class="sec-card">
    <div class="sec-hd">💴 基本料金（施設への直接支払い）</div>
    <div class="fee-card">
      <div class="fee-box fee-box-init">
        <div class="fee-box-lbl">入居一時金</div>
        <div class="fee-big-num">${fmtYen(initAmt)}<span class="fee-big-unit">円</span></div>
        ${other != null ? `<div class="fee-sub"><div class="fee-sub-item">その他 ${fmtYen(other)}円</div></div>` : ''}
      </div>
      <div class="fee-box fee-box-monthly">
        <div class="fee-box-lbl">月額費用（施設負担分）</div>
        <div class="fee-big-num">${fmtYen(total) ?? '─'}<span class="fee-big-unit">円</span></div>
        ${feeBreakCols.length ? `
        <div class="fee-cols">
          ${feeBreakCols.map(i=>`<div class="fee-col"><div class="fee-col-lbl">${i.lbl}</div><div class="fee-col-val">${fmtYen(i.val)}</div><div class="fee-col-unit">円</div></div>`).join('')}
        </div>` : ''}
      </div>
    </div>
  </div>`;

  // ── ② 介護費用の説明 ─────────────────────────────────────
  // ── ③ 追加費用3項目＋月々合計 ──────────────────────────
  // 施設種別（d.type）ごとの介護費用・医療費・その他生活費レンジを使用（COST_CATEGORIES参照）
  const costCat = COST_CATEGORIES[d.type] || COST_CATEGORIES['住宅型有料'];
  const estMin = totalMan ? Math.round((totalMan + costCat.careMin + costCat.medMin + costCat.lifeMin) * 10) / 10 : null;
  const estMax = totalMan ? Math.round((totalMan + costCat.careMax + costCat.medMax + costCat.lifeMax) * 10) / 10 : null;

  const costBreakdownCard = renderCostBreakdownCard(d.type);

  const careFeeCard = '';
  const otherFeeCard = '';
  const monthlyEstCard = '';

  // ── ④ 費用に関する詳細（feeNotes） ──────────────────────────
  const feeNotesCard = d.feeNotes ? `
  <div class="sec-card" style="border-left:4px solid #d97706;background:#fffbeb">
    <div class="sec-hd" style="color:#92400e">📋 費用に関する詳細</div>
    <div style="font-size:13px;color:#78350f;line-height:1.9">
      ${d.feeNotes.split(/\n/).flatMap(line => line.split(/(?=※)/)).map(line => line.trim()).filter(Boolean).map(line =>
        `<div style="padding:3px 0;border-bottom:1px solid #fde68a;last-child:border-none">${line}</div>`
      ).join('')}
    </div>
  </div>` : '';

  // ── ⑤ 備考・お知らせ ────────────────────────────────────────
  const notesLines = [d.campaign, d.vacancyNotes].filter(Boolean).flatMap(t => t.split(/\n/).map(l => l.trim()).filter(Boolean));
  const notesCard = notesLines.length ? `
  <div class="sec-card">
    <div class="sec-hd">📝 備考・お知らせ</div>
    <div class="notes-box">
      <ul style="margin:0;padding-left:20px">${notesLines.map(l => `<li style="font-size:14px;color:var(--g700);line-height:1.9;padding:2px 0">${l}</li>`).join('')}</ul>
    </div>
  </div>` : '';

  // ── 入居条件 ──────────────────────────────────────────────
  function condBadge(lbl, val) {
    if (!val) return `<span class="cond-badge cond-na">${lbl}：未入力</span>`;
    const cls = val === '可' ? 'cond-ok' : val === '相談可' ? 'cond-sou' : 'cond-ng';
    return `<span class="cond-badge ${cls}">${lbl}：${val}</span>`;
  }
  const condHtml = [
    condBadge('生活保護', d.seikatsuHogo),
    condBadge('身元保証なし', d.mimonHosho),
    condBadge('介護認定なし', d.kaigoNintei),
  ].join('');

  const photo = d.photoUrl || '';
  const heroContent = photo
    ? `<img src="${photo}" alt="${d.name||''}" loading="lazy">`
    : `<div class="hero-placeholder">🏠</div>`;

  // ── 有料プランのフルページ ────────────────────────────────
  if (isPaid) {
    page.innerHTML = `
      <div class="print-only"><div class="print-fac-hdr"><div class="print-fac-name">${d.name||''}<span>${d.type||''}</span></div><div class="print-hd">印刷日：${new Date().toLocaleDateString('ja-JP')}　介護施設検索システム</div></div></div>

      <div class="hero">
        ${heroContent}
        ${photo ? '<div class="hero-grad"></div>' : ''}
        ${photo ? `<div class="hero-name">${d.name||''}</div>` : ''}
        ${d.type ? `<div class="hero-type">${d.type}</div>` : ''}
        <div class="hero-plan">✓ 掲載施設</div>
      </div>
      ${!photo ? `<h2 style="font-size:22px;font-weight:900;color:var(--g900);margin-bottom:18px">${d.name||''} ${d.type ? `<span style="font-size:14px;background:var(--g100);color:var(--g600);padding:3px 10px;border-radius:6px;font-weight:700;margin-left:8px">${d.type}</span>` : ''}</h2>` : ''}

      <div class="print-col-l">
      <div class="vac-block ${vacCls}">
        <div class="vac-num">
          <div class="vac-big">${vacBig}</div>
          <div class="vac-unit">${vacUnit}</div>
        </div>
        <div class="vac-info">
          <div class="vac-status">${status}</div>
          ${d.vacancyNotes ? `<div class="vac-notes">📝 ${d.vacancyNotes}</div>` : ''}
          <div class="vac-upd">更新日：${updStr}${days > 14 ? ' ⚠️ 古い情報の可能性があります' : ''}</div>
        </div>
      </div>

      <div class="sec-card">
        <div class="sec-hd">📍 アクセス・所在地</div>
        <div class="info-rows">
          ${d.address ? `<div class="info-row"><span class="info-lbl">住所</span><span class="info-val">${d.address}</span></div>` : ''}
          ${stationHtml}
          ${d.city    ? `<div class="info-row"><span class="info-lbl">エリア</span><span class="info-val">${d.prefecture||''} ${d.city||''}</span></div>` : ''}
        </div>
      </div>

      ${estMin ? `
      <div class="monthly-banner" style="background:linear-gradient(135deg,#5fb0de,#2c7ba6);border:2px solid #2b2b2b;border-radius:14px;padding:28px 22px 22px;margin-bottom:14px;box-shadow:none;text-align:center;">
        <div style="font-size:12px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:12px;letter-spacing:.05em;">月々の費用（目安・すべて含む）</div>
        <div style="line-height:1;margin-bottom:6px;">
          <span class="est-big" style="font-size:64px;font-weight:900;color:white;letter-spacing:-2px;">約 ${estMin}〜${estMax}</span>
          <span class="est-unit" style="font-size:26px;font-weight:700;color:rgba(255,255,255,.9);"> 万円</span>
        </div>
        <div class="monthly-banner-contact" style="background:rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;font-size:13px;color:white;line-height:1.7;text-align:center;width:100%;margin-top:16px;">
          空室状況・連絡先は　<strong>Meets Medical</strong>　までお問い合わせください
        </div>
      </div>` : `
      <div style="background:var(--g50);border-radius:14px;padding:16px 20px;margin-bottom:14px;border:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px;color:var(--g500)">月々の費用目安は基本料金が入力されると表示されます</div>
        <div style="font-size:12px;color:var(--g500);line-height:1.7;text-align:right">空室状況・連絡先は<br><strong>Meets Medical</strong>までお問い合わせください</div>
      </div>`}
      </div>

      <div class="print-col-r">
      ${feeCard}
      ${feeNotesCard}
      ${costBreakdownCard}

      <div class="sec-card cond-section">
        <div class="sec-hd">✅ 入居条件</div>
        <div class="cond-list">${condHtml}</div>
      </div>

      <div class="contact-card">
        <div class="contact-hd">📞 入居相談・見学申し込み</div>
        <div class="contact-inner">
          ${d.contactName ? `<div class="contact-name">担当：${d.contactName}</div>` : ''}
          ${d.contactTel  ? `<div class="contact-tel">${d.contactTel}</div><a class="call-btn" href="tel:${d.contactTel}">📞 電話で問い合わせる</a>` : '<div class="contact-name" style="color:var(--g400)">連絡先は未入力です</div>'}
        </div>
      </div>

      ${d.features && d.features.length ? `
      <div class="sec-card feat-section">
        <div class="sec-hd">🏷 特徴・こだわり</div>
        <div class="tag-list">${d.features.map(t=>`<span class="tag-item">${t}</span>`).join('')}</div>
      </div>` : ''}

      ${notesCard}
      </div>

      <div class="foot-note">
        このページは施設担当者が随時更新しています。<br>
        空室状況は変動しますので、直接お問い合わせください。
      </div>`;

  } else {
    // ── 無料プラン（アクセス＋費用のみ） ─────────────────────
    page.innerHTML = `
      <div class="print-only"><div class="print-fac-hdr"><div class="print-fac-name">${d.name||''}<span>${d.type||''}</span></div><div class="print-hd">印刷日：${new Date().toLocaleDateString('ja-JP')}　介護施設検索システム</div></div></div>

      <div style="margin-bottom:20px">
        <h2 style="font-size:22px;font-weight:900;color:var(--g900);margin-bottom:8px">
          ${d.name||''}
          ${d.type ? `<span style="font-size:14px;background:var(--g100);color:var(--g600);padding:4px 12px;border-radius:6px;font-weight:700;margin-left:10px">${d.type}</span>` : ''}
        </h2>
        <div style="font-size:14px;color:var(--g400)">${d.city || d.prefecture || ''}</div>
      </div>

      <div class="sec-card">
        <div class="sec-hd">📍 アクセス・所在地</div>
        <div class="info-rows">
          ${d.address ? `<div class="info-row"><span class="info-lbl">住所</span><span class="info-val">${d.address}</span></div>` : ''}
          ${stationHtml}
          ${d.city    ? `<div class="info-row"><span class="info-lbl">エリア</span><span class="info-val">${d.prefecture||''} ${d.city||''}</span></div>` : ''}
        </div>
      </div>

      ${estMin ? `
      <div class="monthly-banner" style="background:linear-gradient(135deg,#5fb0de,#2c7ba6);border:2px solid #2b2b2b;border-radius:14px;padding:28px 22px 22px;margin-bottom:14px;box-shadow:none;text-align:center;">
        <div style="font-size:12px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:12px;letter-spacing:.05em;">月々の費用（目安・すべて含む）</div>
        <div style="line-height:1;margin-bottom:6px;">
          <span class="est-big" style="font-size:64px;font-weight:900;color:white;letter-spacing:-2px;">約 ${estMin}〜${estMax}</span>
          <span class="est-unit" style="font-size:26px;font-weight:700;color:rgba(255,255,255,.9);"> 万円</span>
        </div>
        <div class="monthly-banner-contact" style="background:rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;font-size:13px;color:white;line-height:1.7;text-align:center;width:100%;margin-top:16px;">
          空室状況・連絡先は　<strong>Meets Medical</strong>　までお問い合わせください
        </div>
      </div>` : `
      <div style="background:var(--g50);border-radius:14px;padding:16px 20px;margin-bottom:14px;border:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px;color:var(--g500)">月々の費用目安は基本料金が入力されると表示されます</div>
        <div style="font-size:12px;color:var(--g500);line-height:1.7;text-align:right">空室状況・連絡先は<br><strong>Meets Medical</strong>までお問い合わせください</div>
      </div>`}

      ${feeCard}
      ${feeNotesCard}
      ${costBreakdownCard}

      ${notesCard}

      <div class="foot-note">
        このページは介護施設検索システムの施設情報ページです。<br>
        Powered by Meets Medical
      </div>`;
  }
}
</script>
</body>
</html>
