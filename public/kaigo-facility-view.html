<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>施設情報 | 介護施設検索システム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand:#0d9488; --brand-d:#0f766e; --brand-l:#f0fdfa;
      --ok:#16a34a; --ok-bg:#dcfce7;
      --few:#ea580c; --few-bg:#ffedd5;
      --amber:#d97706;
      --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0;
      --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155;
      --g800:#1e293b; --g900:#0f172a;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Noto Sans JP',-apple-system,sans-serif; background:var(--g50); color:var(--g800); -webkit-font-smoothing:antialiased; visibility:hidden; }
    body.ready { visibility:visible; }

    /* HEADER */
    .hdr { background:var(--g900); height:56px; padding:0 20px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; }
    .hdr-logo { width:30px; height:30px; background:var(--brand); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; }
    .hdr-title { font-size:15px; font-weight:700; color:white; }
    .hdr-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .btn-back { font-size:13px; color:var(--g400); text-decoration:none; padding:6px 14px; border:1px solid rgba(255,255,255,.2); border-radius:7px; transition:all .15s; }
    .btn-back:hover { color:white; border-color:rgba(255,255,255,.4); }
    .btn-print { font-size:13px; font-weight:700; color:white; background:var(--brand); border:none; padding:7px 16px; border-radius:8px; cursor:pointer; font-family:inherit; transition:background .15s; }
    .btn-print:hover { background:var(--brand-d); }

    /* PAGE */
    .page { max-width:680px; margin:0 auto; padding:28px 20px 80px; }

    /* HERO */
    .hero { position:relative; height:230px; border-radius:16px; overflow:hidden; background:var(--g200); margin-bottom:22px; box-shadow:0 4px 16px rgba(0,0,0,.1); }
    .hero img { width:100%; height:100%; object-fit:cover; display:block; }
    .hero-grad { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,20,40,.85) 0%,rgba(10,20,40,.1) 55%,transparent 100%); }
    .hero-name { position:absolute; bottom:16px; left:18px; right:18px; color:white; font-size:24px; font-weight:900; line-height:1.25; }
    .hero-type { position:absolute; top:14px; left:14px; background:rgba(10,20,40,.55); backdrop-filter:blur(8px); color:white; font-size:12px; padding:5px 13px; border-radius:20px; font-weight:700; }
    .hero-plan { position:absolute; top:14px; right:14px; background:var(--brand); color:white; font-size:11px; padding:5px 12px; border-radius:20px; font-weight:700; }
    .hero-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:64px; background:linear-gradient(135deg,#e2e8f0,#cbd5e1); }

    /* VACANCY */
    .vac-block { border-radius:14px; overflow:hidden; margin-bottom:18px; display:flex; box-shadow:0 2px 8px rgba(0,0,0,.07); }
    .vac-num { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 28px; min-width:110px; }
    .vac-ok   .vac-num { background:var(--ok-bg); }
    .vac-few  .vac-num { background:var(--few-bg); }
    .vac-full .vac-num { background:var(--g100); }
    .vac-big { font-size:56px; font-weight:900; line-height:1; letter-spacing:-3px; }
    .vac-ok   .vac-big { color:var(--ok); }
    .vac-few  .vac-big { color:var(--few); }
    .vac-full .vac-big { color:var(--g400); }
    .vac-unit { font-size:14px; font-weight:700; margin-top:-2px; }
    .vac-ok   .vac-unit { color:var(--ok); }
    .vac-few  .vac-unit { color:var(--few); }
    .vac-full .vac-unit { color:var(--g400); }
    .vac-info { flex:1; padding:18px 20px; display:flex; flex-direction:column; justify-content:center; }
    .vac-ok   .vac-info { background:color-mix(in srgb,var(--ok-bg) 30%,white); }
    .vac-few  .vac-info { background:color-mix(in srgb,var(--few-bg) 30%,white); }
    .vac-full .vac-info { background:var(--g50); }
    .vac-status { font-size:18px; font-weight:800; margin-bottom:4px; }
    .vac-ok   .vac-status { color:var(--ok); }
    .vac-few  .vac-status { color:var(--few); }
    .vac-full .vac-status { color:var(--g500); }
    .vac-notes { font-size:13px; color:var(--g600); margin-top:8px; padding:7px 11px; background:rgba(217,119,6,.08); border-radius:7px; border-left:3px solid #d97706; line-height:1.6; }
    .vac-upd { font-size:12px; color:var(--g400); margin-top:8px; }

    /* ═══ 費用セクション ══════════════════════════════════ */
    /* 基本料金カード */
    .fee-section-hd { font-size:12px; font-weight:800; color:var(--g500); letter-spacing:.08em; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--g100); }
    .fee-card { display:grid; grid-template-columns:1fr 1.6fr; gap:12px; margin-bottom:18px; }
    .fee-box { border-radius:14px; padding:20px; }
    .fee-box-init { background:#ecfdf5; border:1px solid #a7f3d0; }
    .fee-box-monthly { background:#ecfdf5; border:1px solid #a7f3d0; }
    .fee-box-lbl { font-size:13px; font-weight:700; color:var(--brand-d); margin-bottom:10px; text-align:center; }
    .fee-big-num { font-size:44px; font-weight:900; color:var(--amber); line-height:1; text-align:center; }
    .fee-big-unit { font-size:15px; font-weight:600; color:var(--g500); }
    .fee-sub { text-align:center; margin-top:8px; }
    .fee-sub-item { font-size:12px; color:var(--g500); margin-top:4px; }
    .fee-cols { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
    .fee-col { background:rgba(255,255,255,.7); border-radius:8px; padding:8px 4px; text-align:center; }
    .fee-col-lbl { font-size:11px; color:var(--g500); font-weight:600; }
    .fee-col-val { font-size:16px; font-weight:800; color:var(--ok); margin-top:2px; }
    .fee-col-unit { font-size:10px; color:var(--g400); }
    .fee-note { font-size:11px; color:var(--g400); text-align:center; margin-top:8px; }

    /* 介護費用説明 */
    .care-fee-card { background:white; border-radius:14px; padding:20px 24px; margin-bottom:14px; border:1px solid var(--g200); box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .care-fee-desc { font-size:13px; color:var(--g600); line-height:1.7; margin-bottom:14px; background:var(--g50); border-radius:8px; padding:10px 14px; border-left:3px solid var(--brand); }
    .care-fee-table { width:100%; border-collapse:collapse; font-size:13px; }
    .care-fee-table th { background:var(--brand); color:white; padding:8px 12px; font-weight:700; text-align:left; }
    .care-fee-table th:last-child { text-align:right; }
    .care-fee-table td { padding:8px 12px; border-bottom:1px solid var(--g100); color:var(--g700); }
    .care-fee-table td:last-child { text-align:right; font-weight:700; color:var(--ok); }
    .care-fee-table tr:last-child td { border-bottom:none; }
    .care-fee-table tr:nth-child(even) td { background:var(--g50); }
    .care-fee-note { font-size:11px; color:var(--g400); margin-top:8px; }

    /* その他費用 */
    .other-fee-list { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; }
    .other-fee-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--g50); border-radius:8px; border:1px solid var(--g100); }
    .other-fee-item-lbl { font-size:13px; color:var(--g700); font-weight:500; }
    .other-fee-item-val { font-size:12px; color:var(--g500); text-align:right; }

    /* 月々の目安（大きく表示） */
    .monthly-est-card { background:linear-gradient(135deg, #047857, #059669); border-radius:18px; padding:28px 24px; margin-bottom:18px; border:none; text-align:center; box-shadow:0 8px 32px rgba(5,150,105,.3); }
    .monthly-est-label { font-size:13px; font-weight:700; color:rgba(255,255,255,.8); margin-bottom:6px; }
    .monthly-est-num { font-size:60px; font-weight:900; color:white; line-height:1; letter-spacing:-2px; }
    .monthly-est-unit { font-size:22px; font-weight:700; color:rgba(255,255,255,.9); }
    .monthly-est-sub { font-size:11px; color:rgba(255,255,255,.65); margin-top:12px; line-height:1.7; }
    .monthly-est-breakdown { display:flex; justify-content:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .monthly-est-bd-item { font-size:12px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.15); border-radius:6px; padding:5px 12px; }

    /* SECTION CARD */
    .sec-card { background:white; border-radius:14px; padding:22px 24px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:14px; border:1px solid var(--g200); }
    .sec-hd { font-size:13px; font-weight:800; color:var(--g500); letter-spacing:.08em; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--g100); display:flex; align-items:center; gap:8px; }
    .info-rows { display:flex; flex-direction:column; gap:12px; }
    .info-row { display:flex; gap:12px; align-items:flex-start; }
    .info-lbl { font-size:13px; color:var(--g400); width:80px; flex-shrink:0; padding-top:1px; font-weight:500; }
    .info-val { font-size:15px; color:var(--g700); font-weight:500; line-height:1.5; flex:1; }

    /* COND BADGES */
    .cond-list { display:flex; flex-wrap:wrap; gap:8px; }
    .cond-badge { font-size:13px; padding:7px 14px; border-radius:8px; font-weight:700; }
    .cond-ok  { background:#dcfce7; color:#15803d; }
    .cond-sou { background:#fef3c7; color:#92400e; }
    .cond-ng  { background:#fee2e2; color:#991b1b; }
    .cond-na  { background:var(--g100); color:var(--g400); }

    /* TAGS */
    .tag-list { display:flex; flex-wrap:wrap; gap:6px; }
    .tag-item { font-size:13px; padding:5px 11px; background:var(--g100); border-radius:6px; color:var(--g600); font-weight:500; }

    /* CONTACT */
    .contact-card { background:white; border-radius:14px; border:2px solid var(--brand); box-shadow:0 4px 18px rgba(13,148,136,.12); overflow:hidden; margin-bottom:14px; }
    .contact-hd { background:var(--brand-l); padding:14px 20px; font-size:14px; font-weight:800; color:var(--brand-d); border-bottom:1px solid #99f6e4; }
    .contact-inner { padding:20px 24px; }
    .contact-name { font-size:14px; color:var(--g500); margin-bottom:4px; }
    .contact-tel  { font-size:36px; font-weight:900; color:var(--brand-d); letter-spacing:-1px; margin-bottom:16px; }
    .call-btn { display:inline-flex; align-items:center; gap:8px; padding:14px 32px; background:var(--brand); color:white; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; transition:background .15s; }
    .call-btn:hover { background:var(--brand-d); }

    /* LOCK */
    .lock-card { background:white; border-radius:14px; border:1px dashed var(--g300); padding:28px; text-align:center; margin-bottom:14px; }
    .lock-icon { font-size:36px; margin-bottom:8px; }
    .lock-title { font-size:16px; font-weight:700; color:var(--g600); margin-bottom:4px; }
    .lock-sub { font-size:13px; color:var(--g400); }

    /* NOTES */
    .notes-box { background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:14px 16px; margin-top:0; }
    .notes-txt  { font-size:14px; color:var(--g700); line-height:1.8; white-space:pre-wrap; }

    /* FREE PLAN BANNER */
    .free-banner { background:var(--g100); border-radius:12px; padding:18px 20px; margin-bottom:14px; text-align:center; }
    .free-banner-ttl { font-size:15px; font-weight:700; color:var(--g600); margin-bottom:6px; }
    .free-banner-sub { font-size:13px; color:var(--g400); line-height:1.6; }

    /* PRINT */
    @media print {
      @page { size:A4 portrait; margin:8mm; }
      .hdr, .btn-print, .btn-back, .hero, .contact-card, .foot-note,
      .cond-section, .feat-section { display:none !important; }
      body { background:white; }
      .page { max-width:100%; padding:0; margin:0; }
      .print-only { display:block !important; }

      /* 施設名ヘッダー */
      .print-fac-hdr { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; padding-bottom:7px; border-bottom:2px solid #0d9488; }
      .print-fac-name { font-size:16px; font-weight:900; color:#0f172a; }
      .print-fac-name span { font-size:11px; font-weight:600; color:#64748b; margin-left:8px; }
      .print-hd { font-size:9px; color:#94a3b8; }

      /* 空室ブロック */
      .vac-block { margin-bottom:8px; }
      .vac-num { padding:8px 14px; min-width:68px; }
      .vac-big { font-size:28px; }
      .vac-info { padding:8px 12px; }
      .vac-status { font-size:13px; }
      .vac-notes { font-size:10px; padding:4px 8px; margin-top:4px; }
      .vac-upd { font-size:10px; margin-top:3px; }

      /* セクションカード */
      .sec-card { padding:9px 12px; margin-bottom:8px; box-shadow:none; border-radius:8px; }
      .sec-hd { font-size:10px; margin-bottom:7px; padding-bottom:5px; }
      .info-rows { gap:4px; }
      .info-lbl { font-size:10px; width:50px; }
      .info-val { font-size:11px; }

      /* 月々バナー */
      .monthly-banner { padding:9px 14px !important; margin-bottom:8px !important; border-radius:8px !important; }
      .est-big { font-size:22px !important; }
      .est-unit { font-size:13px !important; }
      .monthly-banner-contact { padding:7px 10px !important; font-size:11px !important; }

      /* 基本料金カード */
      .fee-card { gap:6px; margin-bottom:8px; }
      .fee-box { padding:9px 12px; border-radius:8px; }
      .fee-box-lbl { font-size:10px; margin-bottom:4px; }
      .fee-big-num { font-size:26px; }
      .fee-big-unit { font-size:11px; }
      .fee-sub { margin-top:3px; }
      .fee-sub-item { font-size:9px; margin-top:1px; }
      .fee-cols { margin-top:6px; gap:4px; }
      .fee-col { padding:5px 4px; }
      .fee-col-lbl { font-size:9px; }
      .fee-col-val { font-size:13px; }

      /* 内訳テーブル */
      .sec-card table { font-size:11px; }
      .sec-card table th { padding:5px 8px !important; font-size:10px !important; }
      .sec-card table td { padding:5px 8px !important; font-size:11px !important; }
      .sec-card table td[style*="font-size:28px"] { font-size:18px !important; }
    }
    .print-only { display:none; }
    .print-hd { font-size:11px; color:var(--g400); text-align:right; margin-bottom:12px; }
    .foot-note { text-align:center; font-size:12px; color:var(--g400); margin-top:28px; line-height:1.8; }

    .state-msg { text-align:center; padding:80px 20px; color:var(--g400); font-size:16px; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">🏠</div>
  <div class="hdr-title">介護施設検索システム</div>
  <div class="hdr-right">
    <a href="kaigo-search.html" onclick="history.back();return false;" class="btn-back">← 検索に戻る</a>
    <button class="btn-print" onclick="window.print()">🖨 印刷・PDF</button>
  </div>
</header>

<div class="page" id="page">
  <div class="state-msg">読み込み中...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const db   = firebase.firestore();
const auth = firebase.auth();
const id   = new URLSearchParams(location.search).get('id');
const page = document.getElementById('page');

auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'kaigo-login.html'; return; }
  const uSnap = await db.collection('users').doc(user.uid).get();
  const role  = uSnap.data()?.role;
  if (!['hospital','admin'].includes(role)) { location.href = 'kaigo-login.html'; return; }
  document.body.classList.add('ready');
  if (!id) { page.innerHTML = '<div class="state-msg">⚠️ 施設IDが指定されていません。</div>'; return; }
  load();
});

function load() {
  db.collection('facilities').doc(id).onSnapshot(doc => {
    if (!doc.exists) { page.innerHTML = '<div class="state-msg">施設が見つかりませんでした。</div>'; return; }
    render(doc);
  }, e => { page.innerHTML = `<div class="state-msg">⚠️ ${e.message}</div>`; });
}

function fmtYen(v) { return v != null ? Number(v).toLocaleString('ja-JP') : null; }
function toMan(v)  { return v != null ? Math.round(v / 1000) / 10 : null; }

function render(doc) {
  const d      = doc.data();
  const vac    = typeof d.vacancy === 'number' ? d.vacancy : 0;
  const upd    = d.updatedAt ? d.updatedAt.toDate() : new Date();
  const days   = Math.floor((new Date() - upd) / 86400000);
  const updStr = upd.toLocaleDateString('ja-JP');
  const isPaid = d.plan === 'paid';
  const vacCls = vac === 0 ? 'vac-full' : vac <= 2 ? 'vac-few' : 'vac-ok';
  const status = vac === 0 ? '現在満室です' : vac <= 2 ? `残り${vac}室 — お早めにご相談ください` : `${vac}室 空きあり`;
  // station は stationsArr/stationHtml で代替（後述）

  // 費用
  const rent    = d.rent ?? null;
  const mgmt    = d.managementFee ?? null;
  const meal    = d.mealFee ?? null;
  const other   = d.otherFee ?? null;
  const initAmt = d.initialFee ? (d.initialFeeAmount ?? 0) : 0;
  const hasBreakdown = rent != null || mgmt != null || meal != null;
  const total = hasBreakdown
    ? Math.round((rent||0)+(mgmt||0)+(meal||0)+(other||0))
    : (d.monthlyFee ?? null);
  const totalMan = toMan(total); // 円 → 万円（月々目安計算用）

  // 駅（沿線対応）
  const stationsArr = d.stations || [];
  const stationHtml = stationsArr.length
    ? stationsArr.map(s => `<div class="info-row"><span class="info-lbl">最寄り駅</span><span class="info-val">🚉 ${[s.line, s.name ? s.name+'駅' : '', s.walk ? '徒歩'+s.walk+'分' : s.dist||''].filter(Boolean).join('　')}</span></div>`).join('')
    : (d.station ? `<div class="info-row"><span class="info-lbl">最寄り駅</span><span class="info-val">🚉 ${[d.stationLine, d.station, d.stationDistance].filter(Boolean).join('　')}</span></div>` : '');

  document.title = `${d.name||'施設情報'} | 介護施設検索システム`;

  // ── ① 基本料金カード ──────────────────────────────────────
  const feeBreakCols = [
    {lbl:'賃料',  val:rent},
    {lbl:'管理費',val:mgmt},
    {lbl:'食費',  val:meal},
  ].filter(i => i.val != null);

  const feeCard = `
  <div class="sec-card">
    <div class="sec-hd">💴 基本料金（施設への直接支払い）</div>
    <div class="fee-card">
      <div class="fee-box fee-box-init">
        <div class="fee-box-lbl">入居時費用（一時金）</div>
        <div class="fee-big-num">${fmtYen(initAmt)}<span class="fee-big-unit">円</span></div>
        ${other != null ? `<div class="fee-sub"><div class="fee-sub-item">その他 ${fmtYen(other)}円</div></div>` : ''}
      </div>
      <div class="fee-box fee-box-monthly">
        <div class="fee-box-lbl">月額費用（施設負担分）</div>
        <div class="fee-big-num">${fmtYen(total) ?? '─'}<span class="fee-big-unit">円</span></div>
        ${feeBreakCols.length ? `
        <div class="fee-cols">
          ${feeBreakCols.map(i=>`<div class="fee-col"><div class="fee-col-lbl">${i.lbl}</div><div class="fee-col-val">${fmtYen(i.val)}</div><div class="fee-col-unit">円</div></div>`).join('')}
        </div>` : ''}
      </div>
    </div>
  </div>`;

  // ── ② 介護費用の説明 ─────────────────────────────────────
  // ── ③ 追加費用3項目＋月々合計 ──────────────────────────
  // 介護費用（1割負担）: 1.6〜2.8万円 / 医療費: 0.3〜1.0万円 / 生活費: 1.0〜3.0万円

  const estMax = totalMan ? Math.round((totalMan + 2.8 + 1.0 + 3.0) * 10) / 10 : null;

  const costBreakdownCard = `
  <div class="sec-card">

    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead>
        <tr style="background:#ecfdf5;border-bottom:2px solid #a7f3d0">

          <th style="padding:9px 14px;text-align:left;font-size:11px;font-weight:800;color:#047857;width:50%">内容</th>

      </thead>
      <tbody>
        ${total != null ? `<tr style="border-bottom:1px solid #e2e8f0">

          <td style="padding:11px 14px;color:#64748b;font-size:12px">家賃・食費・管理費など（施設への直接支払い）</td>

        <tr style="border-bottom:1px solid #e2e8f0;background:#f8fafc">

          <td style="padding:11px 14px;color:#64748b;font-size:12px">介護保険の自己負担分（1割負担の場合）<br><span style="color:#94a3b8;font-size:11px">要介護1〜5・負担割合により変動</span></td>
          <td style="padding:11px 14px;text-align:right;font-weight:800;color:#059669;white-space:nowrap">1.6〜2.8 万円</td>

        </tr>

            <span style="font-size:28px;font-weight:900;color:white;letter-spacing:-1px">${estMin}〜${estMax}</span>
            <span style="font-size:14px;font-weight:700;color:rgba(255,255,255,.9)"> 万円</span>
          </td>

  </div>`;

  const careFeeCard = '';
  const otherFeeCard = '';

    <div class="sec-hd" style="color:#92400e">📋 費用に関する詳細</div>
    <div style="font-size:13px;color:#78350f;line-height:1.9">
      ${d.feeNotes.split(/\n/).map(line => line.trim()).filter(Boolean).map(line =>
        `<div style="padding:3px 0;border-bottom:1px solid #fde68a;last-child:border-none">${line}</div>`
      ).join('')}

  </div>` : '';

  // ── 入居条件 ──────────────────────────────────────────────
  function condBadge(lbl, val) {
    if (!val) return `<span class="cond-badge cond-na">${lbl}：未入力</span>`;
    const cls = val === '可' ? 'cond-ok' : val === '相談可' ? 'cond-sou' : 'cond-ng';
    return `<span class="cond-badge ${cls}">${lbl}：${val}</span>`;
  }
  const condHtml = [
    condBadge('生活保護', d.seikatsuHogo),
    condBadge('身元保証なし', d.mimonHosho),
    condBadge('介護認定なし', d.kaigoNintei),
  ].join('');

  const heroContent = photo
    ? `<img src="${photo}" alt="${d.name||''}" loading="lazy">`

      </div>

      <div class="sec-card">
        <div class="sec-hd">📍 アクセス・所在地</div>
        <div class="info-rows">
          ${d.address ? `<div class="info-row"><span class="info-lbl">住所</span><span class="info-val">${d.address}</span></div>` : ''}

          ${d.city    ? `<div class="info-row"><span class="info-lbl">エリア</span><span class="info-val">${d.prefecture||''} ${d.city||''}</span></div>` : ''}
        </div>
      </div>

      ${estMin ? `
      <div class="monthly-banner" style="background:linear-gradient(135deg,#047857,#059669);border-radius:14px;padding:18px 22px;margin-bottom:14px;box-shadow:0 4px 18px rgba(5,150,105,.25)">
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:3px">月々の費用（目安・すべて含む）</div>
          <div>
            <span class="est-big" style="font-size:38px;font-weight:900;color:white;line-height:1;letter-spacing:-1px">約 ${estMin}〜${estMax}</span>
            <span class="est-unit" style="font-size:18px;font-weight:700;color:rgba(255,255,255,.9)"> 万円</span>
          </div>
        </div>
        <div class="monthly-banner-contact" style="background:rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;font-size:13px;color:white;line-height:1.7;text-align:center;width:100%">
          空室状況・連絡先は　<strong>Meets Medical</strong>　までお問い合わせください
        </div>
      </div>` : `
      <div style="background:var(--g50);border-radius:14px;padding:16px 20px;margin-bottom:14px;border:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px;color:var(--g500)">月々の費用目安は基本料金が入力されると表示されます</div>
        <div style="font-size:12px;color:var(--g500);line-height:1.7;text-align:right">空室状況・連絡先は<br><strong>Meets Medical</strong>までお問い合わせください</div>

      ${feeCard}
      ${costBreakdownCard}
      ${feeNotesCard}

      <div class="sec-card cond-section">
        <div class="sec-hd">✅ 入居条件</div>
        <div class="cond-list">${condHtml}</div>
      </div>

      <div class="contact-card">
        <div class="contact-hd">📞 入居相談・見学申し込み</div>
        <div class="contact-inner">
          ${d.contactName ? `<div class="contact-name">担当：${d.contactName}</div>` : ''}
          ${d.contactTel  ? `<div class="contact-tel">${d.contactTel}</div><a class="call-btn" href="tel:${d.contactTel}">📞 電話で問い合わせる</a>` : '<div class="contact-name" style="color:var(--g400)">連絡先は未入力です</div>'}
        </div>
      </div>

      ${d.features && d.features.length ? `
      <div class="sec-card feat-section">
        <div class="sec-hd">🏷 特徴・こだわり</div>
        <div class="tag-list">${d.features.map(t=>`<span class="tag-item">${t}</span>`).join('')}</div>

      ${d.vacancyNotes || d.campaign ? `
      <div class="sec-card">
        <div class="sec-hd">📝 備考・お知らせ</div>

          <div class="notes-txt">${[d.campaign, d.vacancyNotes].filter(Boolean).join('\n\n')}</div>

      <div class="foot-note">

        空室状況は変動しますので、直接お問い合わせください。
      </div>`;

  } else {
    // ── 無料プラン（アクセス＋費用のみ） ─────────────────────
    page.innerHTML = `
      <div class="print-only"><div class="print-fac-hdr"><div class="print-fac-name">${d.name||''}<span>${d.type||''}</span></div><div class="print-hd">印刷日：${new Date().toLocaleDateString('ja-JP')}　介護施設検索システム</div></div></div>

      <div style="margin-bottom:20px">
        <h2 style="font-size:22px;font-weight:900;color:var(--g900);margin-bottom:8px">

      <div class="sec-card">
        <div class="sec-hd">📍 アクセス・所在地</div>

          ${stationHtml}
          ${d.city    ? `<div class="info-row"><span class="info-lbl">エリア</span><span class="info-val">${d.prefecture||''} ${d.city||''}</span></div>` : ''}
        </div>
      </div>

      ${estMin ? `
      <div class="monthly-banner" style="background:linear-gradient(135deg,#047857,#059669);border-radius:14px;padding:18px 22px;margin-bottom:14px;box-shadow:0 4px 18px rgba(5,150,105,.25)">
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:rgba(255,255,255,.75);font-weight:600;margin-bottom:3px">月々の費用（目安・すべて含む）</div>
          <div>
            <span class="est-big" style="font-size:38px;font-weight:900;color:white;line-height:1;letter-spacing:-1px">約 ${estMin}〜${estMax}</span>
            <span class="est-unit" style="font-size:18px;font-weight:700;color:rgba(255,255,255,.9)"> 万円</span>
          </div>
        </div>
        <div class="monthly-banner-contact" style="background:rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;font-size:13px;color:white;line-height:1.7;text-align:center;width:100%">
          空室状況・連絡先は　<strong>Meets Medical</strong>　までお問い合わせください
        </div>
      </div>` : `
      <div style="background:var(--g50);border-radius:14px;padding:16px 20px;margin-bottom:14px;border:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div style="font-size:13px;color:var(--g500)">月々の費用目安は基本料金が入力されると表示されます</div>
        <div style="font-size:12px;color:var(--g500);line-height:1.7;text-align:right">空室状況・連絡先は<br><strong>Meets Medical</strong>までお問い合わせください</div>
      </div>`}

      ${feeCard}
      ${costBreakdownCard}
      ${feeNotesCard}

      <div class="foot-note">
        このページは介護施設検索システムの施設情報ページです。<br>
        Powered by Meets Medical
      </div>`;
  }
}
</script>
</body>
