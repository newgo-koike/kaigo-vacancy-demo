<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>介護施設 空き状況検索</title>
  <style>
    :root {
      --brand:#0d9488; --brand-d:#0f766e; --brand-l:#f0fdfa;
      --ok:#16a34a; --ok-bg:#dcfce7;
      --few:#ea580c; --few-bg:#ffedd5;
      --full-c:#64748b; --full-bg:#f1f5f9;
      --purple:#7c3aed; --purple-bg:#f5f3ff;
      --amber:#d97706; --amber-bg:#fef3c7;
      --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1;
      --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155;
      --g800:#1e293b; --g900:#0f172a;
      --r:10px;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { font-family:-apple-system,'Hiragino Sans',Arial,sans-serif; background:var(--g50); color:var(--g800); line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; visibility:hidden; }

    /* HEADER */
    .hdr { flex-shrink:0; background:var(--g900); height:54px; padding:0 16px; display:flex; align-items:center; gap:10px; z-index:100; }
    .hdr-logo { width:28px; height:28px; background:var(--brand); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .hdr-title { font-size:14px; font-weight:800; color:white; }
    .hdr-sub { font-size:10px; color:var(--g400); }
    .hdr-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .hdr-user { font-size:11px; color:var(--g400); }
    .hdr-logout { background:transparent; border:1px solid var(--g600); color:var(--g400); font-size:11px; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit; transition:color .15s,border-color .15s; }
    .hdr-logout:hover { color:white; border-color:var(--g400); }

    /* SEARCH PANEL */
    .search-panel { flex-shrink:0; background:white; border-bottom:1px solid var(--g200); padding:14px 16px; }
    .sp-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
    .sp-row:last-child { margin-bottom:0; }
    .sp-label { font-size:10px; font-weight:800; color:var(--g400); letter-spacing:.06em; text-transform:uppercase; width:56px; flex-shrink:0; padding-top:5px; }
    .sp-chips { display:flex; flex-wrap:wrap; gap:5px; flex:1; }
    .sp-chip { padding:4px 11px; border-radius:20px; font-size:12px; font-weight:600; border:1.5px solid var(--g200); background:white; color:var(--g600); cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap; user-select:none; }
    .sp-chip:hover { border-color:var(--brand); color:var(--brand); }
    .sp-chip.on { border-color:var(--brand); background:var(--brand); color:white; }

    .sp-bottom-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sp-text-wrap { position:relative; flex:1; min-width:160px; }
    .sp-text-ico { position:absolute; left:9px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--g400); pointer-events:none; }
    .sp-text { width:100%; padding:8px 10px 8px 30px; border:1.5px solid var(--g200); border-radius:9px; font-size:13px; outline:none; font-family:inherit; transition:border-color .15s; }
    .sp-text:focus { border-color:var(--brand); }
    .vac-toggle { display:flex; border:1.5px solid var(--g200); border-radius:7px; overflow:hidden; }
    .vac-tab { padding:6px 13px; font-size:11px; font-weight:600; background:white; border:none; cursor:pointer; font-family:inherit; color:var(--g500); transition:all .12s; white-space:nowrap; }
    .vac-tab.on { background:var(--brand); color:white; }
    .adv-toggle { display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--g500); background:none; border:1.5px solid var(--g200); border-radius:7px; padding:6px 11px; cursor:pointer; font-family:inherit; white-space:nowrap; transition:all .12s; }
    .adv-toggle:hover { border-color:var(--brand); color:var(--brand); }
    .adv-toggle.open { background:var(--g100); border-color:var(--g300); }
    .search-btn { display:flex; align-items:center; gap:6px; padding:8px 20px; background:var(--brand); color:white; border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s; white-space:nowrap; }
    .search-btn:hover:not(:disabled) { background:var(--brand-d); }
    .search-btn:disabled { background:var(--g400); cursor:not-allowed; }

    /* 詳細フィルター（折りたたみ） */
    .adv-panel { display:none; border-top:1px solid var(--g100); margin-top:12px; padding-top:12px; }
    .adv-panel.open { display:block; }
    .adv-section { margin-bottom:12px; }
    .adv-section:last-child { margin-bottom:0; }
    .adv-sec-label { font-size:9px; font-weight:800; color:var(--g500); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    .cond-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; }
    .cond-lbl { font-size:11px; color:var(--g600); font-weight:700; width:88px; flex-shrink:0; }
    .cond-btn { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; border:1.5px solid var(--g200); background:white; color:var(--g600); cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap; }
    .cond-btn:hover { border-color:var(--brand); color:var(--brand); }
    .cond-btn.on { border-color:var(--brand); background:var(--brand); color:white; }
    .tag-sec-lbl { font-size:9px; font-weight:800; color:var(--g500); letter-spacing:.06em; text-transform:uppercase; padding:5px 0 4px; border-top:1px solid var(--g100); margin-top:4px; }
    .tag-bar { display:flex; flex-wrap:wrap; gap:4px; padding:5px 0 6px; }
    .tag-chip { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; border:1.5px solid var(--g200); background:white; color:var(--g600); cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap; }
    .tag-chip:hover { border-color:var(--brand); color:var(--brand); }
    .tag-chip.on { border-color:var(--brand); background:var(--brand); color:white; }
    .adv-clear-btn { font-size:11px; color:var(--brand); background:none; border:none; cursor:pointer; font-family:inherit; padding:0; margin-left:auto; }

    /* RESULTS LAYOUT */
    .results-layout { flex:1; display:flex; overflow:hidden; }

    /* LIST */
    .results-list { width:320px; min-width:320px; border-right:1px solid var(--g200); display:flex; flex-direction:column; overflow:hidden; background:white; }
    .results-meta { flex-shrink:0; padding:9px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--g100); background:var(--g50); }
    .results-count { font-size:11px; color:var(--g500); }
    .results-stats { display:flex; gap:10px; }
    .rs-item { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--g500); }
    .rs-dot { width:6px; height:6px; border-radius:50%; }
    .rs-num { font-weight:700; color:var(--g700); }
    .results-scroll { flex:1; overflow-y:auto; }

    /* INITIAL / EMPTY STATE */
    .state-box { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; color:var(--g400); height:100%; }
    .state-ico { font-size:40px; margin-bottom:12px; }
    .state-ttl { font-size:14px; font-weight:700; color:var(--g500); margin-bottom:6px; }
    .state-sub { font-size:12px; line-height:1.7; }

    /* FACILITY CARD */
    .fcc { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--g100); cursor:pointer; background:white; transition:background .1s; }
    .fcc:hover { background:var(--g50); }
    .fcc.selected { background:var(--brand-l); border-left:3px solid var(--brand); padding-left:9px; }
    .fcc-vac { width:42px; height:42px; min-width:42px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.18); }
    .fcc-vac.vc-ok { background:var(--ok); }
    .fcc-vac.vc-few { background:var(--few); }
    .fcc-vac.vc-full { background:var(--g400); }
    .fcc-vnum { font-size:17px; font-weight:900; color:white; line-height:1; letter-spacing:-1px; }
    .fcc-vunit { font-size:8px; font-weight:700; color:rgba(255,255,255,.9); }
    .fcc-full { font-size:10px; font-weight:800; color:white; }
    .fcc-body { flex:1; min-width:0; }
    .fcc-name { font-size:13px; font-weight:700; color:var(--g800); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fcc-row { display:flex; align-items:center; gap:5px; margin-bottom:2px; flex-wrap:wrap; }
    .fcc-type { font-size:10px; padding:1px 6px; border-radius:4px; font-weight:700; background:var(--g100); color:var(--g500); white-space:nowrap; }
    .fcc-station { font-size:11px; color:var(--g500); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .fcc-foot { font-size:10px; color:var(--g400); }
    .fcc-stale { color:#ef4444; font-weight:600; }
    .name-plan-badge { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:var(--brand); color:white; font-size:9px; font-weight:900; vertical-align:middle; margin-left:4px; }

    /* DETAIL PANEL */
    .detail-panel { flex:1; overflow-y:auto; background:white; display:flex; flex-direction:column; }
    .detail-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; color:var(--g300); }
    .dp-ico { font-size:40px; margin-bottom:12px; }
    .dp-title { font-size:14px; font-weight:700; color:var(--g400); margin-bottom:6px; }
    .dp-sub { font-size:12px; color:var(--g300); line-height:1.6; }
    .detail-content { flex:1; overflow-y:auto; display:flex; flex-direction:column; }

    .dp-photo { position:relative; height:170px; overflow:hidden; background:linear-gradient(135deg,var(--g700),var(--g900)); flex-shrink:0; display:flex; align-items:flex-end; padding:12px 16px; }
    .dp-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .dp-photo-grad { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,20,40,.85) 0%,transparent 60%); }
    .dp-photo-name { position:relative; color:white; font-size:17px; font-weight:800; line-height:1.25; z-index:1; }
    .dp-photo-type { position:absolute; top:11px; left:12px; background:rgba(10,20,40,.55); backdrop-filter:blur(8px); color:white; font-size:10px; padding:3px 9px; border-radius:20px; font-weight:600; z-index:1; }

    .dv-block { display:flex; align-items:stretch; overflow:hidden; flex-shrink:0; }
    .dv-num-side { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px 18px; min-width:80px; }
    .dv-ok  .dv-num-side { background:var(--ok-bg); }
    .dv-few .dv-num-side { background:var(--few-bg); }
    .dv-full .dv-num-side { background:var(--full-bg); }
    .dv-big { font-size:40px; font-weight:900; line-height:1; letter-spacing:-2px; }
    .dv-ok  .dv-big  { color:var(--ok); }
    .dv-few .dv-big  { color:var(--few); }
    .dv-full .dv-big { color:var(--full-c); }
    .dv-unit { font-size:11px; font-weight:700; }
    .dv-ok  .dv-unit  { color:var(--ok); }
    .dv-few .dv-unit  { color:var(--few); }
    .dv-full .dv-unit { color:var(--full-c); }
    .dv-info-side { flex:1; padding:12px 14px; }
    .dv-ok  .dv-info-side { background:color-mix(in srgb,var(--ok-bg) 35%,white); }
    .dv-few .dv-info-side { background:color-mix(in srgb,var(--few-bg) 35%,white); }
    .dv-full .dv-info-side { background:color-mix(in srgb,var(--full-bg) 50%,white); }
    .dv-status { font-size:14px; font-weight:800; margin-bottom:3px; }
    .dv-ok  .dv-status { color:var(--ok); }
    .dv-few .dv-status { color:var(--few); }
    .dv-full .dv-status { color:var(--full-c); }
    .dv-notes { font-size:12px; color:var(--g600); margin-top:4px; padding:4px 8px; background:var(--amber-bg); border-radius:5px; border-left:3px solid var(--amber); }
    .dv-updated { font-size:10px; color:var(--g400); margin-top:5px; }

    .d-body { padding:14px 16px 28px; flex:1; }
    .d-sec { margin-bottom:14px; }
    .d-sec-hd { display:flex; align-items:center; gap:6px; font-size:9px; font-weight:800; color:var(--g500); letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--g100); }
    .d-badge { font-size:8px; padding:2px 5px; border-radius:4px; font-weight:700; background:var(--g100); color:var(--g500); }
    .d-rows { display:flex; flex-direction:column; gap:6px; }
    .d-row { display:flex; gap:8px; font-size:12px; }
    .d-lbl { color:var(--g400); width:80px; flex-shrink:0; }
    .d-val { color:var(--g700); font-weight:500; flex:1; }
    .cond-badges { display:flex; flex-wrap:wrap; gap:4px; }
    .cond-badge { font-size:10px; padding:2px 8px; border-radius:20px; font-weight:600; }
    .cond-ok { background:var(--ok-bg); color:var(--ok); }
    .cond-sou { background:var(--amber-bg); color:var(--amber); }
    .cond-ng { background:var(--full-bg); color:var(--full-c); }
    .feat-tags { display:flex; flex-wrap:wrap; gap:4px; }
    .feat-tag { font-size:10px; padding:3px 8px; background:var(--g100); border-radius:5px; color:var(--g600); font-weight:500; }
    .d-campaign { background:var(--purple-bg); border-radius:9px; padding:11px 13px; }
    .d-camp-label { font-size:10px; color:var(--purple); font-weight:700; margin-bottom:4px; }
    .d-camp-text { font-size:13px; color:var(--g700); line-height:1.5; }
    .d-contact { border-radius:12px; border:1px solid var(--g200); overflow:hidden; }
    .d-cont-hd { background:var(--g50); padding:9px 14px; font-size:10px; font-weight:700; color:var(--g500); border-bottom:1px solid var(--g200); }
    .d-cont-inner { padding:14px 16px; position:relative; min-height:80px; }
    .d-cont-name { font-size:13px; font-weight:600; color:var(--g700); margin-bottom:2px; }
    .d-cont-tel { font-size:22px; font-weight:900; color:var(--brand-d); letter-spacing:-.5px; margin-bottom:10px; }
    .d-call-btn { display:inline-flex; align-items:center; gap:7px; padding:11px 20px; background:var(--brand); color:white; border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; width:100%; justify-content:center; }
    .d-call-btn:hover { background:var(--brand-d); }
    .d-hp-btn { display:inline-flex; align-items:center; gap:7px; padding:11px 20px; background:var(--g800); color:white; border:none; border-radius:9px; font-size:13px; font-weight:700; text-decoration:none; width:100%; justify-content:center; }
    .d-hp-btn:hover { background:var(--g900); }
    .cont-blur { filter:blur(5px); user-select:none; pointer-events:none; }
    .cont-lock-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:rgba(255,255,255,.72); backdrop-filter:blur(2px); }

    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .toast { position:fixed; bottom:24px; right:24px; background:var(--g900); color:white; padding:12px 20px; border-radius:11px; font-size:13px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.25); opacity:0; transform:translateY(12px); transition:all .22s; z-index:999; pointer-events:none; }
    .toast.on { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">🏥</div>
  <div>
    <div class="hdr-title">介護施設 空き状況検索</div>
    <div class="hdr-sub">豊中エリア 介護施設情報プラットフォーム</div>
  </div>
  <div class="hdr-right">
    <button class="hdr-logout" onclick="firebase.auth().signOut().then(()=>location.href='kaigo-login.html')">ログアウト</button>
  </div>
</header>

<!-- 検索フォーム -->
<div class="search-panel">
  <!-- エリア -->
  <div class="sp-row">
    <div class="sp-label">エリア</div>
    <div class="sp-chips" id="area-chips"></div>
  </div>
  <!-- 施設種別 -->
  <div class="sp-row">
    <div class="sp-label">種別</div>
    <div class="sp-chips" id="type-chips"></div>
  </div>
  <!-- 下段：テキスト・空室・詳細・検索ボタン -->
  <div class="sp-bottom-row">
    <div class="sp-text-wrap">
      <span class="sp-text-ico">🔍</span>
      <input class="sp-text" id="q" type="text" placeholder="施設名・駅名で絞り込み" onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <div class="vac-toggle">
      <button class="vac-tab on" onclick="setVac('all',this)">すべて</button>
      <button class="vac-tab" onclick="setVac('ok',this)">空きあり</button>
    </div>
    <button class="adv-toggle" id="adv-btn" onclick="toggleAdv()">詳細 ▾</button>
    <button class="search-btn" id="search-btn" onclick="doSearch()">検索</button>
  </div>

  <!-- 詳細フィルター（折りたたみ） -->
  <div class="adv-panel" id="adv-panel">
    <div class="adv-section">
      <div class="adv-sec-label">入居条件</div>
      <div class="cond-row">
        <span class="cond-lbl">生活保護</span>
        <button class="cond-btn on" data-key="seikatsu" data-val="" onclick="toggleCond('seikatsu','',this)">指定なし</button>
        <button class="cond-btn" data-key="seikatsu" data-val="可" onclick="toggleCond('seikatsu','可',this)">可</button>
        <button class="cond-btn" data-key="seikatsu" data-val="相談可" onclick="toggleCond('seikatsu','相談可',this)">相談可</button>
        <button class="cond-btn" data-key="seikatsu" data-val="不可" onclick="toggleCond('seikatsu','不可',this)">不可</button>
      </div>
      <div class="cond-row">
        <span class="cond-lbl">身元保証なし</span>
        <button class="cond-btn on" data-key="mimon" data-val="" onclick="toggleCond('mimon','',this)">指定なし</button>
        <button class="cond-btn" data-key="mimon" data-val="可" onclick="toggleCond('mimon','可',this)">可</button>
        <button class="cond-btn" data-key="mimon" data-val="相談可" onclick="toggleCond('mimon','相談可',this)">相談可</button>
        <button class="cond-btn" data-key="mimon" data-val="不可" onclick="toggleCond('mimon','不可',this)">不可</button>
      </div>
      <div class="cond-row">
        <span class="cond-lbl">介護認定なし</span>
        <button class="cond-btn on" data-key="kaigo" data-val="" onclick="toggleCond('kaigo','',this)">指定なし</button>
        <button class="cond-btn" data-key="kaigo" data-val="なし" onclick="toggleCond('kaigo','なし',this)">なし</button>
        <button class="cond-btn" data-key="kaigo" data-val="相談可" onclick="toggleCond('kaigo','相談可',this)">相談可</button>
        <button class="cond-btn" data-key="kaigo" data-val="不可" onclick="toggleCond('kaigo','不可',this)">不可</button>
      </div>
    </div>
    <div class="adv-section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="adv-sec-label" style="margin-bottom:0">こだわり・特徴タグ</div>
        <button class="adv-clear-btn" onclick="clearTags()">クリア</button>
      </div>
      <div class="tag-sec-lbl">こだわり・特徴</div>
      <div class="tag-bar" id="tag-bar-feature"></div>
      <div class="tag-sec-lbl">看護・医療体制</div>
      <div class="tag-bar" id="tag-bar-medical"></div>
    </div>
  </div>
</div>

<!-- 結果エリア -->
<div class="results-layout">

  <!-- 一覧パネル -->
  <div class="results-list">
    <div class="results-meta" id="results-meta" style="display:none">
      <span class="results-count" id="results-count"></span>
      <div class="results-stats">
        <span class="rs-item"><span class="rs-dot" style="background:var(--ok)"></span><span class="rs-num" id="st-ok">0</span> 空きあり</span>
        <span class="rs-item"><span class="rs-dot" style="background:var(--g400)"></span><span class="rs-num" id="st-full">0</span> 満室</span>
      </div>
    </div>
    <div class="results-scroll" id="results-scroll">
      <div class="state-box">
        <div class="state-ico">🔍</div>
        <div class="state-ttl">施設を検索してください</div>
        <div class="state-sub">エリア・種別・条件を選んで<br>「検索」ボタンを押してください</div>
      </div>
    </div>
  </div>

  <!-- 詳細パネル -->
  <div class="detail-panel">
    <div class="detail-placeholder" id="detail-placeholder">
      <div class="dp-ico">🏠</div>
      <div class="dp-title">施設を選んで詳細を表示</div>
      <div class="dp-sub">左のリストから施設をクリックすると<br>空室状況・基本情報・連絡先が確認できます</div>
    </div>
    <div class="detail-content" id="detail-content" style="display:none;"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'kaigo-login.html'; return; }
  const uSnap = await db.collection('users').doc(user.uid).get();
  const role = uSnap.data()?.role;
  if (!['hospital', 'admin'].includes(role)) {
    await auth.signOut();
    location.href = 'kaigo-login.html';
    return;
  }
  document.body.style.visibility = 'visible';
  initChips();
  initTags();
});

// ─── 定数 ───────────────────────────────────────────
const AREA_ORDER = ['庄内','服部','曽根','岡町','蛍池','刀根山','千里','少路','豊中'];
const TYPES = ['特養','老健','グループホーム','サ高住','介護付有料','住宅型有料'];
const TAGS_FEATURE = [
  '看取り・ターミナルケア','個室あり','入居一時金0円','訪問看護可','日中看護師常駐','作業療法士（OT）',
  'キッチン付き居室','家具付き居室','ナースコールあり','機械浴・特殊浴あり',
  '理美容サービスあり','レクリエーション充実','将棋・囲碁あり','禁煙',
  '駅近・交通アクセス良好','大手が運営','夫婦入居可・2人部屋あり',
  '終身利用可','体験入居可','病院・クリニック併設','24時間看護師常駐',
  '夜間有人','言語聴覚士（ST）','風呂付き居室','介護ベッド付居室',
  'ゲストルームあり','入浴週3回以上','カラオケあり','園芸・庭園あり','アルコール可','外出自由',
  '安い・低価格','ペット・犬・猫可','ショートステイ可','デイサービス併設',
  '24時間介護士常駐','理学療法士（PT）','手厚い人員体制','トイレ付き居室',
  'ネット利用可','口腔ケア・訪問歯科あり','施設内手作りの食事','麻雀あり','喫煙可',
];
const TAGS_MEDICAL = [
  'リハビリ','胃ろう','人工呼吸器','たん吸引','気管切開',
  '褥瘡・床ずれ','脳血管性認知症','パーキンソン病','脳梗塞・クモ膜下出血',
  'リウマチ・関節症','誤嚥性肺炎','介護食','糖尿病・インスリン','ペースメーカー',
  '鼻腔・経管栄養','ストーマ・人工肛門','ALS','心筋梗塞・狭心症','肝炎',
  '統合失調症','流動食・嚥下食','人工透析','中心静脈栄養（IVH）','在宅酸素療法',
  'カテーテル・尿バルーン','アルツハイマー','レビー小体型認知症','がん・末期癌',
  '骨折・骨粗しょう症','喘息・気管支炎','うつ・鬱病',
];

// ─── 状態 ────────────────────────────────────────────
let DATA = [];
let activeVac = 'all';
let selectedId = null;
const condState = { seikatsu:'', mimon:'', kaigo:'' };
const selectedTags = new Set();

// ─── チップ初期化 ─────────────────────────────────────
function initChips() {
  const ac = document.getElementById('area-chips');
  ac.innerHTML = AREA_ORDER.map(a =>
    `<button class="sp-chip on" data-val="${a}" onclick="toggleChip(this,'area-chips')">${a}</button>`
  ).join('');

  const tc = document.getElementById('type-chips');
  tc.innerHTML = TYPES.map(t =>
    `<button class="sp-chip on" data-val="${t}" onclick="toggleChip(this,'type-chips')">${t}</button>`
  ).join('');
}

function initTags() {
  document.getElementById('tag-bar-feature').innerHTML = TAGS_FEATURE.map(t =>
    `<button class="tag-chip" onclick="toggleTag('${t}',this)">${t}</button>`
  ).join('');
  document.getElementById('tag-bar-medical').innerHTML = TAGS_MEDICAL.map(t =>
    `<button class="tag-chip" onclick="toggleTag('${t}',this)">${t}</button>`
  ).join('');
}

function toggleChip(btn, groupId) {
  btn.classList.toggle('on');
}

// ─── 検索実行 ─────────────────────────────────────────
async function doSearch() {
  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 検索中';

  const areas    = getChipValues('area-chips');
  const types    = getChipValues('type-chips');
  const q        = document.getElementById('q').value.trim().toLowerCase();
  const qNorm    = q.replace(/駅$/, '');

  try {
    let query = db.collection('facilities');
    // エリアが1〜10件なら Firestore 側でフィルタ（件数削減）
    if (areas.length > 0 && areas.length <= 10) {
      query = query.where('area', 'in', areas);
    }
    const snap = await query.orderBy('updatedAt','desc').get();
    DATA = snap.docs.map(mapDoc);

    // クライアント側フィルタ
    const list = DATA.filter(f => {
      if (areas.length > 0 && areas.length > 10 && !areas.includes(f.area)) return false;
      if (types.length > 0 && !types.includes(f.type)) return false;
      if (activeVac === 'ok' && f.total === 0) return false;
      if (q && !f.name.toLowerCase().includes(q) && !f.station.toLowerCase().includes(qNorm) && !f.addr.includes(q)) return false;
      if (selectedTags.size > 0 && ![...selectedTags].every(t => f.features.includes(t))) return false;
      if (condState.seikatsu && f.seikatsuHogo !== condState.seikatsu) return false;
      if (condState.mimon    && f.mimonHosho   !== condState.mimon)    return false;
      if (condState.kaigo    && f.kaigoNintei  !== condState.kaigo)    return false;
      return true;
    });

    renderList(list);
  } catch(e) {
    document.getElementById('results-scroll').innerHTML =
      `<div class="state-box"><div class="state-ico">⚠️</div><div class="state-ttl">読み込みエラー</div><div class="state-sub">${e.message}</div></div>`;
  }

  btn.disabled = false;
  btn.textContent = '検索';
}

function getChipValues(groupId) {
  return Array.from(document.querySelectorAll(`#${groupId} .sp-chip.on`)).map(b => b.dataset.val);
}

// ─── データ変換 ──────────────────────────────────────
function mapDoc(doc) {
  const d = doc.data();
  const upd = d.updatedAt ? d.updatedAt.toDate() : new Date();
  const daysAgo = Math.floor((new Date() - upd) / 86400000);
  const total = typeof d.vacancy === 'number' ? d.vacancy : 0;
  return {
    id: doc.id,
    name: d.name || '',
    type: d.type || '',
    addr: d.address || '',
    station: [d.station, d.stationDistance].filter(Boolean).join(' '),
    area: d.area || '',
    parking: d.parking || '',
    totalRooms: d.totalRooms || '',
    total,
    vacancyNotes: d.vacancyNotes || '',
    features: d.features || [],
    seikatsuHogo: d.seikatsuHogo || '',
    mimonHosho: d.mimonHosho || '',
    kaigoNintei: d.kaigoNintei || '',
    campaign: d.campaign || null,
    hp: d.hp || '',
    contact: { name: d.contactName || '', tel: d.contactTel || '' },
    plan: d.plan || 'free',
    updated: upd.toISOString().slice(0, 10),
    daysAgo,
    photoUrl: d.photoUrl || null,
  };
}

// ─── 一覧描画 ────────────────────────────────────────
function renderList(list) {
  const metaEl  = document.getElementById('results-meta');
  const countEl = document.getElementById('results-count');
  const scroll  = document.getElementById('results-scroll');

  metaEl.style.display = 'flex';
  document.getElementById('st-ok').textContent   = list.filter(f => f.total > 0).length;
  document.getElementById('st-full').textContent = list.filter(f => f.total === 0).length;
  countEl.textContent = `${list.length} 件`;

  if (!list.length) {
    scroll.innerHTML = '<div class="state-box"><div class="state-ico">🔍</div><div class="state-ttl">条件に合う施設が見つかりません</div><div class="state-sub">条件を変えて再検索してください</div></div>';
    return;
  }

  const typeShort = {'特養':'特養','老健':'老健','グループホーム':'GH','サ高住':'サ高住','介護付有料':'介護付有料'};
  scroll.innerHTML = list.map(f => {
    const cls = f.total === 0 ? 'vc-full' : f.total <= 2 ? 'vc-few' : 'vc-ok';
    const vacH = f.total === 0
      ? `<span class="fcc-full">満室</span>`
      : `<span class="fcc-vnum">${f.total}</span><span class="fcc-vunit">室空き</span>`;
    return `<div class="fcc${selectedId===f.id?' selected':''}" onclick="selectFac('${f.id}')" id="fcc-${f.id}">
      <div class="fcc-vac ${cls}">${vacH}</div>
      <div class="fcc-body">
        <div class="fcc-name">${f.name}${f.plan!=='free'?'<span class="name-plan-badge" title="問合せ可">✓</span>':''}</div>
        <div class="fcc-row">
          <span class="fcc-type">${typeShort[f.type]||f.type}</span>
          ${f.station ? `<span class="fcc-station">🚉 ${f.station}</span>` : ''}
        </div>
        <div class="fcc-foot"><span class="${f.daysAgo>14?'fcc-stale':''}">${f.daysAgo===0?'本日更新':f.daysAgo+'日前更新'}${f.daysAgo>14?' ⚠️':''}</span></div>
      </div>
    </div>`;
  }).join('');
}

// ─── 施設詳細 ────────────────────────────────────────
function selectFac(id) {
  selectedId = id;
  document.querySelectorAll('.fcc').forEach(el => el.classList.remove('selected'));
  const card = document.getElementById('fcc-' + id);
  if (card) { card.classList.add('selected'); card.scrollIntoView({block:'nearest'}); }

  const f = DATA.find(x => x.id === id);
  if (!f) return;

  document.getElementById('detail-placeholder').style.display = 'none';
  const dc = document.getElementById('detail-content');
  dc.style.display = 'flex';

  const vacCls = f.total===0 ? 'dv-full' : f.total<=2 ? 'dv-few' : 'dv-ok';
  const status = f.total===0 ? '現在満室です' : f.total<=2 ? `残り${f.total}室 — お早めに` : `${f.total}室 空きあり`;

  const photoH = `<div class="dp-photo">
    ${f.photoUrl ? `<img src="${f.photoUrl}" alt="${f.name}" loading="lazy">` : ''}
    <div class="dp-photo-grad"></div>
    <div class="dp-photo-type">${f.type}</div>
    <div class="dp-photo-name">${f.name}</div>
  </div>`;

  const notesH = f.vacancyNotes ? `<div class="dv-notes">📝 ${f.vacancyNotes}</div>` : '';

  const condH = (f.seikatsuHogo || f.mimonHosho || f.kaigoNintei) ? `
    <div class="d-sec">
      <div class="d-sec-hd">入居条件</div>
      <div class="d-rows">
        ${f.seikatsuHogo ? `<div class="d-row"><span class="d-lbl">生活保護</span><div class="cond-badges">${condBadge(f.seikatsuHogo,'可')}</div></div>` : ''}
        ${f.mimonHosho  ? `<div class="d-row"><span class="d-lbl">身元保証なし</span><div class="cond-badges">${condBadge(f.mimonHosho,'可')}</div></div>` : ''}
        ${f.kaigoNintei ? `<div class="d-row"><span class="d-lbl">介護認定なし</span><div class="cond-badges">${condBadge(f.kaigoNintei,'なし')}</div></div>` : ''}
      </div>
    </div>` : '';

  const inquiryH = f.plan !== 'free'
    ? `<div class="d-contact">
         <div class="d-cont-hd">今すぐ問い合わせ</div>
         <div class="d-cont-inner">
           ${f.contact.name ? `<div class="d-cont-name">担当：${f.contact.name}</div>` : ''}
           ${f.contact.tel
             ? `<div class="d-cont-tel">${f.contact.tel}</div><button class="d-call-btn" onclick="window.location.href='tel:${f.contact.tel}'">📞 電話で問い合わせる</button>`
             : '<div style="font-size:12px;color:var(--g400);margin-top:4px">電話番号未登録</div>'}
         </div>
       </div>`
    : `<div class="d-contact">
         <div class="d-cont-hd">施設への問い合わせ</div>
         <div class="d-cont-inner">
           ${f.hp
             ? `<a class="d-hp-btn" href="${f.hp}" target="_blank">🌐 施設ホームページへ</a>`
             : '<div style="font-size:12px;color:var(--g400)">HPなし / 有料プランで連絡先を表示できます</div>'}
         </div>
       </div>`;

  dc.innerHTML = `
    ${photoH}
    <div class="dv-block ${vacCls}">
      <div class="dv-num-side"><div class="dv-big">${f.total}</div><div class="dv-unit">室空き</div></div>
      <div class="dv-info-side">
        <div class="dv-status">${status}</div>
        ${notesH}
        <div class="dv-updated">更新：${f.updated}${f.daysAgo>14?' ⚠️ 古い情報の可能性あり':''}</div>
      </div>
    </div>
    <div class="d-body">
      <div class="d-sec">
        <div class="d-sec-hd">施設基本情報 <span class="d-badge">固定情報</span></div>
        <div class="d-rows">
          <div class="d-row"><span class="d-lbl">施設種別</span><span class="d-val">${f.type}</span></div>
          ${f.addr       ? `<div class="d-row"><span class="d-lbl">住所</span><span class="d-val">${f.addr}</span></div>` : ''}
          ${f.station    ? `<div class="d-row"><span class="d-lbl">最寄り駅</span><span class="d-val">${f.station}</span></div>` : ''}
          ${f.totalRooms ? `<div class="d-row"><span class="d-lbl">総部屋数</span><span class="d-val">${f.totalRooms}室</span></div>` : ''}
          ${f.parking    ? `<div class="d-row"><span class="d-lbl">駐車場</span><span class="d-val">${f.parking}</span></div>` : ''}
          ${f.features.length ? `<div class="d-row"><span class="d-lbl">こだわり</span><div class="feat-tags">${f.features.map(t=>`<span class="feat-tag">${t}</span>`).join('')}</div></div>` : ''}
        </div>
      </div>
      ${condH}
      ${f.campaign ? `<div class="d-sec"><div class="d-sec-hd">キャンペーン</div><div class="d-campaign"><div class="d-camp-label">🎁 お知らせ</div><div class="d-camp-text">${f.campaign}</div></div></div>` : ''}
      <div class="d-sec">${inquiryH}</div>
    </div>
  `;
  dc.scrollTop = 0;
}

// ─── UI操作ヘルパー ──────────────────────────────────
function setVac(v, btn) {
  activeVac = v;
  document.querySelectorAll('.vac-tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
}

function toggleAdv() {
  const panel = document.getElementById('adv-panel');
  const btn   = document.getElementById('adv-btn');
  const open  = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '詳細 ▴' : '詳細 ▾';
}

function toggleCond(key, val, btn) {
  condState[key] = condState[key] === val ? '' : val;
  document.querySelectorAll(`.cond-btn[data-key="${key}"]`).forEach(b => {
    b.classList.toggle('on', b.dataset.val === condState[key]);
  });
  if (!condState[key]) {
    const noneBtn = document.querySelector(`.cond-btn[data-key="${key}"][data-val=""]`);
    if (noneBtn) noneBtn.classList.add('on');
  }
}

function toggleTag(tag, btn) {
  if (selectedTags.has(tag)) { selectedTags.delete(tag); btn.classList.remove('on'); }
  else { selectedTags.add(tag); btn.classList.add('on'); }
}

function clearTags() {
  selectedTags.clear();
  document.querySelectorAll('.tag-chip').forEach(b => b.classList.remove('on'));
}

function condBadge(val, okVal) {
  if (!val) return '<span style="color:var(--g400);font-size:11px">未設定</span>';
  const cls = val === okVal ? 'cond-ok' : val === '相談可' ? 'cond-sou' : 'cond-ng';
  return `<span class="cond-badge ${cls}">${val}</span>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
