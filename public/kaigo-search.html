<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>介護施設 空き状況検索</title>
  <style>
    :root {
      --brand:#0d9488; --brand-d:#0f766e; --brand-l:#f0fdfa;
      --ok:#16a34a; --ok-bg:#dcfce7;
      --few:#ea580c; --few-bg:#ffedd5;
      --full-c:#64748b; --full-bg:#f1f5f9;
      --amber:#d97706; --amber-bg:#fef3c7;
      --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1;
      --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155;
      --g800:#1e293b; --g900:#0f172a;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { font-family:-apple-system,'Hiragino Sans',Arial,sans-serif; background:var(--g50); color:var(--g800); line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; visibility:hidden; }

    /* HEADER */
    .hdr { flex-shrink:0; background:var(--g900); height:52px; padding:0 16px; display:flex; align-items:center; gap:10px; z-index:200; }
    .hdr-logo { width:28px; height:28px; background:var(--brand); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .hdr-title { font-size:14px; font-weight:800; color:white; }
    .hdr-sub { font-size:10px; color:var(--g400); }
    .hdr-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .hdr-user { font-size:11px; color:var(--g400); }
    .hdr-logout { background:transparent; border:1px solid var(--g600); color:var(--g400); font-size:11px; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit; }
    .hdr-logout:hover { color:white; border-color:var(--g400); }

    /* BODY LAYOUT */
    .body-wrap { flex:1; display:flex; overflow:hidden; }

    /* LEFT SIDEBAR */
    .sidebar { width:240px; min-width:240px; background:white; border-right:1px solid var(--g200); overflow-y:auto; flex-shrink:0; }

    .sb-search-btn { margin:14px 14px 0; width:calc(100% - 28px); padding:11px; background:var(--brand); color:white; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s; box-shadow:0 3px 10px rgba(13,148,136,.25); display:flex; align-items:center; justify-content:center; gap:6px; }
    .sb-search-btn:hover:not(:disabled) { background:var(--brand-d); }
    .sb-search-btn:disabled { background:var(--g400); cursor:not-allowed; box-shadow:none; }

    .sb-sec { border-bottom:1px solid var(--g100); padding:14px 14px 12px; }
    .sb-sec-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .sb-sec-title { font-size:11px; font-weight:800; color:var(--g600); letter-spacing:.04em; }
    .sb-clear { font-size:10px; color:var(--brand); background:none; border:none; cursor:pointer; font-family:inherit; padding:0; }

    /* フォームコントロール */
    .f-grp { margin-bottom:10px; }
    .f-grp:last-child { margin-bottom:0; }
    .f-lbl { display:block; font-size:11px; color:var(--g500); font-weight:600; margin-bottom:4px; }
    .f-sel { width:100%; padding:7px 9px; border:1.5px solid var(--g200); border-radius:7px; font-size:13px; outline:none; font-family:inherit; color:var(--g800); background:white; transition:border-color .15s; }
    .f-sel:focus { border-color:var(--brand); }
    .f-inp { width:100%; padding:7px 9px; border:1.5px solid var(--g200); border-radius:7px; font-size:13px; outline:none; font-family:inherit; color:var(--g800); transition:border-color .15s; }
    .f-inp:focus { border-color:var(--brand); }
    .f-hint { font-size:10px; color:var(--g400); margin-top:3px; }

    /* 初期費用ラジオチップ */
    .radio-row { display:flex; gap:5px; flex-wrap:wrap; }
    .radio-chip { display:inline-flex; align-items:center; padding:5px 10px; border:1.5px solid var(--g200); border-radius:20px; font-size:12px; cursor:pointer; font-family:inherit; background:white; color:var(--g600); transition:all .12s; user-select:none; }
    .radio-chip input { display:none; }
    .radio-chip.on { border-color:var(--brand); background:var(--brand-l); color:var(--brand); font-weight:600; }

    /* 月額レンジ */
    .price-range { display:flex; align-items:center; gap:5px; }
    .price-sep { font-size:12px; color:var(--g400); flex-shrink:0; }

    /* 空室トグル */
    .vac-toggle { display:flex; border:1.5px solid var(--g200); border-radius:8px; overflow:hidden; }
    .vac-tab { flex:1; padding:7px 10px; font-size:12px; font-weight:600; background:white; border:none; cursor:pointer; font-family:inherit; color:var(--g500); transition:all .12s; }
    .vac-tab.on { background:var(--brand); color:white; }

    /* チェックボックス */
    .cb-item { display:flex; align-items:center; gap:7px; padding:5px 0; cursor:pointer; user-select:none; }
    .cb-item input { width:14px; height:14px; accent-color:var(--brand); cursor:pointer; flex-shrink:0; }
    .cb-label { font-size:12px; color:var(--g700); }

    /* 入居条件セレクト */
    .cond-grp { margin-bottom:8px; }
    .cond-grp:last-child { margin-bottom:0; }
    .cond-lbl { font-size:11px; color:var(--g600); font-weight:600; margin-bottom:4px; display:block; }
    .cond-sel { width:100%; padding:6px 8px; border:1.5px solid var(--g200); border-radius:7px; font-size:12px; outline:none; font-family:inherit; background:white; color:var(--g800); transition:border-color .15s; }
    .cond-sel:focus { border-color:var(--brand); }

    /* タグ */
    .tag-bar { display:flex; flex-wrap:wrap; gap:4px; }
    .tag-chip { padding:3px 9px; border-radius:20px; font-size:10px; font-weight:500; border:1.5px solid var(--g200); background:white; color:var(--g600); cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap; line-height:1.4; }
    .tag-chip:hover { border-color:var(--brand); color:var(--brand); }
    .tag-chip.on { border-color:var(--brand); background:var(--brand); color:white; }
    .tag-sec-lbl { font-size:9px; font-weight:700; color:var(--g400); letter-spacing:.06em; margin:8px 0 4px; }

    /* MAIN */
    .main { flex:1; overflow-y:auto; display:flex; flex-direction:column; }

    /* ソートバー */
    .sort-bar { flex-shrink:0; background:white; border-bottom:1px solid var(--g200); padding:10px 16px; display:flex; align-items:center; gap:10px; }
    .result-count { font-size:13px; color:var(--g600); }
    .result-count strong { color:var(--ok); font-weight:800; }
    .sort-label { font-size:12px; color:var(--g500); margin-left:auto; white-space:nowrap; }
    .sort-sel { padding:5px 8px; border:1.5px solid var(--g200); border-radius:7px; font-size:12px; outline:none; font-family:inherit; color:var(--g700); background:white; cursor:pointer; }
    .sort-sel:focus { border-color:var(--brand); }

    /* カードグリッド */
    .cards-area { flex:1; padding:14px; }
    .cards-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; }

    /* 施設カード */
    .fcard { background:white; border-radius:12px; border:1px solid var(--g200); overflow:hidden; cursor:pointer; transition:box-shadow .15s, transform .12s; }
    .fcard:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); transform:translateY(-2px); }

    .fc-photo { height:100px; background:linear-gradient(135deg,var(--g700),var(--g900)); position:relative; overflow:hidden; }
    .fc-photo img { width:100%; height:100%; object-fit:cover; }
    .fc-photo-grad { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,20,40,.75) 0%,transparent 55%); }
    .fc-photo-type { position:absolute; top:8px; left:10px; background:rgba(10,20,40,.6); backdrop-filter:blur(6px); color:white; font-size:9px; padding:2px 8px; border-radius:20px; font-weight:700; }
    .fc-photo-plan { position:absolute; top:8px; right:10px; background:var(--brand); color:white; font-size:9px; padding:2px 8px; border-radius:20px; font-weight:700; }
    .fc-photo-name { position:absolute; bottom:8px; left:10px; right:10px; color:white; font-size:14px; font-weight:800; line-height:1.3; }

    .fc-body { padding:11px; }
    .fc-meta { display:flex; align-items:center; gap:5px; margin-bottom:8px; flex-wrap:wrap; }
    .fc-tag { font-size:10px; color:var(--g500); }
    .fc-station { font-size:10px; color:var(--g400); }

    /* 費用表示 */
    .fc-fee { background:var(--g50); border-radius:8px; padding:8px 10px; margin-bottom:8px; border:1px solid var(--g100); }
    .fc-fee-main { display:flex; align-items:baseline; gap:4px; margin-bottom:2px; }
    .fc-fee-total { font-size:20px; font-weight:900; color:var(--g900); letter-spacing:-0.5px; }
    .fc-fee-unit { font-size:11px; color:var(--g500); }
    .fc-fee-break { font-size:10px; color:var(--g400); margin-top:2px; }
    .fc-fee-ins { font-size:10px; color:var(--g500); margin-top:3px; padding-top:3px; border-top:1px dashed var(--g200); }
    .fc-init { display:inline-flex; align-items:center; font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px; margin-top:4px; }
    .fc-init.has  { background:#fef3c7; color:#b45309; }
    .fc-init.none { background:var(--ok-bg); color:var(--ok); }

    /* 空室バー */
    .fc-vac { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; margin-bottom:8px; }
    .fc-vac.ok   { background:var(--ok-bg); }
    .fc-vac.few  { background:var(--few-bg); }
    .fc-vac.full { background:var(--full-bg); }
    .fc-vnum { font-size:22px; font-weight:900; line-height:1; letter-spacing:-1px; }
    .fc-vac.ok   .fc-vnum { color:var(--ok); }
    .fc-vac.few  .fc-vnum { color:var(--few); }
    .fc-vac.full .fc-vnum { color:var(--full-c); }
    .fc-vinfo { flex:1; }
    .fc-vstatus { font-size:12px; font-weight:700; }
    .fc-vac.ok   .fc-vstatus { color:var(--ok); }
    .fc-vac.few  .fc-vstatus { color:var(--few); }
    .fc-vac.full .fc-vstatus { color:var(--full-c); }
    .fc-vupdated { font-size:10px; color:var(--g400); margin-top:1px; }
    .fc-stale { color:#ef4444; font-weight:600; }

    /* 入居条件バッジ */
    .fc-conds { display:flex; flex-wrap:wrap; gap:4px; }
    .fc-cond { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; }
    .cond-ok  { background:var(--ok-bg);   color:var(--ok); }
    .cond-sou { background:var(--amber-bg); color:var(--amber); }
    .cond-ng  { background:var(--full-bg);  color:var(--full-c); }

    /* 初期・空状態 */
    .state-box { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center; color:var(--g400); }
    .state-ico { font-size:44px; margin-bottom:14px; }
    .state-ttl { font-size:15px; font-weight:700; color:var(--g500); margin-bottom:6px; }
    .state-sub { font-size:13px; line-height:1.7; }

    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .toast { position:fixed; bottom:24px; right:24px; background:var(--g900); color:white; padding:12px 20px; border-radius:11px; font-size:13px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.25); opacity:0; transform:translateY(12px); transition:all .22s; z-index:999; pointer-events:none; }
    .toast.on { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">🏥</div>
  <div>
    <div class="hdr-title">介護施設 空き状況検索</div>
    <div class="hdr-sub">ソーシャルワーカー・ケアマネ専用</div>
  </div>
  <div class="hdr-right">
    <button class="hdr-logout" onclick="firebase.auth().signOut().then(()=>location.href='kaigo-login.html')">ログアウト</button>
  </div>
</header>

<!-- BODY -->
<div class="body-wrap">

  <!-- 左サイドバー（検索フォーム） -->
  <div class="sidebar">

    <button class="sb-search-btn" id="search-btn" onclick="doSearch()">🔍 この条件で検索</button>

    <!-- 場所 -->
    <div class="sb-sec">
      <div class="sb-sec-hd"><span class="sb-sec-title">場所</span></div>
      <div class="f-grp">
        <label class="f-lbl">都道府県</label>
        <select class="f-sel" id="q-pref" onchange="updateCityOptions()">
          <option value="">すべて</option>
          <option value="大阪府" selected>大阪府</option>
          <option value="兵庫県">兵庫県</option>
          <option value="京都府">京都府</option>
          <option value="奈良県">奈良県</option>
        </select>
      </div>
      <div class="f-grp">
        <label class="f-lbl">市区町村</label>
        <select class="f-sel" id="q-city">
          <option value="">すべて</option>
          <option value="豊中市">豊中市</option>
          <option value="吹田市">吹田市</option>
          <option value="茨木市">茨木市</option>
          <option value="池田市">池田市</option>
          <option value="箕面市">箕面市</option>
        </select>
      </div>
      <div class="f-grp">
        <label class="f-lbl">駅名（フリー検索）</label>
        <input class="f-inp" id="q-station" type="text" placeholder="例：服部天神">
        <div class="f-hint">路線名・駅名どちらでも検索できます</div>
      </div>
    </div>

    <!-- 費用 -->
    <div class="sb-sec">
      <div class="sb-sec-hd"><span class="sb-sec-title">費用</span></div>
      <div class="f-grp">
        <label class="f-lbl">初期費用（入居一時金）</label>
        <div class="radio-row" id="init-fee-radios">
          <label class="radio-chip on"><input type="radio" name="init-fee" value="all" checked onchange="syncRadioChip(this)">指定なし</label>
          <label class="radio-chip"><input type="radio" name="init-fee" value="yes" onchange="syncRadioChip(this)">あり</label>
          <label class="radio-chip"><input type="radio" name="init-fee" value="no" onchange="syncRadioChip(this)">なし</label>
        </div>
      </div>
      <div class="f-grp">
        <label class="f-lbl">月額（万円）</label>
        <div class="price-range">
          <select class="f-sel" id="q-price-min" style="flex:1" onchange="liveFilter()">
            <option value="">下限なし</option>
            <option value="5">5万〜</option>
            <option value="8">8万〜</option>
            <option value="10">10万〜</option>
            <option value="12">12万〜</option>
            <option value="15">15万〜</option>
            <option value="20">20万〜</option>
          </select>
          <span class="price-sep">〜</span>
          <select class="f-sel" id="q-price-max" style="flex:1" onchange="liveFilter()">
            <option value="">上限なし</option>
            <option value="10">10万以下</option>
            <option value="12">12万以下</option>
            <option value="15">15万以下</option>
            <option value="18">18万以下</option>
            <option value="20">20万以下</option>
            <option value="25">25万以下</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 空室 -->
    <div class="sb-sec">
      <div class="sb-sec-hd"><span class="sb-sec-title">空室状況</span></div>
      <div class="vac-toggle">
        <button class="vac-tab on" onclick="setVac('all',this)">すべて</button>
        <button class="vac-tab" onclick="setVac('ok',this)">空きあり</button>
      </div>
    </div>

    <!-- 施設種別 -->
    <div class="sb-sec">
      <div class="sb-sec-hd">
        <span class="sb-sec-title">施設種別</span>
        <button class="sb-clear" onclick="toggleAll('type',true)">全選択</button>
      </div>
      <div id="type-list"></div>
    </div>

    <!-- 入居条件 -->
    <div class="sb-sec">
      <div class="sb-sec-hd"><span class="sb-sec-title">入居条件</span></div>
      <div class="cond-grp">
        <span class="cond-lbl">生活保護</span>
        <select class="cond-sel" id="cond-seikatsu" onchange="liveFilter()">
          <option value="">指定なし</option>
          <option value="可">可</option>
          <option value="相談可">相談可</option>
          <option value="不可">不可</option>
        </select>
      </div>
      <div class="cond-grp">
        <span class="cond-lbl">身元保証なし</span>
        <select class="cond-sel" id="cond-mimon" onchange="liveFilter()">
          <option value="">指定なし</option>
          <option value="可">可</option>
          <option value="相談可">相談可</option>
          <option value="不可">不可</option>
        </select>
      </div>
      <div class="cond-grp">
        <span class="cond-lbl">介護認定なし</span>
        <select class="cond-sel" id="cond-kaigo" onchange="liveFilter()">
          <option value="">指定なし</option>
          <option value="なし">なし</option>
          <option value="相談可">相談可</option>
          <option value="不可">不可</option>
        </select>
      </div>
    </div>

    <!-- タグ -->
    <div class="sb-sec">
      <div class="sb-sec-hd">
        <span class="sb-sec-title">こだわり・タグ</span>
        <button class="sb-clear" onclick="clearTags()">クリア</button>
      </div>
      <div class="tag-sec-lbl">こだわり・特徴</div>
      <div class="tag-bar" id="tag-bar-feature"></div>
      <div class="tag-sec-lbl">看護・医療体制</div>
      <div class="tag-bar" id="tag-bar-medical"></div>
    </div>

  </div>

  <!-- メインコンテンツ -->
  <div class="main">

    <!-- ソートバー -->
    <div class="sort-bar" id="sort-bar" style="display:none">
      <span class="result-count" id="count-bar"></span>
      <span class="sort-label">並べ替え</span>
      <select class="sort-sel" id="sort-sel" onchange="applySort()">
        <option value="updated">更新が新しい順</option>
        <option value="fee_asc">月額が安い順</option>
        <option value="fee_desc">月額が高い順</option>
      </select>
    </div>

    <!-- カード一覧 -->
    <div class="cards-area" id="cards-area">
      <div class="state-box">
        <div class="state-ico">🔍</div>
        <div class="state-ttl">条件を選んで検索してください</div>
        <div class="state-sub">左のフォームで条件を設定し<br>「この条件で検索」を押してください</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'kaigo-login.html'; return; }
  const uSnap = await db.collection('users').doc(user.uid).get();
  const role = uSnap.data()?.role;
  if (!['hospital', 'admin'].includes(role)) {
    await auth.signOut(); location.href = 'kaigo-login.html'; return;
  }
  document.body.style.visibility = 'visible';
  initSidebar();
});

// ── 定数 ─────────────────────────────────────────────────
const TYPES = [
  {key:'特養',         sub:'特別養護老人ホーム'},
  {key:'老健',         sub:'介護老人保健施設'},
  {key:'グループホーム', sub:'認知症対応型共同生活'},
  {key:'サ高住',       sub:'サービス付高齢者向け住宅'},
  {key:'介護付有料',   sub:'介護付有料老人ホーム'},
  {key:'住宅型有料',   sub:'住宅型有料老人ホーム'},
];

const CITY_MAP = {
  '大阪府': ['豊中市','吹田市','茨木市','池田市','箕面市','摂津市','高槻市','枚方市','大阪市'],
  '兵庫県': ['尼崎市','西宮市','芦屋市','神戸市','宝塚市','川西市'],
  '京都府': ['京都市','向日市','長岡京市'],
  '奈良県': ['奈良市','大和郡山市','天理市'],
};

  'キッチン付き居室','家具付き居室','ナースコールあり','機械浴・特殊浴あり',
  '理美容サービスあり','レクリエーション充実','将棋・囲碁あり','禁煙',
  '駅近・交通アクセス良好','大手が運営','夫婦入居可・2人部屋あり',
  '終身利用可','体験入居可','病院・クリニック併設','24時間看護師常駐',
  '夜間有人','言語聴覚士（ST）','風呂付き居室','介護ベッド付居室',
  'ゲストルームあり','入浴週3回以上','カラオケあり','園芸・庭園あり','アルコール可','外出自由',
  '安い・低価格','ペット・犬・猫可','ショートステイ可','デイサービス併設',
  '24時間介護士常駐','理学療法士（PT）','手厚い人員体制','トイレ付き居室',
  'ネット利用可','口腔ケア・訪問歯科あり','施設内手作りの食事','麻雀あり','喫煙可',
];
const TAGS_MEDICAL = [
  'リハビリ','胃ろう','人工呼吸器','たん吸引','気管切開',
  '褥瘡・床ずれ','脳血管性認知症','パーキンソン病','脳梗塞・クモ膜下出血',
  'リウマチ・関節症','誤嚥性肺炎','介護食','糖尿病・インスリン','ペースメーカー',
  '鼻腔・経管栄養','ストーマ・人工肛門','ALS','心筋梗塞・狭心症','肝炎',
  '統合失調症','流動食・嚥下食','人工透析','中心静脈栄養（IVH）','在宅酸素療法',
  'カテーテル・尿バルーン','アルツハイマー','レビー小体型認知症','がん・末期癌',
  '骨折・骨粗しょう症','喘息・気管支炎','うつ・鬱病',
];

// ── 状態 ──────────────────────────────────────────────────
let DATA = [];
let SORTED = [];
let activeVac = 'all';
const selectedTags = new Set();

// ── サイドバー初期化 ───────────────────────────────────────
function initSidebar() {
  document.getElementById('type-list').innerHTML = TYPES.map(t =>
    `<label class="cb-item">
      <input type="checkbox" name="type" value="${t.key}" checked onchange="liveFilter()">
      <span class="cb-label">${t.key}<span style="font-size:9px;color:var(--g400);margin-left:3px">${t.sub}</span></span>
    </label>`
  ).join('');

  document.getElementById('tag-bar-feature').innerHTML = TAGS_FEATURE.map(t =>
    `<button class="tag-chip" onclick="toggleTag('${t}',this)">${t}</button>`
  ).join('');
  document.getElementById('tag-bar-medical').innerHTML = TAGS_MEDICAL.map(t =>
    `<button class="tag-chip" onclick="toggleTag('${t}',this)">${t}</button>`
  ).join('');
}

// ── 都道府県→市区町村 連動 ────────────────────────────────
function updateCityOptions() {
  const pref = document.getElementById('q-pref').value;
  const cities = CITY_MAP[pref] || [];
  const sel = document.getElementById('q-city');
  sel.innerHTML = '<option value="">すべて</option>' +
    cities.map(c => `<option value="${c}">${c}</option>`).join('');
}

// ── ラジオチップ同期 ───────────────────────────────────────
function syncRadioChip(input) {
  document.querySelectorAll('#init-fee-radios .radio-chip').forEach(chip => {
    chip.classList.toggle('on', chip.querySelector('input').checked);
  });
  liveFilter();
}

// ── 検索実行（Firestore取得） ──────────────────────────────
async function doSearch() {
  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 検索中...';

  const pref = document.getElementById('q-pref').value;

  try {
    let query = db.collection('facilities');
    if (pref) query = query.where('prefecture', '==', pref);
    const snap = await query.get();
    DATA = snap.docs.map(mapDoc);
    applySort();
  } catch(e) {
    document.getElementById('cards-area').innerHTML =
      `<div class="state-box"><div class="state-ico">⚠️</div><div class="state-ttl">読み込みエラー</div><div class="state-sub">${e.message}</div></div>`;
    document.getElementById('sort-bar').style.display = 'none';
  }

  btn.disabled = false;
  btn.innerHTML = '🔍 この条件で検索';
}

// ── ソート ──────────────────────────────────────────────────
function applySort() {
  if (!DATA.length) { renderCards([]); return; }
  const sort = document.getElementById('sort-sel').value;
  SORTED = [...DATA];
  if (sort === 'fee_asc')  SORTED.sort((a, b) => (a.monthlyTotal ?? 999) - (b.monthlyTotal ?? 999));
  if (sort === 'fee_desc') SORTED.sort((a, b) => (b.monthlyTotal ?? 0) - (a.monthlyTotal ?? 0));
  if (sort === 'updated')  SORTED.sort((a, b) => a.daysAgo - b.daysAgo);
  liveFilter();
}

// ── クライアント絞り込み ─────────────────────────────────────
function liveFilter() {
  if (!DATA.length) return;
  const city     = document.getElementById('q-city').value;
  const station  = document.getElementById('q-station').value.trim();
  const initFee  = document.querySelector('input[name="init-fee"]:checked')?.value || 'all';
  const priceMin = parseFloat(document.getElementById('q-price-min').value || '0');
  const priceMax = parseFloat(document.getElementById('q-price-max').value || '0');
  const types    = getChecked('type');
  const seikatsu = document.getElementById('cond-seikatsu').value;
  const mimon    = document.getElementById('cond-mimon').value;
  const kaigo    = document.getElementById('cond-kaigo').value;

  const base = SORTED.length ? SORTED : DATA;

  const list = base.filter(f => {
    if (city    && f.city !== city) return false;
    if (station && !f.station.includes(station)) return false;
    if (initFee === 'yes' && !f.initialFee) return false;
    if (initFee === 'no'  &&  f.initialFee) return false;
    if (types.length && !types.includes(f.type)) return false;
    if (activeVac === 'ok' && f.vacancy === 0) return false;
    if (selectedTags.size && ![...selectedTags].every(t => f.features.includes(t))) return false;
    if (seikatsu && f.seikatsuHogo !== seikatsu) return false;
    if (mimon    && f.mimonHosho   !== mimon)    return false;
    if (kaigo    && f.kaigoNintei  !== kaigo)    return false;
    if (priceMin && f.monthlyTotal != null && f.monthlyTotal < priceMin) return false;
    if (priceMax && f.monthlyTotal != null && f.monthlyTotal > priceMax) return false;
    return true;
  });

  renderCards(list);
}

// ── データ変換 ────────────────────────────────────────────────
function mapDoc(doc) {
  const d = doc.data();
  const upd = d.updatedAt ? d.updatedAt.toDate() : new Date();
  const daysAgo = Math.floor((new Date() - upd) / 86400000);

  const rent = d.rent      ?? null;
  const mgmt = d.managementFee ?? null;
  const meal = d.mealFee   ?? null;
  const hasBreakdown = rent !== null || mgmt !== null || meal !== null;
  const monthlyTotal = hasBreakdown
    ? (rent || 0) + (mgmt || 0) + (meal || 0)
    : (d.monthlyFee ?? null);

  return {
    id: doc.id,
    name: d.name || '',
    type: d.type || '',
    prefecture: d.prefecture || '',
    city: d.city || '',
    addr: d.address || '',
    area: d.area || '',
    station: [d.station, d.stationDistance].filter(Boolean).join(' '),
    vacancy: typeof d.vacancy === 'number' ? d.vacancy : 0,
    vacancyNotes: d.vacancyNotes || '',
    features: d.features || [],
    seikatsuHogo: d.seikatsuHogo || '',
    mimonHosho: d.mimonHosho || '',
    kaigoNintei: d.kaigoNintei || '',
    plan: d.plan || 'free',
    photoUrl: d.photoUrl || null,
    initialFee: d.initialFee ?? false,
    initialFeeAmount: d.initialFeeAmount ?? null,
    rent, mgmt, meal, hasBreakdown,
    monthlyTotal,
    updated: daysAgo === 0 ? '本日' : daysAgo + '日前',
    daysAgo,
  };
}

// ── カード描画 ────────────────────────────────────────────────
function renderCards(list) {
  const area    = document.getElementById('cards-area');
  const bar     = document.getElementById('count-bar');
  const sortBar = document.getElementById('sort-bar');

  const okCnt   = list.filter(f => f.vacancy > 0).length;
  const fullCnt = list.filter(f => f.vacancy === 0).length;
  bar.innerHTML = `<strong>${okCnt}件</strong>空きあり / 満室${fullCnt}件 / 計${list.length}件`;
  sortBar.style.display = 'flex';

  if (!list.length) {
    area.innerHTML = '<div class="state-box"><div class="state-ico">🔍</div><div class="state-ttl">条件に合う施設が見つかりません</div><div class="state-sub">条件を変えて再検索してください</div></div>';
    return;
  }
  area.innerHTML = `<div class="cards-grid">${list.map(cardHTML).join('')}</div>`;
}

function feeHTML(f) {
  if (f.monthlyTotal == null) return '';

  const breakLine = f.hasBreakdown
    ? `<div class="fc-fee-break">家賃${f.rent ?? '─'}万 ＋ 管理費${f.mgmt ?? '─'}万 ＋ 食費${f.meal ?? '─'}万</div>`
    : `<div class="fc-fee-break">月額合計（家賃・管理費・食費込み）</div>`;

  const initTag = f.initialFee
    ? `<span class="fc-init has">初期費用あり${f.initialFeeAmount ? '（' + f.initialFeeAmount + '万円）' : ''}</span>`
    : `<span class="fc-init none">初期費用なし</span>`;

  return `<div class="fc-fee">
    <div class="fc-fee-main">
      <span class="fc-fee-total">${f.monthlyTotal}</span>
      <span class="fc-fee-unit">万円／月</span>
    </div>
    ${breakLine}
    <div class="fc-fee-ins">＋介護保険（1割負担 約1〜2万）別途</div>
    ${initTag}
  </div>`;
}

function condBadge(label, val, okVal) {
  if (!val) return '';
  const cls = val === okVal ? 'cond-ok' : val === '相談可' ? 'cond-sou' : 'cond-ng';
  return `<span class="fc-cond ${cls}">${label}:${val}</span>`;
}

function cardHTML(f) {
  const vacCls   = f.vacancy === 0 ? 'full' : f.vacancy <= 2 ? 'few' : 'ok';
  const vacLabel = f.vacancy === 0 ? '満室' : f.vacancy <= 2 ? `残り${f.vacancy}室` : `${f.vacancy}室空き`;
  const staleClass = f.daysAgo > 14 ? 'fc-stale' : '';
  const condBadges = [
    condBadge('生活保護', f.seikatsuHogo, '可'),
    condBadge('身元保証', f.mimonHosho,   '可'),
    condBadge('介護認定', f.kaigoNintei,  'なし'),
  ].filter(Boolean).join('');

  const locationTags = [
    f.city ? `🏙 ${f.city}` : (f.area ? `📍 ${f.area}エリア` : ''),
    f.station ? `🚉 ${f.station}` : '',
  ].filter(Boolean);

  return `<div class="fcard" onclick="location.href='kaigo-facility-view.html?id=${f.id}'">
    <div class="fc-photo">
      ${f.photoUrl ? `<img src="${f.photoUrl}" alt="${f.name}" loading="lazy">` : ''}
      <div class="fc-photo-grad"></div>
      <div class="fc-photo-type">${f.type}</div>
      ${f.plan !== 'free' ? '<div class="fc-photo-plan">✓ 問合せ可</div>' : ''}
      <div class="fc-photo-name">${f.name}</div>
    </div>
    <div class="fc-body">
      ${locationTags.length ? `<div class="fc-meta">${locationTags.map(t=>`<span class="fc-tag">${t}</span>`).join('')}</div>` : ''}
      ${feeHTML(f)}
      <div class="fc-vac ${vacCls}">
        <div class="fc-vnum">${f.vacancy === 0 ? '─' : f.vacancy}</div>
        <div class="fc-vinfo">
          <div class="fc-vstatus">${vacLabel}</div>
          <div class="fc-vupdated ${staleClass}">更新：${f.updated}${f.daysAgo > 14 ? ' ⚠️' : ''}</div>
        </div>
      </div>
      ${condBadges ? `<div class="fc-conds">${condBadges}</div>` : ''}
    </div>
  </div>`;
}

// ── UI ヘルパー ───────────────────────────────────────────────
function getChecked(name) {
  return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
}

function toggleAll(name, checked) {
  document.querySelectorAll(`input[name="${name}"]`).forEach(cb => cb.checked = checked);
  liveFilter();
}

function setVac(v, btn) {
  activeVac = v;
  document.querySelectorAll('.vac-tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  liveFilter();
}

function toggleTag(tag, btn) {
  if (selectedTags.has(tag)) { selectedTags.delete(tag); btn.classList.remove('on'); }
  else { selectedTags.add(tag); btn.classList.add('on'); }
  liveFilter();
}

function clearTags() {
  selectedTags.clear();
  document.querySelectorAll('.tag-chip').forEach(b => b.classList.remove('on'));
  liveFilter();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}
</script>
