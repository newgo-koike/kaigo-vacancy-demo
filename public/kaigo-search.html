<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>介護施設 空き状況検索</title>
  <style>
    :root {
      --brand:#0d9488; --brand-d:#0f766e; --brand-l:#f0fdfa;
      --ok:#16a34a; --ok-bg:#dcfce7;
      --few:#ea580c; --few-bg:#ffedd5;
      --full-c:#64748b; --full-bg:#f1f5f9;
      --amber:#d97706; --amber-bg:#fef3c7;
      --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1;
      --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155;
      --g800:#1e293b; --g900:#0f172a;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body { font-family:-apple-system,'Hiragino Sans',Arial,sans-serif; background:var(--g50); color:var(--g800); line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; visibility:hidden; }

    /* ── HEADER ── */
    .hdr { flex-shrink:0; background:var(--g900); height:52px; padding:0 16px; display:flex; align-items:center; gap:10px; z-index:200; }
    .hdr-logo { width:28px; height:28px; background:var(--brand); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .hdr-title { font-size:14px; font-weight:800; color:white; }
    .hdr-sub { font-size:10px; color:var(--g400); }
    .hdr-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .hdr-logout { background:transparent; border:1px solid var(--g600); color:var(--g400); font-size:11px; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:inherit; }
    .hdr-logout:hover { color:white; border-color:var(--g400); }

    /* ── SEARCH FORM ── */
    .search-form { flex-shrink:0; background:white; border-bottom:2px solid var(--g200); padding:14px 20px; }
    .sf-row { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
    .sf-group { display:flex; flex-direction:column; gap:5px; }
    .sf-label { font-size:10px; font-weight:800; color:var(--g500); letter-spacing:.06em; text-transform:uppercase; }

    /* ドロップダウン式チェックボックス */
    .dropdown-wrap { position:relative; }
    .dropdown-btn { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1.5px solid var(--g200); border-radius:8px; font-size:13px; font-family:inherit; background:white; color:var(--g700); cursor:pointer; white-space:nowrap; min-width:130px; transition:border-color .15s; }
    .dropdown-btn:hover, .dropdown-btn.open { border-color:var(--brand); }
    .dropdown-btn .arrow { margin-left:auto; font-size:10px; color:var(--g400); transition:transform .15s; }
    .dropdown-btn.open .arrow { transform:rotate(180deg); }
    .dropdown-badge { background:var(--brand); color:white; font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px; }
    .dropdown-panel { display:none; position:absolute; top:calc(100% + 4px); left:0; background:white; border:1.5px solid var(--g200); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.12); z-index:300; min-width:180px; padding:8px 0; }
    .dropdown-panel.open { display:block; }
    .dp-item { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer; transition:background .1s; }
    .dp-item:hover { background:var(--g50); }
    .dp-item input { width:14px; height:14px; accent-color:var(--brand); cursor:pointer; flex-shrink:0; }
    .dp-item label { font-size:13px; color:var(--g700); cursor:pointer; }
    .dp-divider { border:none; border-top:1px solid var(--g100); margin:4px 0; }
    .dp-all-btn { display:block; width:100%; padding:6px 14px; font-size:11px; color:var(--brand); background:none; border:none; cursor:pointer; font-family:inherit; text-align:left; font-weight:600; }

    /* 金額レンジ */
    .price-range { display:flex; align-items:center; gap:6px; }
    .price-sel { padding:8px 10px; border:1.5px solid var(--g200); border-radius:8px; font-size:13px; outline:none; font-family:inherit; color:var(--g700); background:white; cursor:pointer; transition:border-color .15s; }
    .price-sel:focus { border-color:var(--brand); }
    .price-sep { font-size:12px; color:var(--g400); }

    /* 空室・検索ボタン */
    .vac-toggle { display:flex; border:1.5px solid var(--g200); border-radius:8px; overflow:hidden; }
    .vac-tab { padding:8px 14px; font-size:12px; font-weight:600; background:white; border:none; cursor:pointer; font-family:inherit; color:var(--g500); transition:all .12s; white-space:nowrap; }
    .vac-tab.on { background:var(--brand); color:white; }
    .search-btn { display:flex; align-items:center; gap:6px; padding:9px 24px; background:var(--brand); color:white; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .12s; white-space:nowrap; }
    .search-btn:hover:not(:disabled) { background:var(--brand-d); }
    .search-btn:disabled { background:var(--g400); cursor:not-allowed; }
    .result-count-bar { font-size:12px; color:var(--g500); white-space:nowrap; padding:8px 0; }

    .spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── BODY LAYOUT ── */
    .body-wrap { flex:1; display:flex; overflow:hidden; }

    /* ── LEFT SIDEBAR ── */
    .sidebar { width:220px; min-width:220px; background:white; border-right:1px solid var(--g200); overflow-y:auto; flex-shrink:0; }
    .sb-sec { border-bottom:1px solid var(--g100); padding:14px 14px 12px; }
    .sb-sec-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .sb-sec-title { font-size:11px; font-weight:800; color:var(--g600); letter-spacing:.04em; }
    .sb-clear { font-size:10px; color:var(--brand); background:none; border:none; cursor:pointer; font-family:inherit; padding:0; }
    .cb-item { display:flex; align-items:center; gap:7px; padding:5px 0; cursor:pointer; user-select:none; }
    .cb-item input { width:14px; height:14px; accent-color:var(--brand); cursor:pointer; flex-shrink:0; }
    .cb-label { font-size:12px; color:var(--g700); }
    .cb-count { font-size:10px; color:var(--g400); margin-left:auto; }

    /* 入居条件セレクト */
    .cond-grp { margin-bottom:8px; }
    .cond-grp:last-child { margin-bottom:0; }
    .cond-lbl { font-size:11px; color:var(--g600); font-weight:600; margin-bottom:4px; display:block; }
    .cond-sel { width:100%; padding:6px 8px; border:1.5px solid var(--g200); border-radius:7px; font-size:12px; outline:none; font-family:inherit; background:white; color:var(--g800); transition:border-color .15s; }
    .cond-sel:focus { border-color:var(--brand); }

    /* タグ */
    .tag-bar { display:flex; flex-wrap:wrap; gap:4px; }
    .tag-chip { padding:3px 9px; border-radius:20px; font-size:10px; font-weight:500; border:1.5px solid var(--g200); background:white; color:var(--g600); cursor:pointer; font-family:inherit; transition:all .12s; white-space:nowrap; line-height:1.4; }
    .tag-chip:hover { border-color:var(--brand); color:var(--brand); }
    .tag-chip.on { border-color:var(--brand); background:var(--brand); color:white; }
    .tag-sec-lbl { font-size:9px; font-weight:700; color:var(--g400); letter-spacing:.06em; text-transform:uppercase; margin:8px 0 4px; }

    /* ── MAIN CONTENT ── */
    .main { flex:1; overflow-y:auto; padding:16px; }

    /* 統計バー */
    .stats-bar { display:flex; align-items:center; gap:14px; margin-bottom:14px; padding:10px 14px; background:white; border-radius:10px; border:1px solid var(--g200); }
    .stat-item { display:flex; align-items:center; gap:5px; font-size:12px; }
    .stat-dot { width:8px; height:8px; border-radius:50%; }
    .stat-num { font-weight:800; font-size:14px; }

    /* 施設カードグリッド */
    .cards-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }

    /* 施設カード */
    .fcard { background:white; border-radius:12px; border:1px solid var(--g200); overflow:hidden; cursor:pointer; transition:box-shadow .15s, transform .12s; }
    .fcard:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); transform:translateY(-2px); }

    .fc-photo { height:120px; background:linear-gradient(135deg,var(--g700),var(--g900)); position:relative; overflow:hidden; flex-shrink:0; }
    .fc-photo img { width:100%; height:100%; object-fit:cover; }
    .fc-photo-grad { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,20,40,.7) 0%,transparent 55%); }
    .fc-photo-type { position:absolute; top:8px; left:10px; background:rgba(10,20,40,.6); backdrop-filter:blur(6px); color:white; font-size:9px; padding:2px 8px; border-radius:20px; font-weight:700; }
    .fc-photo-plan { position:absolute; top:8px; right:10px; background:var(--brand); color:white; font-size:9px; padding:2px 8px; border-radius:20px; font-weight:700; }
    .fc-photo-name { position:absolute; bottom:8px; left:10px; right:10px; color:white; font-size:14px; font-weight:800; line-height:1.3; }

    .fc-body { padding:12px; }
    .fc-meta { display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
    .fc-area { font-size:11px; color:var(--g500); }
    .fc-station { font-size:11px; color:var(--g400); }

    /* 空室バー */
    .fc-vac { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; margin-bottom:8px; }
    .fc-vac.ok   { background:var(--ok-bg); }
    .fc-vac.few  { background:var(--few-bg); }
    .fc-vac.full { background:var(--full-bg); }
    .fc-vnum { font-size:24px; font-weight:900; line-height:1; letter-spacing:-1px; }
    .fc-vac.ok   .fc-vnum { color:var(--ok); }
    .fc-vac.few  .fc-vnum { color:var(--few); }
    .fc-vac.full .fc-vnum { color:var(--full-c); }
    .fc-vinfo { flex:1; }
    .fc-vstatus { font-size:12px; font-weight:700; }
    .fc-vac.ok   .fc-vstatus { color:var(--ok); }
    .fc-vac.few  .fc-vstatus { color:var(--few); }
    .fc-vac.full .fc-vstatus { color:var(--full-c); }
    .fc-vnotes { font-size:10px; color:var(--g600); margin-top:2px; }
    .fc-vupdated { font-size:10px; color:var(--g400); margin-top:1px; }
    .fc-stale { color:#ef4444; font-weight:600; }

    /* 入居条件バッジ */
    .fc-conds { display:flex; flex-wrap:wrap; gap:4px; }
    .fc-cond { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; }
    .cond-ok  { background:var(--ok-bg);   color:var(--ok); }
    .cond-sou { background:var(--amber-bg); color:var(--amber); }
    .cond-ng  { background:var(--full-bg);  color:var(--full-c); }
    .cond-na  { background:var(--g100);     color:var(--g400); }

    /* 初期・空状態 */
    .state-box { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center; color:var(--g400); }
    .state-ico { font-size:44px; margin-bottom:14px; }
    .state-ttl { font-size:15px; font-weight:700; color:var(--g500); margin-bottom:6px; }
    .state-sub { font-size:13px; line-height:1.7; }

    .toast { position:fixed; bottom:24px; right:24px; background:var(--g900); color:white; padding:12px 20px; border-radius:11px; font-size:13px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.25); opacity:0; transform:translateY(12px); transition:all .22s; z-index:999; pointer-events:none; }
    .toast.on { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">🏥</div>
  <div>
    <div class="hdr-title">介護施設 空き状況検索</div>
    <div class="hdr-sub">豊中エリア 介護施設情報プラットフォーム</div>
  </div>
  <div class="hdr-right">
    <button class="hdr-logout" onclick="firebase.auth().signOut().then(()=>location.href='kaigo-login.html')">ログアウト</button>
  </div>
</header>

<!-- SEARCH FORM -->
<div class="search-form">
  <div class="sf-row">

    <!-- 都道府県 -->
    <div class="sf-group">
      <span class="sf-label">都道府県</span>
      <div class="dropdown-wrap" id="dw-pref">
        <button class="dropdown-btn" id="db-pref" onclick="toggleDropdown('pref');event.stopPropagation()">
          <span id="dl-pref">大阪府</span>
          <span class="arrow">▼</span>
        </button>
        <div class="dropdown-panel" id="dp-pref">
          <button class="dp-all-btn" onclick="toggleAllDp('pref',true);event.stopPropagation()">全選択</button>
          <button class="dp-all-btn" onclick="toggleAllDp('pref',false);event.stopPropagation()">全解除</button>
          <hr class="dp-divider">
          <label class="dp-item"><input type="checkbox" name="pref" value="大阪府" checked onchange="updateDropdownLabel('pref','dl-pref','都道府県')"><span>大阪府</span></label>
          <label class="dp-item"><input type="checkbox" name="pref" value="兵庫県" onchange="updateDropdownLabel('pref','dl-pref','都道府県')"><span>兵庫県</span></label>
          <label class="dp-item"><input type="checkbox" name="pref" value="京都府" onchange="updateDropdownLabel('pref','dl-pref','都道府県')"><span>京都府</span></label>
          <label class="dp-item"><input type="checkbox" name="pref" value="奈良県" onchange="updateDropdownLabel('pref','dl-pref','都道府県')"><span>奈良県</span></label>
        </div>
      </div>
    </div>

    <!-- 市町村 -->
    <div class="sf-group">
      <span class="sf-label">市町村</span>
      <input class="price-sel" id="q-city" type="text" placeholder="例：豊中市" style="min-width:130px">
    </div>

    <!-- エリア -->
    <div class="sf-group">
      <span class="sf-label">エリア</span>
      <div class="dropdown-wrap" id="dw-area-dp">
        <button class="dropdown-btn" id="db-area-dp" onclick="toggleDropdown('area-dp');event.stopPropagation()">
          <span id="dl-area-dp">すべて</span>
          <span class="arrow">▼</span>
        </button>
        <div class="dropdown-panel" id="dp-area-dp">
          <button class="dp-all-btn" onclick="toggleAllDp('area-dp',true);event.stopPropagation()">全選択</button>
          <button class="dp-all-btn" onclick="toggleAllDp('area-dp',false);event.stopPropagation()">全解除</button>
          <hr class="dp-divider">
          <label class="dp-item"><input type="checkbox" name="area-dp" value="庄内" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>庄内</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="服部" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>服部</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="曽根" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>曽根</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="岡町" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>岡町</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="蛍池" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>蛍池</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="刀根山" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>刀根山</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="千里" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>千里</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="少路" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>少路</span></label>
          <label class="dp-item"><input type="checkbox" name="area-dp" value="豊中" onchange="updateDropdownLabel('area-dp','dl-area-dp','エリア')"><span>豊中</span></label>
        </div>
      </div>
    </div>

    <!-- 月額 -->
    <div class="sf-group">
      <span class="sf-label">月額（万円）</span>
      <div class="price-range">
        <select class="price-sel" id="q-price-min">
          <option value="">下限なし</option>
          <option value="5">5万〜</option>
          <option value="10">10万〜</option>
          <option value="15">15万〜</option>
          <option value="20">20万〜</option>
          <option value="25">25万〜</option>
        </select>
        <span class="price-sep">〜</span>
        <select class="price-sel" id="q-price-max">
          <option value="">上限なし</option>
          <option value="10">10万以下</option>
          <option value="15">15万以下</option>
          <option value="20">20万以下</option>
          <option value="25">25万以下</option>
          <option value="30">30万以下</option>
        </select>
      </div>
    </div>

    <!-- 空室 -->
    <div class="sf-group">
      <span class="sf-label">空室状況</span>
      <div class="vac-toggle">
        <button class="vac-tab on" onclick="setVac('all',this)">すべて</button>
        <button class="vac-tab" onclick="setVac('ok',this)">空きあり</button>
      </div>
    </div>

    <!-- 検索ボタン -->
    <button class="search-btn" id="search-btn" onclick="doSearch()">🔍 検索</button>

  </div>
  <div class="result-count-bar" id="count-bar"></div>
</div>

<!-- BODY -->
<div class="body-wrap">

  <!-- 左サイドバー -->
  <div class="sidebar">

    <!-- エリア -->
    <div class="sb-sec">
      <div class="sb-sec-hd">
        <span class="sb-sec-title">エリア</span>
        <button class="sb-clear" onclick="toggleAll('area',true)">全選択</button>
      </div>
      <div id="area-list"></div>
    </div>

    <!-- 施設種別 -->
    <div class="sb-sec">
      <div class="sb-sec-hd">
        <span class="sb-sec-title">施設種別</span>
        <button class="sb-clear" onclick="toggleAll('type',true)">全選択</button>
      </div>
      <div id="type-list"></div>
    </div>

    <!-- 入居条件 -->
    <div class="sb-sec">
      <div class="sb-sec-hd">
        <span class="sb-sec-title">入居条件</span>
      </div>
      <div class="cond-grp">
        <span class="cond-lbl">生活保護</span>
        <select class="cond-sel" id="cond-seikatsu">
          <option value="">指定なし</option>
          <option value="可">可</option>
          <option value="相談可">相談可</option>
          <option value="不可">不可</option>
        </select>
      </div>
      <div class="cond-grp">
        <span class="cond-lbl">身元保証なし</span>
        <select class="cond-sel" id="cond-mimon">
          <option value="">指定なし</option>
          <option value="可">可</option>
          <option value="相談可">相談可</option>
          <option value="不可">不可</option>
        </select>
      </div>
      <div class="cond-grp">
        <span class="cond-lbl">介護認定なし</span>
        <select class="cond-sel" id="cond-kaigo">
          <option value="">指定なし</option>
          <option value="なし">なし</option>
          <option value="相談可">相談可</option>
          <option value="不可">不可</option>
        </select>
      </div>
    </div>

    <!-- タグ -->
    <div class="sb-sec">
      <div class="sb-sec-hd">
        <span class="sb-sec-title">こだわり・タグ</span>
        <button class="sb-clear" onclick="clearTags()">クリア</button>
      </div>
      <div class="tag-sec-lbl">こだわり・特徴</div>
      <div class="tag-bar" id="tag-bar-feature"></div>
      <div class="tag-sec-lbl">看護・医療体制</div>
      <div class="tag-bar" id="tag-bar-medical"></div>
    </div>

  </div>

  <!-- メインコンテンツ -->
  <div class="main" id="main">
    <div class="state-box">
      <div class="state-ico">🔍</div>
      <div class="state-ttl">条件を選んで検索してください</div>
      <div class="state-sub">左のフィルターで絞り込み後<br>上部の「検索」ボタンを押してください</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'kaigo-login.html'; return; }
  const uSnap = await db.collection('users').doc(user.uid).get();
  const role = uSnap.data()?.role;
  if (!['hospital', 'admin'].includes(role)) {
    await auth.signOut(); location.href = 'kaigo-login.html'; return;
  }
  document.body.style.visibility = 'visible';
  initSidebar();
});

// ─── 定数 ────────────────────────────────────────────
const AREA_ORDER = ['庄内','服部','曽根','岡町','蛍池','刀根山','千里','少路','豊中'];
const TYPES = [
  {key:'特養',    sub:'特別養護老人ホーム'},
  {key:'老健',    sub:'介護老人保健施設'},
  {key:'グループホーム', sub:'認知症対応型共同生活'},
  {key:'サ高住',  sub:'サービス付高齢者向け住宅'},
  {key:'介護付有料', sub:'介護付有料老人ホーム'},
  {key:'住宅型有料', sub:'住宅型有料老人ホーム'},
];
const TAGS_FEATURE = [
  '看取り・ターミナルケア','個室あり','入居一時金0円','訪問看護可','日中看護師常駐','作業療法士（OT）',
  'キッチン付き居室','家具付き居室','ナースコールあり','機械浴・特殊浴あり',
  '理美容サービスあり','レクリエーション充実','将棋・囲碁あり','禁煙',
  '駅近・交通アクセス良好','大手が運営','夫婦入居可・2人部屋あり',
  '終身利用可','体験入居可','病院・クリニック併設','24時間看護師常駐',
  '夜間有人','言語聴覚士（ST）','風呂付き居室','介護ベッド付居室',
  'ゲストルームあり','入浴週3回以上','カラオケあり','園芸・庭園あり','アルコール可','外出自由',
  '安い・低価格','ペット・犬・猫可','ショートステイ可','デイサービス併設',
  '24時間介護士常駐','理学療法士（PT）','手厚い人員体制','トイレ付き居室',
  'ネット利用可','口腔ケア・訪問歯科あり','施設内手作りの食事','麻雀あり','喫煙可',
];
const TAGS_MEDICAL = [
  'リハビリ','胃ろう','人工呼吸器','たん吸引','気管切開',
  '褥瘡・床ずれ','脳血管性認知症','パーキンソン病','脳梗塞・クモ膜下出血',
  'リウマチ・関節症','誤嚥性肺炎','介護食','糖尿病・インスリン','ペースメーカー',
  '鼻腔・経管栄養','ストーマ・人工肛門','ALS','心筋梗塞・狭心症','肝炎',
  '統合失調症','流動食・嚥下食','人工透析','中心静脈栄養（IVH）','在宅酸素療法',
  'カテーテル・尿バルーン','アルツハイマー','レビー小体型認知症','がん・末期癌',
  '骨折・骨粗しょう症','喘息・気管支炎','うつ・鬱病',
];

// ─── 状態 ────────────────────────────────────────────
let DATA = [];
let activeVac = 'all';
const selectedTags = new Set();

// ─── サイドバー初期化 ─────────────────────────────────
function initSidebar() {
  // エリアチェックボックス
  document.getElementById('area-list').innerHTML = AREA_ORDER.map(a =>
    `<label class="cb-item">
      <input type="checkbox" name="area" value="${a}" checked onchange="liveFilter()">
      <span class="cb-label">${a}</span>
    </label>`
  ).join('');

  // 種別チェックボックス
  document.getElementById('type-list').innerHTML = TYPES.map(t =>
    `<label class="cb-item">
      <input type="checkbox" name="type" value="${t.key}" checked onchange="liveFilter()">
      <span class="cb-label">${t.key}<span style="font-size:9px;color:var(--g400);margin-left:3px">${t.sub}</span></span>
    </label>`
  ).join('');

  // タグ
  document.getElementById('tag-bar-feature').innerHTML = TAGS_FEATURE.map(t =>
    `<button class="tag-chip" onclick="toggleTag('${t}',this)">${t}</button>`
  ).join('');
  document.getElementById('tag-bar-medical').innerHTML = TAGS_MEDICAL.map(t =>
    `<button class="tag-chip" onclick="toggleTag('${t}',this)">${t}</button>`
  ).join('');

  // 入居条件変更でライブフィルタ
  ['cond-seikatsu','cond-mimon','cond-kaigo'].forEach(id =>
    document.getElementById(id).addEventListener('change', liveFilter)
  );
}

// ─── 検索実行（Firestore取得） ─────────────────────────
async function doSearch() {
  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 検索中';

  const areas = getChecked('area-dp');

  try {
    let query = db.collection('facilities');
    if (areas.length > 0 && areas.length <= 10) {
      query = query.where('area', 'in', areas);
    }
    const snap = await query.get();
    DATA = snap.docs.map(mapDoc);
    DATA.sort((a, b) => a.daysAgo - b.daysAgo);
    liveFilter();
  } catch(e) {
    document.getElementById('main').innerHTML =
      `<div class="state-box"><div class="state-ico">⚠️</div><div class="state-ttl">読み込みエラー</div><div class="state-sub">${e.message}</div></div>`;
  }

  btn.disabled = false;
  btn.textContent = '🔍 検索';
}

// ─── サイドバー操作でリアルタイム絞り込み ────────────────
function liveFilter() {
  if (!DATA.length) return;
  const areas    = getChecked('area');
  const types    = getChecked('type');
  const prefs    = getChecked('pref');
  const seikatsu = document.getElementById('cond-seikatsu').value;
  const mimon    = document.getElementById('cond-mimon').value;
  const kaigo    = document.getElementById('cond-kaigo').value;
  const city     = document.getElementById('q-city').value.trim().toLowerCase();
  const priceMin = parseInt(document.getElementById('q-price-min').value || '0');
  const priceMax = parseInt(document.getElementById('q-price-max').value || '0');

  const list = DATA.filter(f => {
    if (areas.length && !areas.includes(f.area)) return false;
    if (types.length && !types.includes(f.type)) return false;
    if (activeVac === 'ok' && f.total === 0) return false;
    if (selectedTags.size && ![...selectedTags].every(t => f.features.includes(t))) return false;
    if (seikatsu && f.seikatsuHogo !== seikatsu) return false;
    if (mimon    && f.mimonHosho   !== mimon)    return false;
    if (kaigo    && f.kaigoNintei  !== kaigo)    return false;
    if (city && !f.addr.toLowerCase().includes(city)) return false;
    if (prefs.length && !prefs.some(p => f.addr.includes(p))) return false;
    if (priceMin && f.monthlyFee && f.monthlyFee < priceMin) return false;
    if (priceMax && f.monthlyFee && f.monthlyFee > priceMax) return false;
    return true;
  });

  renderCards(list);
}

// ─── データ変換 ──────────────────────────────────────
function mapDoc(doc) {
  const d = doc.data();
  const upd = d.updatedAt ? d.updatedAt.toDate() : new Date();
  const daysAgo = Math.floor((new Date() - upd) / 86400000);
  return {
    id: doc.id,
    name: d.name || '',
    type: d.type || '',
    addr: d.address || '',
    station: [d.station, d.stationDistance].filter(Boolean).join(' '),
    area: d.area || '',
    total: typeof d.vacancy === 'number' ? d.vacancy : 0,
    vacancyNotes: d.vacancyNotes || '',
    features: d.features || [],
    seikatsuHogo: d.seikatsuHogo || '',
    mimonHosho: d.mimonHosho || '',
    kaigoNintei: d.kaigoNintei || '',
    plan: d.plan || 'free',
    monthlyFee: d.monthlyFee || null, // 万円単位
    updated: daysAgo === 0 ? '本日' : daysAgo + '日前',
    daysAgo,
    photoUrl: d.photoUrl || null,
  };
}

// ─── カード描画 ──────────────────────────────────────
function renderCards(list) {
  const main = document.getElementById('main');
  const bar  = document.getElementById('count-bar');
  const okCnt   = list.filter(f => f.total > 0).length;
  const fullCnt = list.filter(f => f.total === 0).length;

  bar.innerHTML = `<span style="font-weight:700;color:var(--ok)">${okCnt}件空きあり</span> / 満室 ${fullCnt}件 / 計 ${list.length}件`;

  if (!list.length) {
    main.innerHTML = '<div class="state-box"><div class="state-ico">🔍</div><div class="state-ttl">条件に合う施設が見つかりません</div><div class="state-sub">絞り込み条件を変えてみてください</div></div>';
    return;
  }

  main.innerHTML = `<div class="cards-grid">${list.map(cardHTML).join('')}</div>`;
}

function condBadge(label, val, okVal) {
  if (!val) return '';
  const cls = val === okVal ? 'cond-ok' : val === '相談可' ? 'cond-sou' : 'cond-ng';
  return `<span class="fc-cond ${cls}">${label}:${val}</span>`;
}

function cardHTML(f) {
  const vacCls = f.total === 0 ? 'full' : f.total <= 2 ? 'few' : 'ok';
  const vacLabel = f.total === 0 ? '満室' : f.total <= 2 ? `残り${f.total}室` : `${f.total}室空き`;
  const staleClass = f.daysAgo > 14 ? 'fc-stale' : '';

  const condBadges = [
    condBadge('生活保護', f.seikatsuHogo, '可'),
    condBadge('身元保証', f.mimonHosho,   '可'),
    condBadge('介護認定', f.kaigoNintei,  'なし'),
  ].filter(Boolean).join('');

  return `<div class="fcard" onclick="location.href='kaigo-facility-view.html?id=${f.id}'">
    <div class="fc-photo">
      ${f.photoUrl ? `<img src="${f.photoUrl}" alt="${f.name}" loading="lazy">` : ''}
      <div class="fc-photo-grad"></div>
      <div class="fc-photo-type">${f.type}</div>
      ${f.plan !== 'free' ? '<div class="fc-photo-plan">✓ 問合せ可</div>' : ''}
      <div class="fc-photo-name">${f.name}</div>
    </div>
    <div class="fc-body">
      <div class="fc-meta">
        <span class="fc-area">📍 ${f.area}エリア</span>
        ${f.station ? `<span class="fc-station">🚉 ${f.station}</span>` : ''}
      </div>
      <div class="fc-vac ${vacCls}">
        <div class="fc-vnum">${f.total === 0 ? '─' : f.total}</div>
        <div class="fc-vinfo">
          <div class="fc-vstatus">${vacLabel}</div>
          ${f.vacancyNotes ? `<div class="fc-vnotes">📝 ${f.vacancyNotes}</div>` : ''}
          <div class="fc-vupdated ${staleClass}">更新：${f.updated}${f.daysAgo > 14 ? ' ⚠️' : ''}</div>
        </div>
      </div>
      ${condBadges ? `<div class="fc-conds">${condBadges}</div>` : ''}
    </div>
  </div>`;
}

// ─── UI ヘルパー ─────────────────────────────────────
function getChecked(name) {
  return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
}

function toggleAll(name, checked) {
  document.querySelectorAll(`input[name="${name}"]`).forEach(cb => cb.checked = checked);
  liveFilter();
}

function setVac(v, btn) {
  activeVac = v;
  document.querySelectorAll('.vac-tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  liveFilter();
}

function toggleTag(tag, btn) {
  if (selectedTags.has(tag)) { selectedTags.delete(tag); btn.classList.remove('on'); }
  else { selectedTags.add(tag); btn.classList.add('on'); }
  liveFilter();
}

function clearTags() {
  selectedTags.clear();
  document.querySelectorAll('.tag-chip').forEach(b => b.classList.remove('on'));
  liveFilter();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}

// ─── ドロップダウン操作 ───────────────────────────────────
const DP_LABEL_MAP = {
  'pref':    ['dl-pref',    '都道府県'],
  'area-dp': ['dl-area-dp', 'エリア'],
};

function toggleDropdown(id) {
  const panel  = document.getElementById('dp-' + id);
  const btn    = document.getElementById('db-' + id);
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.dropdown-panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.dropdown-btn.open').forEach(b => b.classList.remove('open'));
  if (!isOpen) { panel.classList.add('open'); btn.classList.add('open'); }
}

function updateDropdownLabel(name, labelId, placeholder) {
  const checked = Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
  const el = document.getElementById(labelId);
  if (!el) return;
  if (checked.length === 0)      el.textContent = placeholder + 'を選択';
  else if (checked.length === 1) el.textContent = checked[0];
  else el.innerHTML = `${checked[0]} <span class="dropdown-badge">+${checked.length - 1}</span>`;
}

function toggleAllDp(name, checked) {
  document.querySelectorAll(`input[name="${name}"]`).forEach(cb => cb.checked = checked);
  const info = DP_LABEL_MAP[name];
  if (info) updateDropdownLabel(name, info[0], info[1]);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown-wrap')) {
    document.querySelectorAll('.dropdown-panel.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.dropdown-btn.open').forEach(b => b.classList.remove('open'));
  }
});
</script>
