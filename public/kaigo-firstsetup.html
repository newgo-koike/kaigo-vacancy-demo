<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初回セットアップ | 介護施設システム</title>
  <style>
    :root {
      --brand:#0d9488; --brand-d:#0f766e; --brand-l:#f0fdfa;
      --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0;
      --g400:#94a3b8; --g500:#64748b; --g600:#475569;
      --g700:#334155; --g800:#1e293b; --g900:#0f172a;
      --ok:#16a34a; --ok-bg:#dcfce7;
      --err:#ef4444; --err-bg:#fef2f2;
      --warn-bg:#fffbeb; --warn:#d97706;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,'Hiragino Sans',Arial,sans-serif; background:var(--g50); color:var(--g800); min-height:100vh; padding:40px 20px 80px; -webkit-font-smoothing:antialiased; }

    .wrap { max-width:520px; margin:0 auto; }

    .page-hd { text-align:center; margin-bottom:32px; }
    .page-logo { font-size:36px; margin-bottom:12px; }
    .page-ttl { font-size:22px; font-weight:900; color:var(--g900); margin-bottom:4px; }
    .page-sub { font-size:13px; color:var(--g500); }

    .warn-box { background:var(--warn-bg); border:1px solid #fde68a; border-radius:12px; padding:14px 16px; margin-bottom:24px; font-size:13px; color:var(--warn); line-height:1.7; }
    .warn-box strong { font-weight:700; }

    .step-card { background:white; border-radius:16px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.08); border:1px solid var(--g200); margin-bottom:16px; }
    .step-num { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:var(--brand); color:white; border-radius:50%; font-size:12px; font-weight:800; margin-right:8px; flex-shrink:0; }
    .step-ttl { font-size:15px; font-weight:700; color:var(--g800); display:flex; align-items:center; margin-bottom:16px; }
    .step-done { background:var(--ok-bg); color:var(--ok); }

    .f-grp { margin-bottom:14px; }
    .f-grp:last-child { margin-bottom:0; }
    .f-lbl { display:block; font-size:12px; font-weight:600; color:var(--g600); margin-bottom:5px; }
    .f-inp { width:100%; padding:10px 13px; border:1.5px solid var(--g200); border-radius:9px; font-size:14px; outline:none; font-family:inherit; color:var(--g800); transition:border-color .15s; }
    .f-inp:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(13,148,136,.1); }
    .f-sel { width:100%; padding:10px 13px; border:1.5px solid var(--g200); border-radius:9px; font-size:14px; outline:none; font-family:inherit; color:var(--g800); background:white; transition:border-color .15s; }
    .f-sel:focus { border-color:var(--brand); }
    .f-hint { font-size:11px; color:var(--g400); margin-top:3px; }

    .role-info { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
    .role-chip { background:var(--g50); border:1px solid var(--g200); border-radius:8px; padding:10px; font-size:11px; }
    .role-chip-name { font-weight:700; color:var(--g700); margin-bottom:3px; }
    .role-chip-desc { color:var(--g500); line-height:1.4; }

    .btn { width:100%; padding:13px; background:var(--brand); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; box-shadow:0 4px 14px rgba(13,148,136,.25); }
    .btn:hover:not(:disabled) { background:var(--brand-d); }
    .btn:disabled { background:var(--g400); cursor:not-allowed; box-shadow:none; }
    .btn-secondary { background:var(--g800); box-shadow:none; margin-top:8px; }
    .btn-secondary:hover:not(:disabled) { background:var(--g900); }

    .err-msg { display:none; background:var(--err-bg); border:1px solid #fecaca; border-radius:9px; padding:10px 14px; font-size:13px; color:var(--err); margin-bottom:14px; }
    .err-msg.show { display:block; }

    .ok-msg { display:none; background:var(--ok-bg); border:1px solid #bbf7d0; border-radius:9px; padding:12px 14px; font-size:13px; color:var(--ok); margin-bottom:14px; }
    .ok-msg.show { display:block; }

    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .users-list { margin-top:12px; }
    .user-row { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--g50); border-radius:8px; border:1px solid var(--g100); margin-bottom:6px; font-size:13px; }
    .user-role { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
    .role-admin { background:#fef2f2; color:#ef4444; }
    .role-hospital { background:var(--brand-l); color:var(--brand); }
    .role-facility { background:#f0f9ff; color:#0369a1; }
    .user-email { color:var(--g500); font-size:12px; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="page-hd">
    <div class="page-logo">⚙️</div>
    <div class="page-ttl">初回セットアップ</div>
    <div class="page-sub">ユーザーアカウントの作成と権限設定</div>
  </div>

  <div class="warn-box">
    ⚠️ <strong>このページは管理者専用です。</strong> セットアップ完了後はURLを共有しないでください。<br>
    事前に Firebase Console で「メール/パスワード認証」を有効化してください。
  </div>

  <!-- 新規ユーザー作成 -->
  <div class="step-card">
    <div class="step-ttl"><span class="step-num">1</span>新規ユーザーを追加</div>

    <div class="err-msg" id="createErr"></div>
    <div class="ok-msg" id="createOk"></div>

    <div class="f-grp">
      <label class="f-lbl">名前</label>
      <input class="f-inp" id="c-name" type="text" placeholder="例：小池雄悟">
    </div>
    <div class="f-grp">
      <label class="f-lbl">メールアドレス</label>
      <input class="f-inp" id="c-email" type="email" placeholder="example@hospital.jp">
    </div>
    <div class="f-grp">
      <label class="f-lbl">パスワード（8文字以上）</label>
      <input class="f-inp" id="c-pass" type="password" placeholder="••••••••">
    </div>
    <div class="f-grp">
      <label class="f-lbl">権限（ロール）</label>
      <select class="f-sel" id="c-role">
        <option value="admin">admin（管理者）- マスター管理・全機能</option>
        <option value="hospital">hospital（病院・ケアマネ）- 検索のみ</option>
        <option value="facility">facility（介護施設）- 自施設の空室更新のみ</option>
      </select>
      <div class="role-info">
        <div class="role-chip"><div class="role-chip-name">admin</div><div class="role-chip-desc">全ページ閲覧・操作可</div></div>
        <div class="role-chip"><div class="role-chip-name">hospital</div><div class="role-chip-desc">施設検索ページのみ</div></div>
        <div class="role-chip"><div class="role-chip-name">facility</div><div class="role-chip-desc">自施設の空室更新のみ</div></div>
      </div>
    </div>
    <div class="f-grp" id="facilityIdWrap" style="display:none">
      <label class="f-lbl">施設ID（facility選択時のみ）</label>
      <input class="f-inp" id="c-facilityId" type="text" placeholder="例：ab3k7mn">
      <div class="f-hint">マスター管理ページのURLに含まれるIDです</div>
    </div>

    <button class="btn" id="createBtn" onclick="createUser()">アカウントを作成する</button>
  </div>

  <!-- 登録済みユーザー一覧 -->
  <div class="step-card">
    <div class="step-ttl"><span class="step-num">2</span>登録済みユーザー一覧</div>
    <div class="users-list" id="usersList">
      <div style="font-size:13px;color:var(--g400)">読み込み中...</div>
    </div>
    <button class="btn btn-secondary" onclick="loadUsers()" style="margin-top:12px">↻ 更新</button>
  </div>

  <div style="text-align:center;margin-top:24px">
    <a href="kaigo-login.html" style="font-size:13px;color:var(--brand)">→ ログイン画面へ</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const auth = firebase.auth();
const db = firebase.firestore();

// facility選択時だけ施設IDフィールドを表示
document.getElementById('c-role').addEventListener('change', e => {
  document.getElementById('facilityIdWrap').style.display = e.target.value === 'facility' ? 'block' : 'none';
});

async function createUser() {
  const name       = document.getElementById('c-name').value.trim();
  const email      = document.getElementById('c-email').value.trim();
  const pass       = document.getElementById('c-pass').value;
  const role       = document.getElementById('c-role').value;
  const facilityId = document.getElementById('c-facilityId').value.trim();
  const errEl      = document.getElementById('createErr');
  const okEl       = document.getElementById('createOk');
  const btn        = document.getElementById('createBtn');

  errEl.classList.remove('show');
  okEl.classList.remove('show');

  if (!name || !email || !pass) {
    errEl.textContent = '名前・メールアドレス・パスワードはすべて入力してください';
    errEl.classList.add('show');
    return;
  }
  if (pass.length < 8) {
    errEl.textContent = 'パスワードは8文字以上で設定してください';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>作成中...';

  try {
    // 現在のログイン状態を退避（セカンダリアプリで作成するため）
    const secondaryApp = firebase.app().name === '[DEFAULT]'
      ? firebase.initializeApp(firebase.app().options, 'secondary')
      : firebase.app('secondary');
    const secondaryAuth = secondaryApp.auth();

    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;

    const userData = { name, email, role, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (role === 'facility' && facilityId) userData.facilityId = facilityId;

    await db.collection('users').doc(uid).set(userData);

    await secondaryAuth.signOut();

    okEl.textContent = `✅ ${name}（${role}）のアカウントを作成しました`;
    okEl.classList.add('show');
    document.getElementById('c-name').value = '';
    document.getElementById('c-email').value = '';
    document.getElementById('c-pass').value = '';
    document.getElementById('c-facilityId').value = '';

    loadUsers();
  } catch(e) {
    errEl.textContent = setupErrMsg(e.code);
    errEl.classList.add('show');
  }

  btn.disabled = false;
  btn.innerHTML = 'アカウントを作成する';
}

async function loadUsers() {
  const el = document.getElementById('usersList');
  el.innerHTML = '<div style="font-size:13px;color:var(--g400)">読み込み中...</div>';
  try {
    const snap = await db.collection('users').orderBy('createdAt','desc').get();
    if (snap.empty) {
      el.innerHTML = '<div style="font-size:13px;color:var(--g400)">まだユーザーが登録されていません</div>';
      return;
    }
    el.innerHTML = snap.docs.map(doc => {
      const d = doc.data();
      const roleClass = `role-${d.role}`;
      return `<div class="user-row">
        <span class="user-role ${roleClass}">${d.role}</span>
        <span style="font-weight:600">${d.name || '名前未設定'}</span>
        <span class="user-email">${d.email || ''}</span>
        ${d.facilityId ? `<span style="font-size:11px;color:var(--g400)">施設ID: ${d.facilityId}</span>` : ''}
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div style="font-size:13px;color:var(--err)">⚠️ 読み込みエラー: ${e.message}</div>`;
  }
}

function setupErrMsg(code) {
  if (code === 'auth/email-already-in-use') return 'このメールアドレスはすでに登録されています';
  if (code === 'auth/invalid-email') return 'メールアドレスの形式が正しくありません';
  if (code === 'auth/weak-password') return 'パスワードは8文字以上にしてください';
  return 'エラーが発生しました: ' + code;
}

// 初期ロード
loadUsers();
</script>
</body>
</html>
