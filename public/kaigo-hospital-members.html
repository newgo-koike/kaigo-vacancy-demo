<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>担当者管理 | 介護施設空室検索システム</title>
<style>
  :root{--ink:#2b2b2b;--paper:#fdfdfb;--hair:#e7e7e3;--pink:#e88494;--pink-d:#e0707f;
        --blue:#5fb0de;--blue-d:#2c7ba6;--blue-l:#e4f2fa;--g400:#94a3b8;--g500:#64748b;--g700:#334155;
        --ok:#2c7ba6;--ok-bg:#e4f2fa;--err:#ef4444;--err-bg:#fef2f2;--warn:#d97706;--warn-bg:#fffbeb;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Hiragino Sans',Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:32px 18px 80px;-webkit-font-smoothing:antialiased;visibility:hidden;}
  .wrap{max-width:560px;margin:0 auto;}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .hd .box{width:36px;height:36px;background:white;border:2px solid var(--ink);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .hd .ttl{font-size:18px;font-weight:900;}
  .sub{font-size:13px;color:var(--g500);margin:2px 0 22px 46px;}
  .card{background:white;border:2px solid var(--ink);border-radius:16px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:14px;font-weight:800;margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;margin-bottom:8px;font-size:14px;}
  .row .id{font-family:ui-monospace,monospace;font-weight:700;color:var(--blue-d);background:var(--blue-l);padding:2px 8px;border-radius:6px;font-size:13px;}
  .row .nm{font-weight:600;}
  .row .tag{font-size:10px;color:var(--g400);border:1px solid var(--hair);border-radius:100px;padding:1px 7px;}
  .row .mini{margin-left:auto;font-size:11px;font-family:inherit;color:var(--blue-d);background:none;border:1px solid var(--hair);border-radius:100px;padding:3px 10px;cursor:pointer;white-space:nowrap;}
  .row .mini:hover{border-color:var(--blue);background:var(--blue-l);}
  .f-lbl{display:block;font-size:12px;font-weight:600;color:var(--g700);margin-bottom:6px;}
  .f-inp{width:100%;padding:11px 14px;border:2px solid var(--hair);border-radius:100px;font-size:15px;outline:none;font-family:inherit;color:var(--ink);transition:border-color .15s;}
  .f-inp:focus{border-color:var(--blue);}
  .btn{width:100%;margin-top:12px;padding:13px;background:var(--pink);color:white;border:2px solid var(--ink);border-radius:100px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:background .15s;}
  .btn:hover:not(:disabled){background:var(--pink-d);}
  .btn:disabled{background:var(--g400);border-color:var(--g400);cursor:not-allowed;}
  .msg{display:none;border-radius:10px;padding:12px 14px;font-size:13px;margin-top:14px;line-height:1.7;}
  .msg.show{display:block;}
  .msg.err{background:var(--err-bg);border:1px solid #fecaca;color:var(--err);}
  .msg.ok{background:var(--ok-bg);border:1px solid #d3ebf7;color:var(--ok);}
  .msg .cred{font-family:ui-monospace,monospace;font-weight:700;font-size:15px;color:var(--ink);}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .foot{text-align:center;margin-top:8px;}
  .foot a{font-size:13px;color:var(--blue);}
  .note{font-size:12px;color:var(--g500);line-height:1.7;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="box">👥</div>
    <div class="ttl">担当者管理</div>
  </div>
  <div class="sub" id="hosp">読み込み中...</div>

  <div class="card">
    <h2>登録済みの担当者</h2>
    <div id="list"><div class="note">読み込み中...</div></div>
  </div>

  <div class="card">
    <h2>担当者を追加</h2>
    <label class="f-lbl">お名前</label>
    <input class="f-inp" id="nm" type="text" placeholder="例：田中 太郎" autocomplete="off">
    <button class="btn" id="addBtn" onclick="addMember()">この担当者を追加する</button>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
    <p class="note" id="preview"></p>
  </div>

  <div class="card">
    <h2>自分のパスワードを変更</h2>
    <label class="f-lbl">現在のパスワード</label>
    <input class="f-inp" id="cur-pw" type="password" autocomplete="current-password" placeholder="現在のパスワード">
    <label class="f-lbl" style="margin-top:12px;">新しいパスワード（6文字以上）</label>
    <input class="f-inp" id="new-pw" type="password" autocomplete="new-password" placeholder="新しいパスワード">
    <label class="f-lbl" style="margin-top:12px;">新しいパスワード（確認）</label>
    <input class="f-inp" id="new-pw2" type="password" autocomplete="new-password" placeholder="もう一度入力">
    <button class="btn" id="pwBtn" onclick="changeMyPassword()">パスワードを変更する</button>
    <div class="msg err" id="pw-err"></div>
    <div class="msg ok" id="pw-ok"></div>
    <p class="note">変更後は、次回ログインから新しいパスワードを使ってください。ログインIDは変わりません。</p>
  </div>

  <div class="foot"><a href="kaigo-search.html">← 検索画面へ戻る</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const FIRE={apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",projectId:"kaigo-link-dev-59bc5",storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",messagingSenderId:"646624290677",appId:"1:646624290677:web:0cee80cbdd07dc8753553c"};
firebase.initializeApp(FIRE);
const auth=firebase.auth();
const db=firebase.firestore();
const DOMAIN="meets-medical.jp";
const $=id=>document.getElementById(id);

let myHospitalId=null, myHospitalName=null, myUid=null, members=[];

auth.onAuthStateChanged(async user=>{
  if(!user){ location.href='kaigo-login.html'; return; }
  let snap;
  try{ snap=await db.collection('users').doc(user.uid).get(); }catch(e){ document.body.style.visibility='visible'; $('hosp').textContent='情報の取得に失敗しました'; return; }
  const d=snap.data()||{};
  document.body.style.visibility='visible';
  if(d.role!=='hospital'){
    $('hosp').innerHTML='この画面は病院アカウント専用です。（現在: '+(d.role||'不明')+'）';
    $('addBtn').disabled=true; return;
  }
  myHospitalId=d.hospitalId; myHospitalName=d.hospitalName||d.name||'';
  myUid=user.uid;
  if(!myHospitalId){ $('hosp').textContent='病院情報が未設定です。管理者に連絡してください。'; $('addBtn').disabled=true; return; }
  $('hosp').innerHTML='<b>'+myHospitalName+'</b>（病院コード '+myHospitalId+'）';
  await loadMembers();
});

// name は担当者名。一括発行したアカウントは病院名が入っているので、担当者名として扱わない。
const personName = m => (m.name && m.name !== (m.hospitalName||'')) ? m.name : '';

async function loadMembers(){
  const snap=await db.collection('users').where('hospitalId','==',myHospitalId).get();
  members=snap.docs.map(x=>({...x.data(), uid:x.id})).filter(m=>m.role==='hospital');
  members.sort((a,b)=>seqOf(a.loginId)-seqOf(b.loginId));
  $('list').innerHTML = members.length ? members.map(m=>{
    const nm=personName(m);
    return `<div class="row">
      <span class="id">${m.loginId||'-'}</span>
      <span class="nm"${nm?'':' style="color:#d97706"'}>${nm||'担当者名 未設定'}</span>
      ${m.uid===myUid ? '<span class="tag">あなた</span>' : ''}
      <button class="mini" onclick="renameMember('${m.uid}')">${nm?'名前を変更':'名前を入力'}</button>
    </div>`;
  }).join('') : '<div class="note">まだ担当者がいません</div>';
  updatePreview();
}

async function renameMember(uid){
  const cur=personName(members.find(m=>m.uid===uid)||{});
  const name=prompt('担当者名（お名前）を入力してください', cur);
  if(name===null) return;
  try{
    await db.collection('users').doc(uid).set({name:name.trim()},{merge:true});
    await loadMembers();
  }catch(e){ alert('保存に失敗しました: '+(e.code||e.message)); }
}

function seqOf(loginId){ const p=(loginId||'').split('-'); return p.length>1 ? parseInt(p[1],10)||0 : 0; }
function nextLoginId(){
  const max=members.reduce((m,x)=>Math.max(m,seqOf(x.loginId)),0);
  return myHospitalId+'-'+String(max+1).padStart(2,'0');
}
function updatePreview(){
  if(!myHospitalId) return;
  const nid=nextLoginId();
  $('preview').innerHTML='次に発行されるID: <b>'+nid+'</b>（パスワードも同じ '+nid+'）';
}

async function addMember(){
  const name=$('nm').value.trim();
  const btn=$('addBtn');
  $('err').classList.remove('show'); $('ok').classList.remove('show');
  if(!name){ $('err').textContent='お名前を入力してください'; $('err').classList.add('show'); return; }
  if(!myHospitalId) return;

  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>作成中...';
  const newLogin=nextLoginId();
  const newEmail=newLogin+'@'+DOMAIN;
  const newPass=newLogin;

  try{
    const secApp = firebase.apps.some(a=>a.name==='secondary') ? firebase.app('secondary') : firebase.initializeApp(FIRE,'secondary');
    const secAuth=secApp.auth();
    const cred=await secAuth.createUserWithEmailAndPassword(newEmail,newPass);
    const uid=cred.user.uid;
    await db.collection('users').doc(uid).set({
      role:'hospital', name, hospitalId:myHospitalId, hospitalName:myHospitalName,
      loginId:newLogin, email:newEmail, createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await secAuth.signOut();
    $('ok').innerHTML='✅ '+name+' さんを追加しました。<br>ログインID: <span class="cred">'+newLogin+'</span> ／ パスワード: <span class="cred">'+newLogin+'</span><br>この情報をご本人にお伝えください。';
    $('ok').classList.add('show');
    $('nm').value='';
    await loadMembers();
  }catch(e){
    $('err').textContent='追加に失敗しました: '+(e.code||e.message);
    $('err').classList.add('show');
  }
  btn.disabled=false; btn.innerHTML='この担当者を追加する';
}

$('nm').addEventListener('keydown',e=>{ if(e.key==='Enter') addMember(); });

// ── 自分のパスワード変更 ───────────────────────────────────────
function pwErr(m){ $('pw-err').textContent=m; $('pw-err').classList.add('show'); }
async function changeMyPassword(){
  const cur=$('cur-pw').value, np=$('new-pw').value, np2=$('new-pw2').value;
  const btn=$('pwBtn');
  $('pw-err').classList.remove('show'); $('pw-ok').classList.remove('show');
  if(!cur||!np){ pwErr('現在のパスワードと新しいパスワードを入力してください'); return; }
  if(np.length<6){ pwErr('新しいパスワードは6文字以上にしてください'); return; }
  if(np!==np2){ pwErr('新しいパスワード（確認）が一致しません'); return; }
  const user=auth.currentUser;
  if(!user){ pwErr('ログイン情報が取得できません。お手数ですが再度ログインしてください'); return; }

  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>変更中...';
  try{
    // ログイン時と同様、数字のみ6文字未満の現在パスワードは先頭ゼロ埋め
    let curPw=cur; if(/^\d+$/.test(curPw)&&curPw.length<6) curPw=curPw.padStart(6,'0');
    const cred=firebase.auth.EmailAuthProvider.credential(user.email, curPw);
    await user.reauthenticateWithCredential(cred);   // 本人確認（現在PWの照合）
    await user.updatePassword(np);
    $('pw-ok').textContent='✅ パスワードを変更しました。次回から新しいパスワードでログインしてください。';
    $('pw-ok').classList.add('show');
    $('cur-pw').value=''; $('new-pw').value=''; $('new-pw2').value='';
  }catch(e){
    let m='変更に失敗しました';
    if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') m='現在のパスワードが正しくありません';
    else if(e.code==='auth/weak-password') m='新しいパスワードは6文字以上にしてください';
    else if(e.code==='auth/too-many-requests') m='試行回数が多すぎます。しばらくしてから再度お試しください';
    else if(e.code==='auth/requires-recent-login') m='安全のため、一度ログアウトして再ログイン後にお試しください';
    else if(e.code) m='変更に失敗しました（'+e.code+'）';
    pwErr(m);
  }
  btn.disabled=false; btn.innerHTML='パスワードを変更する';
}
$('new-pw2').addEventListener('keydown',e=>{ if(e.key==='Enter') changeMyPassword(); });
</script>
</body>
</html>
