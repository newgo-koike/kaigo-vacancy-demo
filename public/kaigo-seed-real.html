    .stat-lbl{font-size:11px;color:var(--g500);}

    .btn-danger{background:#ef4444;color:white;}

    .btn-safe{background:var(--brand);color:white;margin-top:10px;}
    .btn-safe:hover:not(:disabled){background:var(--brand-d);}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .progress-wrap{display:none;margin-top:20px;}
    .progress-bar-bg{background:var(--g200);border-radius:99px;height:12px;overflow:hidden;margin-bottom:8px;}
    .progress-bar{height:100%;background:var(--brand);border-radius:99px;transition:width .3s;width:0%;}
    .progress-txt{font-size:13px;color:var(--g600);text-align:center;}
    .log{background:var(--g900);border-radius:10px;padding:14px;height:200px;overflow-y:auto;margin-top:14px;font-family:monospace;font-size:11px;}
    .log-line{color:#7ec4e8;line-height:1.7;}
    .log-err{color:#f87171;}
    .done-box{display:none;background:var(--ok-bg);border:1px solid #bfe0f2;border-radius:10px;padding:16px;text-align:center;margin-top:16px;}
    .done-ttl{font-size:16px;font-weight:800;color:var(--ok);margin-bottom:6px;}
    .done-link{display:inline-block;margin-top:10px;padding:10px 24px;background:var(--brand);color:white;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;}

const SAFE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
function genId(len=7){
  return Array.from({length:len},()=>SAFE_CHARS[Math.floor(Math.random()*SAFE_CHARS.length)]).join('');
}
async function uniqueId(){
  for(let i=0;i<5;i++){
    const id=genId();
    const doc=await db.collection('facilities').doc(id).get();
    if(!doc.exists) return id;
  }
  return genId(10);
}

function log(msg, isErr=false){
  const el=document.getElementById('log');
  const div=document.createElement('div');
  div.className=isErr?'log-line log-err':'log-line';
  div.textContent=msg;
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

function setProgress(done, total){
  const pct=Math.round(done/total*100);
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('progress-txt').textContent=`${done} / ${total} 件完了（${pct}%）`;
}

async function startSeed(){
  const btn=document.getElementById('start-btn');
  btn.disabled=true;
  document.getElementById('progress-wrap').style.display='block';

  // Step1: 既存データを全削除
  log('🗑 既存データを削除中...');
  try{
    const snap=await db.collection('facilities').get();
    const batch=db.batch();
    snap.docs.forEach(doc=>batch.delete(doc.ref));
    await batch.commit();
    log(`✓ ${snap.size} 件削除完了`);
  } catch(e){
    log('削除エラー: '+e.message, true);
    return;
  }

  // Step2: 実データを投入
  log('📥 実データを投入中...');
  let ok=0, ng=0;
  const total=FACILITIES.length;

  for(const f of FACILITIES){
    try{
      const id=await uniqueId();
      await db.collection('facilities').doc(id).set({
        name:         f.name||'',
        type:         f.type||'',
        area:         f.area||'',
        address:      f.address||'',
        station:      f.station||'',
        stationDistance: f.stationDistance||'',
        parking:      f.parking||'',
        contactName:  f.contactName||'',
        contactTel:   f.contactTel||'',
        seikatsuHogo: f.seikatsuHogo||'',
        mimonHosho:   f.mimonHosho||'',
        kaigoNintei:  f.kaigoNintei||'',
        features:     f.features||[],
        vacancy:      f.vacancy||0,
        vacancyNotes: f.vacancyNotes||'',
        campaign:     f.campaign||'',
        plan:         'free',
        photoUrl:     null,
        createdAt:    firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt:    firebase.firestore.FieldValue.serverTimestamp(),
      });
      ok++;
      log(`✓ ${ok}. ${f.name} [${f.type}/${f.area}]`);
      setProgress(ok+ng, total);
    } catch(e){
      ng++;
      log(`✗ ${f.name}: ${e.message}`, true);
    }
    // Firestoreのレート制限を避けるため少し待つ
    if(ok%10===0) await new Promise(r=>setTimeout(r,200));
  }

  // 完了
  document.getElementById('done-box').style.display='block';
  document.getElementById('done-msg').textContent=`${ok} 件投入成功 / ${ng} 件エラー`;
  log(`🎉 完了: ${ok} 件成功 / ${ng} 件エラー`);
}
