<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空室情報更新</title>
  <style>
    :root {
      --brand:#5fb0de; --brand-d:#2c7ba6;
      --brand-l:#e4f2fa;
      --ok:#2c7ba6; --ok-bg:#e4f2fa;
      --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0;
      --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155;
      --g800:#1e293b; --g900:#0f172a;
      --r:12px; --r-lg:16px;
      --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
      --sh-md:0 4px 12px rgba(0,0,0,.08);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { min-height:100%; }
    body { font-family:-apple-system,'Hiragino Sans',Arial,sans-serif; background:#fdfdfb; color:var(--g800); line-height:1.5; -webkit-font-smoothing:antialiased; visibility:hidden; }

    .hdr { background:#fdfdfb; border-bottom:1px solid #e7e7e3; padding:16px 20px; display:flex; align-items:center; gap:10px; }
    .hdr-logo { width:30px; height:30px; background:#fff; border:2px solid #2b2b2b; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
    .hdr-title { font-size:14px; font-weight:800; color:#2b2b2b; }
    .hdr-sub { font-size:10px; color:var(--g400); }

    .page { max-width:620px; margin:0 auto; padding:24px 16px 60px; }

    .s-card { background:white; border-radius:var(--r-lg); padding:20px 20px; box-shadow:none; margin-bottom:14px; border:2px solid #2b2b2b; }
    .sc-ttl { font-size:14px; font-weight:700; color:var(--g700); margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--g100); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sc-badge { font-size:10px; padding:2px 8px; border-radius:100px; font-weight:700; }
    .sc-fixed { background:var(--g100); color:var(--g500); }
    .sc-var { background:var(--ok-bg); color:var(--ok); }

    /* 基本情報グリッド */
    .fixed-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fixed-item { background:#fbfbf9; border-radius:12px; padding:9px 12px; border:1px solid #e7e7e3; }
    .fi-label { font-size:10px; color:var(--g400); font-weight:600; margin-bottom:2px; }
    .fi-value { font-size:13px; font-weight:600; color:var(--g700); }

    /* 空室入力 */
    .v-grid { display:grid; grid-template-columns:140px 1fr; gap:16px; margin-bottom:14px; align-items:start; }
    .v-grp { text-align:center; }
    .v-lbl { font-size:11px; color:var(--g500); display:block; margin-bottom:6px; font-weight:600; }
    .v-inp { width:100%; padding:10px 8px; border:2px solid #e7e7e3; border-radius:14px; font-size:36px; font-weight:900; text-align:center; outline:none; color:var(--brand-d); font-family:inherit; transition:border-color .15s; }
    .v-inp:focus { border-color:var(--brand); }
    .v-cap { font-size:10px; color:var(--g400); margin-top:4px; }

    /* フォーム */
    .f-grp { margin-bottom:12px; }
    .f-grp:last-child { margin-bottom:0; }
    .f-lbl { display:block; font-size:12px; font-weight:600; color:var(--g600); margin-bottom:5px; }
    .f-inp,.f-ta { width:100%; padding:10px 12px; border:2px solid #e7e7e3; border-radius:12px; font-size:14px; outline:none; font-family:inherit; color:var(--g800); transition:border-color .15s,box-shadow .15s; background:white; }
    .f-inp:focus,.f-ta:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(95,176,222,.1); }
    .f-ta { resize:vertical; min-height:72px; }

    /* ボタン */
    .upd-btn { width:100%; padding:14px; background:#e88494; color:white; border:2px solid #2b2b2b; border-radius:100px; font-size:16px; font-weight:900; cursor:pointer; font-family:inherit; transition:background .15s,transform .12s; box-shadow:none; }
    .upd-btn:hover:not(:disabled) { background:#e0707f; transform:translateY(-1px); }
    .upd-btn:disabled { background:var(--g400); cursor:not-allowed; transform:none; box-shadow:none; }

    /* 写真 */
    .photo-current { width:100%; height:200px; object-fit:cover; border-radius:10px; display:block; margin-bottom:12px; border:1px solid var(--g200); }
    .photo-placeholder { width:100%; height:160px; background:var(--g100); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; border:2px dashed var(--g300); }
    .photo-placeholder-ico { font-size:36px; opacity:.5; }
    .photo-placeholder-txt { font-size:12px; color:var(--g400); }
    .photo-change-btn { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:#fff; color:#2b2b2b; border:2px solid #2b2b2b; border-radius:100px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
    .photo-change-btn:hover { background:#f1f1ee; }
    .photo-new-section { margin-top:12px; padding:14px; background:var(--g50); border-radius:10px; border:1px solid var(--g200); }
    .photo-preview-img { width:100%; max-height:180px; object-fit:cover; border-radius:8px; margin-bottom:10px; display:block; }
    .photo-action-row { display:flex; gap:8px; }
    .photo-upload-btn { flex:1; padding:10px; background:#e88494; color:white; border:2px solid #2b2b2b; border-radius:100px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; }
    .photo-upload-btn:hover:not(:disabled) { background:#e0707f; }
    .photo-upload-btn:disabled { background:var(--g400); cursor:not-allowed; }
    .photo-cancel-btn { padding:10px 16px; background:white; color:var(--g600); border:2px solid #e7e7e3; border-radius:100px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }

    /* URL row */
    .url-row { display:flex; gap:8px; }
    .url-inp { flex:1; font-size:12px; padding:9px 12px; border:2px solid #e7e7e3; border-radius:100px; color:var(--g600); background:var(--g50); font-family:inherit; outline:none; }
    .url-copy { padding:9px 14px; background:var(--g800); color:white; border:none; border-radius:100px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .15s; }
    .url-copy:hover { background:var(--g900); }

    /* QR */
    .qr-wrap { margin-top:12px; display:flex; align-items:flex-start; gap:12px; }
    .qr-box { width:110px; height:110px; flex-shrink:0; background:white; padding:4px; border:1px solid var(--g200); border-radius:8px; }
    .qr-desc { font-size:11px; color:var(--g500); line-height:1.6; }

    /* 施設バー */
    .fac-bar { background:white; border-radius:var(--r-lg); padding:14px 18px; margin-bottom:16px; box-shadow:none; border:2px solid #2b2b2b; display:flex; align-items:center; gap:12px; }
    .fac-av { width:42px; height:42px; border-radius:10px; background:var(--brand); color:white; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; flex-shrink:0; }
    .fac-nm { font-size:15px; font-weight:700; }
    .fac-rl { font-size:11px; color:var(--g400); margin-top:1px; }

    /* エラー */
    .err-page { max-width:480px; margin:80px auto; padding:0 20px; text-align:center; }
    .err-ico { font-size:48px; margin-bottom:16px; }
    .err-ttl { font-size:18px; font-weight:700; color:var(--g800); margin-bottom:8px; }
    .err-msg { font-size:13px; color:var(--g500); line-height:1.7; }

    .toast { position:fixed; bottom:24px; right:24px; left:24px; max-width:400px; margin:0 auto; background:var(--g900); color:white; padding:12px 18px; border-radius:11px; font-size:14px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.25); opacity:0; transform:translateY(12px); transition:all .22s; z-index:999; pointer-events:none; }
    .toast.on { opacity:1; transform:translateY(0); }

    @media(max-width:480px) {
      .fixed-grid { grid-template-columns:1fr; }
      .v-grid { grid-template-columns:1fr; }
      .photo-action-row { flex-direction:column; }
    }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">🏠</div>
  <div>
    <div class="hdr-title">施設 空室情報更新</div>
    <div class="hdr-sub">施設担当者専用ページ</div>
  </div>
  <div style="margin-left:auto">
    <button onclick="firebase.auth().signOut().then(()=>location.href='kaigo-login.html')"
      style="background:#fff;border:2px solid #e7e7e3;color:#5f5f5a;font-size:12px;padding:5px 14px;border-radius:100px;cursor:pointer;font-family:inherit">ログアウト</button>
  </div>
</header>

<div id="main" class="page">
  <div style="text-align:center;padding:80px 0;color:var(--g400);">読み込み中...</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA2qWLQ8Zsn_5CQTOljPkpZxRsVfnIcoJ8",
  authDomain:"kaigo-link-dev-59bc5.firebaseapp.com",
  projectId:"kaigo-link-dev-59bc5",
  storageBucket:"kaigo-link-dev-59bc5.firebasestorage.app",
  messagingSenderId:"646624290677",
  appId:"1:646624290677:web:0cee80cbdd07dc8753553c"
});
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

const params = new URLSearchParams(location.search);
const facilityId = params.get('id');
const main = document.getElementById('main');

let currentPhotoUrl = null;
let pendingPhotoFile = null;
let currentDocData = null;

auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'kaigo-login.html'; return; }
  const uSnap = await db.collection('users').doc(user.uid).get();
  const role = uSnap.data()?.role;
  if (!['facility', 'admin'].includes(role)) {
    await auth.signOut();
    location.href = 'kaigo-login.html';
    return;
  }
  document.body.style.visibility = 'visible';
  if (!facilityId) {
    showError();
  } else {
    loadFacility(facilityId);
  }
});

function showError() {
  main.innerHTML = `
    <div class="err-page">
      <div class="err-ico">🔗</div>
      <div class="err-ttl">URLが正しくありません</div>
      <div class="err-msg">このページは施設担当者専用です。<br>Meets Medicalよりお送りしたURLからアクセスしてください。<br><br>お問い合わせ：<strong>Meets Medical</strong></div>
    </div>`;
}

async function loadFacility(id) {
  try {
    const doc = await db.collection('facilities').doc(id).get();
    if (!doc.exists) {
      main.innerHTML = `<div class="err-page"><div class="err-ico">🏥</div><div class="err-ttl">施設が見つかりませんでした</div><div class="err-msg">URLをご確認いただくか、Meets Medicalまでお問い合わせください。</div></div>`;
      return;
    }
    currentDocData = doc.data();
    currentPhotoUrl = currentDocData.photoUrl || null;
    renderPage(doc);
  } catch(e) {
    main.innerHTML = `<div class="err-page"><div class="err-ico">⚠️</div><div class="err-ttl">読み込みエラー</div><div class="err-msg">${e.message}<br>ページを再読み込みしてください。</div></div>`;
  }
}

function renderPage(doc) {
  const d = doc.data();
  const v = typeof d.vacancy === 'number' ? d.vacancy : 0;
  const ini = (d.name || '?').charAt(0);
  const publicUrl = location.origin + '/kaigo-facility-view.html?id=' + doc.id;

  main.innerHTML = `
    <div class="fac-bar">
      <div class="fac-av">${ini}</div>
      <div>
        <div class="fac-nm">${d.name || '施設名未設定'}</div>
        <div class="fac-rl">${d.type || ''}　施設担当者</div>
      </div>
    </div>

    <div class="s-card">
      <div class="sc-ttl">📌 施設基本情報 <span class="sc-badge sc-fixed">固定情報</span></div>
      <div class="fixed-grid">
        <div class="fixed-item"><div class="fi-label">施設種別</div><div class="fi-value">${d.type || '─'}</div></div>
        <div class="fixed-item"><div class="fi-label">エリア</div><div class="fi-value">${d.area || '─'}</div></div>
        <div class="fixed-item"><div class="fi-label">住所</div><div class="fi-value">${d.address || '─'}</div></div>
        <div class="fixed-item"><div class="fi-label">最寄り駅</div><div class="fi-value">${[d.station, d.stationDistance].filter(Boolean).join(' ') || '─'}</div></div>
        ${d.parking ? `<div class="fixed-item"><div class="fi-label">駐車場</div><div class="fi-value">${d.parking}</div></div>` : ''}
        <div class="fixed-item"><div class="fi-label">担当者</div><div class="fi-value">${d.contactName || '─'}</div></div>
        <div class="fixed-item"><div class="fi-label">電話番号</div><div class="fi-value">${d.contactTel || '─'}</div></div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--g400);">※ 基本情報の変更は <strong>Meets Medical</strong> までご連絡ください</div>
    </div>

    <div class="s-card">
      <div class="sc-ttl">📊 空室情報を更新 <span class="sc-badge sc-var">随時更新</span></div>
      <div class="v-grid">
        <div class="v-grp">
          <span class="v-lbl">現在の空室数</span>
          <input class="v-inp" id="v-vacancy" type="number" value="${v}" min="0" max="999">
          <div class="v-cap">空き室数を入力</div>
        </div>
        <div>
          <div class="f-grp" style="margin-bottom:0">
            <label class="f-lbl">備考・待機状況（任意）</label>
            <textarea class="f-ta" id="v-notes" placeholder="例）現在3名待機中&#10;例）個室のみ空きあり">${d.vacancyNotes || ''}</textarea>
            <div style="font-size:10px;color:var(--g400);margin-top:4px;">満室でも待機状況などを記入できます</div>
          </div>
        </div>
      </div>
      <div class="f-grp">
        <label class="f-lbl">キャンペーン・お知らせ（任意）</label>
        <textarea class="f-ta" id="v-campaign" placeholder="例）6月末まで入居金0円キャンペーン実施中">${d.campaign || ''}</textarea>
      </div>
      <button class="upd-btn" id="upd-btn" onclick="doUpdate('${doc.id}')">✅ 空室情報を今すぐ更新する</button>
    </div>

    <div class="s-card">
      <div class="sc-ttl">📷 施設の写真</div>
      ${currentPhotoUrl
        ? `<img class="photo-current" id="photo-current-img" src="${currentPhotoUrl}" alt="施設写真">`
        : `<div class="photo-placeholder"><div class="photo-placeholder-ico">🏠</div><div class="photo-placeholder-txt">写真が未登録です</div></div>`
      }
      <button class="photo-change-btn" onclick="document.getElementById('photo-file-input').click()">
        📷 ${currentPhotoUrl ? '写真を変更する' : '写真をアップロードする'}
      </button>
      <input type="file" id="photo-file-input" accept="image/*" style="display:none" onchange="onPhotoSelected(this)">
      <div class="photo-new-section" id="photo-new-section" style="display:none">
        <div style="font-size:12px;font-weight:600;color:var(--g600);margin-bottom:8px;">新しい写真のプレビュー</div>
        <img class="photo-preview-img" id="photo-preview-img" src="" alt="プレビュー">
        <div class="photo-action-row">
          <button class="photo-upload-btn" id="photo-upload-btn" onclick="uploadPhoto('${doc.id}')">この写真で保存する</button>
          <button class="photo-cancel-btn" onclick="cancelPhotoSelect()">キャンセル</button>
        </div>
      </div>
    </div>

    <div class="s-card">
      <div class="sc-ttl">🔗 施設公開ページのURL</div>
      <div class="f-grp">
        <label class="f-lbl">病院・紹介先に共有するURL</label>
        <div class="url-row">
          <input class="url-inp" type="text" id="pub-url" value="${publicUrl}" readonly>
          <button class="url-copy" onclick="copyUrl('pub-url')">コピー</button>
        </div>
        <div style="font-size:11px;color:var(--g400);margin-top:4px;">このURLを開くと「${d.name}」の空室情報・基本情報が表示されます</div>
      </div>
      <div class="qr-wrap">
        <div class="qr-box" id="pub-qr"></div>
        <div class="qr-desc">このQRコードを共有すると、スマートフォンからも簡単にアクセスできます。</div>
      </div>
    </div>
  `;

  // QRコード生成
  try {
    new QRCode(document.getElementById('pub-qr'), {
      text: publicUrl,
      width: 102,
      height: 102,
      colorDark: '#0f172a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  } catch(e) {
    document.getElementById('pub-qr').innerHTML = '<div style="font-size:10px;color:var(--g400);padding:4px;">QR生成エラー</div>';
  }
}

async function doUpdate(id) {
  const vacancy  = Math.max(0, parseInt(document.getElementById('v-vacancy').value) || 0);
  const notes    = document.getElementById('v-notes').value.trim();
  const campaign = document.getElementById('v-campaign').value.trim();
  const btn = document.getElementById('upd-btn');
  btn.disabled = true; btn.textContent = '更新中...';
  try {
    await db.collection('facilities').doc(id).update({
      vacancy, vacancyNotes: notes, campaign,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    showToast('✅ 空室情報を更新しました');
  } catch(e) {
    showToast('⚠️ エラーが発生しました。再度お試しください。');
    console.error(e);
  } finally {
    btn.disabled = false; btn.textContent = '✅ 空室情報を今すぐ更新する';
  }
}

function onPhotoSelected(input) {
  if (!input.files || !input.files[0]) return;
  pendingPhotoFile = input.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('photo-preview-img').src = e.target.result;
    document.getElementById('photo-new-section').style.display = 'block';
  };
  reader.readAsDataURL(pendingPhotoFile);
}

function cancelPhotoSelect() {
  pendingPhotoFile = null;
  document.getElementById('photo-file-input').value = '';
  document.getElementById('photo-new-section').style.display = 'none';
}

async function uploadPhoto(id) {
  if (!pendingPhotoFile) return;
  const btn = document.getElementById('photo-upload-btn');
  btn.disabled = true; btn.textContent = 'アップロード中...';
  try {
    const ext = pendingPhotoFile.type.split('/')[1]?.replace('jpeg','jpg') || 'jpg';
    const ref = storage.ref(`facilities/${id}/photo.${ext}`);
    const meta = { contentType: pendingPhotoFile.type };
    await ref.put(pendingPhotoFile, meta);
    const url = await ref.getDownloadURL();
    await db.collection('facilities').doc(id).update({
      photoUrl: url,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    currentPhotoUrl = url;
    pendingPhotoFile = null;
    document.getElementById('photo-new-section').style.display = 'none';
    const curImg = document.getElementById('photo-current-img');
    if (curImg) { curImg.src = url; }
    else {
      const placeholder = document.querySelector('.photo-placeholder');
      if (placeholder) {
        const img = document.createElement('img');
        img.className = 'photo-current'; img.id = 'photo-current-img'; img.src = url; img.alt = '施設写真';
        placeholder.replaceWith(img);
      }
    }
    showToast('✅ 写真をアップロードしました');
  } catch(e) {
    console.error(e);
    showToast('⚠️ アップロードに失敗しました。Meets Medicalにお問い合わせください。');
  } finally {
    btn.disabled = false; btn.textContent = 'この写真で保存する';
  }
}

function copyUrl(inputId) {
  const val = document.getElementById(inputId).value;
  navigator.clipboard.writeText(val).then(() => showToast('📋 URLをコピーしました'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3200);
}
</script>
</body>
</html>
