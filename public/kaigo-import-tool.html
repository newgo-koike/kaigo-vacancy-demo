function log(msg, color) {
  const el = document.getElementById('status');
  const line = document.createElement('div');
  if (color) line.style.color = color;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function runImport() {
  const btn = document.getElementById('btn-import');
  btn.disabled = true; btn.textContent = '実行中...';

  const user = auth.currentUser;
  if (!user) { log('❌ ログインが必要です', '#dc2626'); btn.disabled=false; btn.textContent='▶ インポート開始'; return; }

  const uSnap = await db.collection('users').doc(user.uid).get();
  if (uSnap.data()?.role !== 'admin') { log('❌ 管理者権限が必要です', '#dc2626'); btn.disabled=false; btn.textContent='▶ インポート開始'; return; }

  log('✅ 管理者確認: ' + (uSnap.data().name || user.email));
  log('📦 ' + FACILITIES.length + ' 施設をインポートします...');

  let ok = 0;
  const now = firebase.firestore.FieldValue.serverTimestamp();

  for (let i = 0; i < FACILITIES.length; i += 400) {
    const chunk = FACILITIES.slice(i, i + 400);
    const batch = db.batch();
    for (const f of chunk) {
      batch.set(db.collection('facilities').doc(), { ...f, updatedAt: now, createdAt: now });
    }
    try {
      await batch.commit();
      ok += chunk.length;
      log('  ✓ ' + (i+1) + '〜' + Math.min(i+400, FACILITIES.length) + ' 件目 完了');
    } catch(e) {
      log('  ✗ エラー: ' + e.message, '#dc2626');
    }
  }

  log('━━━━━━━━━━━━━━━━━━━━━━');
  log('✅ 完了: ' + ok + ' 件インポートしました', '#059669');
  btn.disabled=false; btn.textContent='▶ インポート開始';
}

async function clearAll() {
  if (!confirm('facilitiesコレクションを全件削除します。よろしいですか？')) return;
  log('🗑 全件削除中...');
  const snap = await db.collection('facilities').get();
  for (let i = 0; i < snap.docs.length; i += 400) {
    const batch = db.batch();
    snap.docs.slice(i, i+400).forEach(d => batch.delete(d.ref));
    await batch.commit();
    log('  削除 ' + (i+1) + '〜' + Math.min(i+400, snap.docs.length) + ' 件');
  }
  log('✅ ' + snap.docs.length + ' 件削除完了');
}

auth.onAuthStateChanged(u => {
  if (u) log('🔑 ログイン中: ' + u.email);
  else   log('⚠ 未ログイン — kaigo-login.html でログインしてから戻ってください', '#d97706');
});
