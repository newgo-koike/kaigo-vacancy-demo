async function seed() {
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  btn.disabled = true;
  btn.textContent = '追加中...';
  log.innerHTML = '';

  for (const f of DEMO) {
    try {
      await db.collection('facilities').add({
        ...f,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      log.innerHTML += `<div class="ok">✅ ${f.name}</div>`;
    } catch(e) {
      log.innerHTML += `<div class="err">❌ ${f.name}: ${e.message}</div>`;
    }
  }

  btn.textContent = `完了！（${DEMO.length}件追加）`;
  log.innerHTML += `<div style="margin-top:12px;color:white;font-weight:700;">
    → <a href="kaigo-search.html" style="color:#34d399;">検索ページで確認する</a>
  </div>`;
}

async function clearAll() {
  if (!confirm('Firestoreのfacilitiesを全件削除します。よいですか？')) return;
  const log = document.getElementById('log');
  log.innerHTML = '<div style="color:#fbbf24">削除中...</div>';
  try {
    const snap = await db.collection('facilities').get();
    const batch = db.batch();
    snap.docs.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    log.innerHTML = `<div class="ok">✅ ${snap.size}件削除しました</div>`;
  } catch(e) {
    log.innerHTML = `<div class="err">❌ エラー: ${e.message}</div>`;
  }
}
